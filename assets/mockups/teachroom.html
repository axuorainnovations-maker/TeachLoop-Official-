<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, height=750">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin:0; background:#0B0B0E; color:#EDEDED; font-family:'Plus Jakarta Sans',sans-serif; overflow:hidden; }
.avatar-ring {
  box-shadow: 0 0 50px rgba(168, 85, 247, 0.25), inset 0 0 20px rgba(168, 85, 247, 0.3);
}
.glass {
  background: rgba(22, 22, 28, 0.85);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.voice-wave span {
  display: inline-block;
  width: 3.5px;
  background: linear-gradient(180deg, #c084fc, #7c3aed);
  border-radius: 99px;
}
</style>
</head>
<body class="w-[1200px] h-[750px] relative flex flex-col justify-between p-8 select-none">
  <!-- Grid background -->
  <div class="absolute inset-0 pointer-events-none opacity-20" style="background-image: radial-gradient(rgba(255,255,255,0.15) 1px, transparent 1px); background-size: 28px 28px;"></div>
  
  <!-- Top Bar -->
  <div class="relative z-10 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl glass flex items-center justify-center text-[#A1A1AA]">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </div>
      <div>
        <div class="text-[11px] font-bold tracking-[0.14em] text-[#a855f7] uppercase font-mono">Teach Studio • Live AI Student</div>
        <div class="text-[17px] font-bold text-white tracking-tight">Modern History | 20th Century onwards</div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="glass px-3.5 py-1.5 rounded-full flex items-center gap-2 text-[13px] font-semibold text-[#10B981]">
        <span class="w-2 h-2 rounded-full bg-[#10B981] animate-pulse"></span>
        <span>Voice Connected</span>
      </div>
      <div class="glass px-3.5 py-1.5 rounded-full text-[13px] font-mono text-[#A1A1AA]">
        02:45
      </div>
    </div>
  </div>

  <!-- Center Stage: Avatar + Dialogue -->
  <div class="relative z-10 flex flex-col items-center justify-center -mt-2">
    <!-- Student Dialogue Bubble -->
    <div class="glass max-w-[620px] rounded-2xl p-4 px-6 mb-6 text-center border-purple-500/25 shadow-[0_16px_36px_rgba(0,0,0,0.6)]">
      <div class="text-[11.5px] font-bold text-[#c084fc] mb-1 tracking-wide uppercase font-mono">Student (Kai) • Clarifying Question</div>
      <p class="text-[16px] text-white font-semibold leading-relaxed">
        “Why was the Cold War specifically called <span class="text-[#c084fc] underline decoration-purple-400/50 underline-offset-4">‘cold’</span> if there were active wars happening in Korea and Vietnam?”
      </p>
    </div>

    <!-- Student Avatar -->
    <div class="relative w-[180px] h-[180px] rounded-full avatar-ring bg-[#221730] border-2 border-purple-400/30 flex items-center justify-center overflow-hidden">
      <svg width="140" height="140" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="45" fill="#2d1b40"/>
        <rect x="25" y="32" width="50" height="50" rx="14" fill="#fcd34d"/>
        <path d="M22 36C22 24 34 16 50 16C66 16 78 24 78 36V45H22V36Z" fill="#374151"/>
        <circle cx="38" cy="46" r="4.5" fill="#111827"/>
        <circle cx="62" cy="46" r="4.5" fill="#111827"/>
        <circle cx="40" cy="44.5" r="1.5" fill="#ffffff"/>
        <circle cx="64" cy="44.5" r="1.5" fill="#ffffff"/>
        <rect x="29" y="38" width="18" height="16" rx="4" fill="none" stroke="#e5e7eb" stroke-width="2.5"/>
        <rect x="53" y="38" width="18" height="16" rx="4" fill="none" stroke="#e5e7eb" stroke-width="2.5"/>
        <line x1="47" y1="46" x2="53" y2="46" stroke="#e5e7eb" stroke-width="2.5"/>
        <path d="M44 58C47 61 53 61 56 58" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M20 90C20 74 34 70 50 70C66 70 80 74 80 90V100H20V90Z" fill="#4b5563"/>
      </svg>
    </div>

    <!-- Active Voice Waveform -->
    <div class="flex items-center gap-1.5 h-6 mt-4 voice-wave">
      <span style="height: 8px;"></span>
      <span style="height: 16px;"></span>
      <span style="height: 22px;"></span>
      <span style="height: 14px;"></span>
      <span style="height: 24px;"></span>
      <span style="height: 18px;"></span>
      <span style="height: 10px;"></span>
    </div>

    <!-- Live Feedback Pill -->
    <div class="mt-3 flex items-center gap-2 px-4 py-1.5 rounded-full bg-purple-950/60 border border-purple-500/30 text-[12.5px] font-semibold text-[#d8b4fe]">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
      <span>Concept Mastery: 96% • Clear Socratic Distinction</span>
    </div>
  </div>

  <!-- Bottom Dock Controls -->
  <div class="relative z-10 flex items-center justify-center gap-4">
    <div class="glass px-6 py-3 rounded-full flex items-center gap-5 shadow-2xl">
      <button class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-[#A1A1AA]">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
      </button>
      <button class="px-5 py-2.5 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 font-semibold text-[14px] text-white shadow-[0_0_20px_rgba(147,51,234,0.4)] flex items-center gap-2">
        <span>Explain & Speak</span>
        <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
      </button>
      <button class="w-10 h-10 rounded-full bg-red-500/10 text-red-400 hover:bg-red-500/20 flex items-center justify-center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
</body>
</html>
