<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Noura — Onboarding</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.65);
      --card: rgba(255, 255, 255, 0.06);
      --card-hover: rgba(255, 255, 255, 0.11);
      --border: rgba(255, 255, 255, 0.16);
      --sel: rgba(139, 92, 246, 0.18);
      --sel-border: #8b5cf6;
      --green: #8b5cf6;
      --green-2: #a78bfa;
      --btn: #ffffff;
      --btn-text: #111114;
      --btn-disabled: rgba(255, 255, 255, 0.12);
      --btn-disabled-text: rgba(255, 255, 255, 0.42);
    }

    html,
    body {
      height: 100%;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* Gradient lives on <html> only, so the body stays transparent and the
     fixed z-index:-1 aurora layer (#usbg) shows through behind the content. */
    html {
      background:
        radial-gradient(1100px 620px at 50% -10%, rgba(139, 92, 246, 0.45), transparent 60%),
        radial-gradient(900px 600px at 85% 110%, rgba(124, 58, 237, 0.35), transparent 60%),
        linear-gradient(180deg, #0c0a13 0%, #140f22 45%, #0b0a12 100%);
      background-attachment: fixed;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: transparent;
    }

    /* Top bar: back + segmented progress + speaker */
    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 22px 26px 6px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    .back {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      padding: 6px;
      border-radius: 8px;
      display: flex;
      opacity: .9;
    }

    .back:hover {
      background: rgba(255, 255, 255, 0.10);
    }

    .back svg {
      width: 22px;
      height: 22px;
    }

    .back.hidden {
      visibility: hidden;
    }

    /* Skip: forward arrow at the right of the progress bar (mirrors .back) */
    .skip {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      padding: 6px;
      border-radius: 8px;
      display: flex;
      opacity: .9;
      flex-shrink: 0;
    }

    .skip:hover {
      background: rgba(255, 255, 255, 0.10);
    }

    .skip svg {
      width: 22px;
      height: 22px;
    }

    .skip.hidden {
      visibility: hidden;
    }

    .segs {
      flex: 1;
      display: flex;
      gap: 12px;
    }

    .seg {
      flex: 1;
      height: 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    .seg>i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--green);
      border-radius: 999px;
      transition: width .35s cubic-bezier(.2, 0, 0, 1);
    }

    .segs.hidden {
      visibility: hidden;
    }

    .speaker {
      width: 22px;
      height: 22px;
      color: var(--text);
      opacity: .85;
      flex-shrink: 0;
    }

    .speaker.hidden {
      visibility: hidden;
    }

    /* Stage */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 20px 26px 100px;
      text-align: center;
    }

    .screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fade .35s ease;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* Heading with mascot */
    .headrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 26px;
    }

    .headrow .m {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .sub {
      font-size: 16px;
      color: var(--muted);
      margin-top: 10px;
    }

    /* Mascot */
    .mascot {
      width: 56px;
      height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 12px 26px rgba(168, 102, 238, .30));
    }

    .mascot.big {
      width: 118px;
      height: 118px;
    }

    .mascot-center .mascot {
      width: 100%;
      height: 100%;
    }

    .float {
      animation: floaty 3.4s ease-in-out infinite;
    }

    @keyframes floaty {

      0%,
      100% {
        transform: translateY(0) rotate(0);
      }

      50% {
        transform: translateY(-10px) rotate(-2deg);
      }
    }

    /* Intro screen */
    .intro {
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 64vh;
    }

    .intro h1 {
      margin-top: 0;
      line-height: 1.28;
      max-width: 15ch;
    }

    /* Warp entrance for the intro slide — content stretches in from below and
       un-squishes with a spring, behind a purple glow burst. */
    .warp-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .warp-burst {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 62vw;
      max-width: 660px;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: radial-gradient(circle, rgba(139, 92, 246, 0.6), rgba(124, 58, 237, 0) 65%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
      animation: warpBurst 1.1s cubic-bezier(.2, .6, .2, 1) both;
    }

    .warp-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transform-origin: 50% 0;
      animation: warpIn .8s cubic-bezier(.59, 0, .35, 1) both;
    }

    @keyframes warpBurst {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: .35; }
    }

    @keyframes warpIn {
      0% { transform: perspective(1000px) rotateX(-5deg) skewY(-1.5deg) scaleX(.4) scaleY(2) translateY(100px); opacity: 0; }
      55% { opacity: 1; }
      80% { transform: perspective(1000px) rotateX(0) skewY(0) scaleX(1.03) scaleY(.97) translateY(-7px); }
      100% { transform: perspective(1000px) rotateX(0) skewY(0) scaleX(1) scaleY(1) translateY(0); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .warp-content, .warp-burst { animation: none; }
      .warp-burst { opacity: .3; transform: translate(-50%, -50%) scale(1); }
    }

    /* Card grids */
    .cards {
      display: grid;
      gap: 16px;
      margin-top: 24px;
      width: 100%;
    }

    .cards.c4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      max-width: 900px;
    }

    .cards.c3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      max-width: 780px;
    }

    .cards.c2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 520px;
    }

    .cards.c5 {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      max-width: 1080px;
    }

    @media (max-width:820px) {
      .cards.c4, .cards.c5 {
        grid-template-columns: repeat(2, 1fr);
      }

      .cards.c3 {
        grid-template-columns: repeat(1, 1fr);
      }
    }

    .card {
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 18px;
      padding: 26px 18px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: background .15s, border-color .15s, transform .12s;
      min-height: 150px;
      justify-content: center;
    }

    .card:hover {
      background: var(--card-hover);
    }

    .card.sel {
      background: var(--sel);
      border-color: var(--sel-border);
      box-shadow: 0 0 0 1px var(--sel-border), 0 6px 26px rgba(139, 92, 246, 0.28);
    }

    .card:focus,
    .goal:focus {
      outline: none;
    }

    .card:focus-visible,
    .goal:focus-visible {
      outline: 2px solid var(--sel-border);
      outline-offset: 2px;
    }

    .card .emoji {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      line-height: 1;
    }

    /* Fixed icon box keeps every card's icon the same size and vertically aligned,
       so the labels line up evenly across a row. */
    .card .ic {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .card .ic svg {
      width: 36px;
      height: 36px;
    }

    /* Loading skeleton for the subject-adapted level cards */
    .card.skel {
      cursor: default;
      gap: 10px;
    }

    .skel-line {
      height: 11px;
      border-radius: 6px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.07));
      background-size: 200% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
    }

    .skel-line.w50 {
      width: 50%;
    }

    .skel-line.w70 {
      width: 70%;
    }

    .skel-line.w90 {
      width: 90%;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    .card .t {
      font-size: 16px;
      font-weight: 700;
    }

    .card .d {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.35;
    }

    /* Sound screen */
    .sound {
      display: flex;
      gap: 18px;
      margin-top: 24px;
    }

    .sound .tile {
      width: 170px;
      height: 210px;
      border-radius: 20px;
      background: var(--card);
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .sound .tile:hover {
      background: var(--card-hover);
    }

    .sound .tile.sel {
      background: rgba(58, 213, 127, 0.15);
      border-color: var(--sel-border);
    }

    .sound .tile .m {
      width: 74px;
      height: 74px;
    }

    .sound .tile .t {
      font-size: 18px;
      font-weight: 700;
    }

    .sound .tile.off .t {
      color: var(--muted);
    }

    .voicerow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 26px;
      font-size: 16px;
      font-weight: 600;
    }

    .toggle {
      width: 52px;
      height: 30px;
      border-radius: 999px;
      background: #cfe9d8;
      position: relative;
      cursor: pointer;
      transition: background .2s;
    }

    .toggle.on {
      background: #8fe0ad;
    }

    .toggle i {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
      transition: left .2s;
    }

    .toggle.on i {
      left: 25px;
    }

    /* Age input */
    .agebox {
      margin-top: 56px;
      width: min(92vw, 300px);
      position: relative;
    }

    /* Name slide reuses the age box look, just wider for longer text */
    .namebox {
      width: min(92vw, 460px);
    }

    .agebox input {
      width: 100%;
      height: 74px;
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      border-radius: 18px;
      padding: 0 18px;
      font-size: 26px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.5px;
      font-family: inherit;
      outline: none;
      color: var(--text);
      background:
        radial-gradient(120% 90% at 50% -20%, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0) 60%),
        rgba(255, 255, 255, 0.05);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: border-color .15s, box-shadow .15s;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .agebox input::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
      letter-spacing: 0;
    }

    .agebox input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* hide the native square spinner, use rounded custom steppers */
    .agebox input::-webkit-inner-spin-button,
    .agebox input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .stepper {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .stepper button {
      width: 32px;
      height: 18px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #ffffff;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: opacity .15s, transform .08s;
      opacity: .85;
    }

    .stepper button:hover {
      opacity: 1;
    }

    .stepper button:active {
      transform: scale(0.9);
    }

    .stepper button svg {
      width: 15px;
      height: 15px;
      display: block;
    }

    /* Subject folder + free-type input */
    .folderpick {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: min(92vw, 420px);
    }

    .folder-img {
      width: 168px;
      height: auto;
      filter: drop-shadow(0 10px 26px rgba(124, 58, 237, 0.65)) drop-shadow(0 3px 8px rgba(0, 0, 0, 0.45));
    }

    .subject-input {
      width: 100%;
      height: 60px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      border-radius: 16px;
      padding: 0 18px;
      font-size: 17px;
      font-family: inherit;
      outline: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .subject-input::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .subject-input:focus {
      border-color: #ffffff;
    }

    /* Info screens */
    .info-media {
      margin-top: 34px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .experts {
      display: flex;
      gap: 20px;
      align-items: flex-end;
      justify-content: center;
    }

    .founder {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 180px;
    }

    .founder .photo {
      width: 100%;
      height: 210px;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, #2a2140, #17121f);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .founder .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .founder.center {
      width: 214px;
    }

    .founder.center .photo {
      height: 256px;
    }

    .founder .name {
      font-size: 15px;
      font-weight: 700;
      margin-top: 12px;
      color: var(--text);
    }

    .founder .accolade {
      font-size: 11.5px;
      line-height: 1.4;
      color: var(--muted);
      margin-top: 5px;
      text-align: center;
      max-width: 190px;
    }

    @media (max-width:720px) {
      .experts {
        flex-wrap: wrap;
      }

      .founder,
      .founder.center {
        width: 44%;
      }
    }

    .unis {
      margin-top: 34px;
    }

    .unis .lbl {
      font-size: 11px;
      letter-spacing: .12em;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 700;
    }

    .unis .row {
      display: flex;
      gap: 34px;
      align-items: center;
      justify-content: center;
      margin-top: 14px;
      color: var(--text);
      font-weight: 700;
      font-size: 18px;
      flex-wrap: wrap;
    }

    /* Topic map / constellation (approximate) */
    .map {
      position: relative;
      width: min(92vw, 720px);
      height: 320px;
      margin-top: 20px;
    }

    .map .node {
      position: absolute;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .map .node.dim {
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
    }

    .map .node .bar {
      display: block;
      width: 56px;
      height: 6px;
      border-radius: 999px;
      margin: 0 auto 6px;
      background: linear-gradient(90deg, #c4b5fd, #a78bfa);
    }

    .map .dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      opacity: .5;
    }

    .map .mascot-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 88px;
      height: 88px;
    }

    .constell .dot {
      opacity: .55;
    }

    .constell .node {
      color: var(--text);
      font-size: 12px;
    }

    /* Full-bleed animated background (UnicornStudio) for the "starting point" screen */
    #usbg {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0;
      pointer-events: none;
      transition: opacity .7s ease;
    }

    #usbg canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* Legibility scrim over the aurora so headings, cards and inputs stay readable */
    #usbg::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(120% 90% at 50% 0%, rgba(12, 10, 19, 0.30), rgba(12, 10, 19, 0.55));
    }

    body.show-usbg #usbg {
      opacity: 1;
    }

    .startpoint {
      min-height: 66vh;
      align-items: center;
      justify-content: center;
    }

    .startpoint .mascot {
      width: 132px;
      height: 132px;
      filter: drop-shadow(0 14px 40px rgba(168, 102, 238, .55));
    }

    .startpoint .sp-caption {
      margin-top: 30px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55);
    }

    /* Goal timers */
    .goals {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-top: 24px;
      max-width: 900px;
      width: 100%;
    }

    @media (max-width:820px) {
      .goals {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .goal {
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 18px;
      padding: 30px 12px;
      cursor: pointer;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: background .15s, border-color .15s;
    }

    .goal:hover {
      background: var(--card-hover);
    }

    .goal.sel {
      background: var(--sel);
      border-color: var(--sel-border);
      box-shadow: 0 0 0 1px var(--sel-border), 0 6px 26px rgba(139, 92, 246, 0.28);
    }

    .goal .goal-ic {
      width: 46px;
      height: 46px;
      display: block;
    }

    .goal.sel .goal-ic .goal-hand,
    .goal.sel .goal-ic .goal-hub {
      stroke: #fff;
      fill: #fff;
    }

    .goal .t {
      font-size: 17px;
      font-weight: 700;
    }

    .goal .d {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.3;
      text-align: center;
      margin-top: -4px;
    }

    /* Signup */
    .signup {
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-top: 40px;
      max-width: 420px;
    }

    .signup .signup-buddy {
      width: 80px;
      height: 80px;
      margin: 0 auto 22px;
      filter: drop-shadow(0 10px 26px rgba(168, 102, 238, 0.45));
    }

    .signup h1 {
      font-size: 26px;
    }

    .oauth {
      width: 100%;
      height: 56px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 26px;
    }

    .oauth:hover {
      background: #fafafa;
    }

    .oauth svg {
      width: 20px;
      height: 20px;
    }

    .or {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      font-weight: 700;
      margin: 18px 0;
    }

      font-weight: 700;
      margin-top: 16px;
    }

    .signup-btn:hover {
      filter: brightness(1.08);
    }

    .legal {
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
    }

    .legal a {
      color: var(--muted);
    }

    .existing {
      font-size: 14px;
      margin-top: 22px;
    }

    .existing a {
      color: var(--text);
      font-weight: 600;
    }

    /* Continue */
    .foot {
      padding: 10px 26px 34px;
      display: flex;
      justify-content: center;
    }

    .continue {
      width: min(92vw, 360px);
      height: 58px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      background: var(--btn);
      color: var(--btn-text);
      transition: filter .15s;
    }

    .continue:hover {
      filter: brightness(1.1);
    }

    .continue:disabled {
      background: var(--btn-disabled);
      color: var(--btn-disabled-text);
      cursor: not-allowed;
    }

    .foot.hidden {
      display: none;
    }

    /* ── Liquid-glass buttons: clear, glossy, light-catching over the aurora ── */
    .continue,
    .signup-btn,
    .oauth {
      background:
        radial-gradient(130% 90% at 50% -25%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 62%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.05) 55%, rgba(255, 255, 255, 0.12) 100%);
      -webkit-backdrop-filter: blur(20px) saturate(190%) brightness(1.12);
      backdrop-filter: blur(20px) saturate(190%) brightness(1.12);
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: #ffffff;
      box-shadow: inset 0 1.5px 0.5px rgba(255, 255, 255, 0.9), inset 0 -10px 20px rgba(0, 0, 0, 0.08),

      transition: background .18s, box-shadow .18s, transform .08s;

    .signup-btn:hover,
    .oauth:hover {
      filter: none;

    .continue:active:not(:disabled),
    .signup-btn:active,
    .oauth:active {
      transform: translateY(1px);

    .continue:disabled {
      background: rgba(255, 255, 255, 0.06);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.42);
      box-shadow: none;

       above only when the button is enabled). */
    .continue:not(:disabled) {
      background: linear-gradient(180deg, #a78bfa 0%, #7c3aed 100%);
      -webkit-backdrop-filter: none; backdrop-filter: none;
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;

    /* Frost the selectable cards/tiles so the aurora blurs gently behind them */
    .card,

      -webkit-backdrop-filter: blur(9px) saturate(130%);

    }

    .back:hover {

      backdrop-filter: blur(8px);
    }

    /* ── 3D testimonials marquee ── */
    .tm-wrap { position: relative; margin-top: 26px; width: 100%; max-width: 860px; height: 400px; overflow: hidden; border-radius: 22px; perspective: 1000px; }
    .tm-3d { display: flex; gap: 16px; justify-content: center; height: 100%; transform: rotateX(12deg) rotateY(-9deg) rotateZ(6deg) translateZ(-30px) scale(1.05); }
    .tm-col { display: flex; flex-direction: column; }
    .tm-track { display: flex; flex-direction: column; gap: 16px; animation: tmUp var(--dur, 32s) linear infinite; }
    .tm-col.rev .tm-track { animation-name: tmDown; }
    @keyframes tmUp { from { transform: translateY(0); } to { transform: translateY(calc(-50% - 8px)); } }
    @keyframes tmDown { from { transform: translateY(calc(-50% - 8px)); } to { transform: translateY(0); } }
    .tm-card { width: 232px; margin-bottom: 16px; padding: 14px 16px; border-radius: 16px; text-align: left; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.13); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .tm-head { display: flex; align-items: center; gap: 10px; }
    .tm-ava { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 15px; flex-shrink: 0; }
    .tm-name { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .tm-name span { font-size: 12px; }
    .tm-handle { font-size: 12px; color: var(--muted); }
    .tm-body { margin-top: 10px; font-size: 13px; color: rgba(255, 255, 255, 0.86); line-height: 1.42; }
    .tm-wrap::before, .tm-wrap::after { content: ''; position: absolute; left: 0; right: 0; height: 26%; z-index: 3; pointer-events: none; }
    .tm-wrap::before { top: 0; background: linear-gradient(to bottom, #0b0a12, rgba(11, 10, 18, 0)); }
    .tm-wrap::after { bottom: 0; background: linear-gradient(to top, #0b0a12, rgba(11, 10, 18, 0)); }

    /* ── Founders: scroll-through portfolio heroes (purple, black type) ── */
    /* Pinned to the true viewport centre (the shared stage centres between the
       top bar and the taller Continue button, which biases the card upward).
       pointer-events pass through so the top bar + Continue stay clickable. */
    .fh-screen { position: fixed; inset: 0; z-index: 6; width: 100%; align-items: center; justify-content: center; pointer-events: none; }
    .fh-scroll { width: min(96vw, 980px); height: 66vh; margin: 0 auto; overflow-y: auto; scroll-snap-type: none; border-radius: 26px; scrollbar-width: none; -ms-overflow-style: none; background: linear-gradient(180deg, #b7a2ff 0%, #8b5cf6 100%); pointer-events: auto; }
    /* Founders is a tall self-contained card — center it in the stage (drop the
       shared bottom padding that biases other screens' content upward). */
    .stage:has(.fh-screen) { padding-top: 24px; padding-bottom: 24px; }
    .fh-scroll::-webkit-scrollbar { display: none; }
    /* Each founder is a tall section; the inner panel is pinned (sticky) while
       the names converge, so the next founder stays off-screen until you scroll
       past this section. */
    .fh-section { position: relative; height: 296vh; }
    .fh-sticky { position: sticky; top: 0; height: 66vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding: 30px 24px; }
    .fh-stack { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .fh-name { color: #000; font-weight: 800; letter-spacing: -0.05em; line-height: 0.84; text-transform: uppercase; font-size: clamp(56px, 13.5vw, 158px); position: relative; z-index: 1; will-change: transform; transition: transform .12s linear; }
    /* Photo sits in FRONT of the tightly-stacked name, overlapping its centre */
    .fh-photo { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: clamp(118px, 18vw, 180px); height: clamp(160px, 26vw, 250px); border-radius: 999px; overflow: hidden; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32); z-index: 3; }
    .fh-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fh-desc { position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%); color: #000; width: min(440px, 86%); max-width: 440px; text-align: center; font-size: 15px; line-height: 1.5; font-weight: 500; opacity: .82; z-index: 4; }
    .fh-down { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.14); border: none; color: #000; width: 46px; height: 46px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; justify-content: center; animation: fhBounce 1.8s ease-in-out infinite; }
    .fh-down:hover { background: rgba(0, 0, 0, 0.24); }
    .fh-down svg { width: 22px; height: 22px; }
    @keyframes fhBounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(5px); } }
    /* blur-in when a panel scrolls into view */
    /* Photo + description are always fully visible for every founder. */
    @media (prefers-reduced-motion: reduce) { .fh-down { animation: none; } }

    function goalIcon(mins) {
      const c = 2 * Math.PI * 9;                       // circle circumference (r=9)
      const frac = Math.max(0, Math.min(1, mins / 60));
      const dash = (frac * c).toFixed(2);
      const th = frac * 2 * Math.PI;                   // hand angle, clockwise from top
      const hx = (12 + 5 * Math.sin(th)).toFixed(2);

      return `<svg class="goal-ic" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.16)" stroke-width="2.2"/>
        <circle cx="12" cy="12" r="9" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="${dash} ${c.toFixed(2)}" transform="rotate(-90 12 12)"/>
        <line class="goal-hand" x1="12" y1="12" x2="${hx}" y2="${hy}" stroke="#e9e9ee" stroke-width="1.8" stroke-linecap="round"/>
        <circle class="goal-hub" cx="12" cy="12" r="1.6" fill="#e9e9ee"/>

    let idx = 0;

    // Content screens (from name[1] to the last screen) drive the progress bar.
    const contentStart = 1, contentEnd = screens.length - 1; // inclusive
    function updateChrome() {
      const s = screens[idx];
      const isIntro = s.type === 'intro';
      const isSignup = s.type === 'signup';
      backBtn.classList.toggle('hidden', idx === 0);
      skipBtn.classList.toggle('hidden', isIntro); // skip forward, mirrors back
      segs.classList.toggle('hidden', isIntro || isSignup);
      foot.classList.toggle('hidden', isSignup || s.type === 'topicmap'); // signup has its own button; topicmap auto-advances
      // progress across the 3 segments
      if (!isIntro && !isSignup) {
        const pos = idx - contentStart + 1;               // 1..N
        const total = contentEnd - contentStart + 1;
        const p = pos / total;
        segFills.forEach((el, i) => { el.style.width = (Math.max(0, Math.min(1, (p - i / 3) / (1 / 3))) * 100) + '%'; });
      } else if (isSignup) {
        segFills.forEach(el => el.style.width = '100%');
      }
    }

    // Tailor the "How much do you already know?" options to the typed subject.
    // Prefetched the moment the subject is typed so the levels are ready before the
    // user reaches the screen — no generic→adapted flicker. Until ready, the screen
    // shows a loading skeleton; on any failure it falls back to the generic ladder.
    let levelFetchedFor = null;
    async function fetchLevelOptions(subject) {
      subject = (subject || '').trim();
      const scr = screens.find(x => x.key === 'level');
      if (!scr) return;
      if (!subject) { scr.ready = true; scr.options = LEVEL_LADDER; return; }
      if (levelFetchedFor === subject) return;      // already fetching / fetched this subject
      levelFetchedFor = subject;
      scr.ready = false; scr.options = LEVEL_LADDER;   // reset while (re)fetching
      const done = (opts) => {
        if (levelFetchedFor !== subject) return;        // a newer subject superseded this
        scr.options = opts; scr.ready = true;
        if (screens[idx] && screens[idx].key === 'level') render();
      };
      try {
        const sys = 'You generate onboarding UI options. Reply with ONLY minified JSON, no prose.';
        const prompt = `A learner is about to teach the subject "${subject}". List exactly 4 starting knowledge levels for ${subject}, ordered beginner → advanced. Each references real ${subject} content. Return JSON: {"options":[{"t":"1-3 word label","d":"first-person one-liner, e.g. 'I can ...'"}]} — exactly 4 items.`;
        const r = await fetch('/api/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'claude-haiku-4-5', max_tokens: 400, system: sys, messages: [{ role: 'user', content: prompt }] })
        });
        if (!r.ok) { done(LEVEL_LADDER); return; }
        const data = await r.json();
        const txt = Array.isArray(data.content) ? data.content.filter(b => b.type === 'text').map(b => b.text).join('') : '';
        const m = txt.match(/\{[\s\S]*\}/);
        const parsed = m ? JSON.parse(m[0]) : null;
        if (parsed && Array.isArray(parsed.options) && parsed.options.length >= 4) {
          // Always keep "I don't know anything yet" as the first option.
          done([NOTHING_LEVEL].concat(parsed.options.slice(0, 4).map((o, i) => ({
            v: 'lvl' + i,
            t: String(o.t || '').trim().slice(0, 26), d: String(o.d || '').trim().slice(0, 90)
          }))));
        } else { done(LEVEL_LADDER); }
      } catch (e) { done(LEVEL_LADDER); }
    }

    function ensureUsBg() {

        i.onload = function () { try { if (!window.UnicornStudio.isInitialized) { window.UnicornStudio.init(); window.UnicornStudio.isInitialized = true; } } catch (e) { } };

          }).join('');
          html = `<div class="screen active fh-screen">
          <div class="fh-scroll" id="fhScroll">${panels}</div>
        </div>`;
          break;
        }

        case 'topicmap':
          html = `<div class="screen active startpoint">
          ${mascotHTML('float')}
          <div class="sp-caption">Organizing your current starting point</div>
        </div>`;
          break;


        case 'goal':
          html = `<div class="screen active">
          <div class="headrow">${mascotHTML('float')}<h1>What's your daily learning goal?</h1></div>
          <div class="goals">
            ${[['10 min', 'Quick Review'], ['20 min', 'Gain Better Understanding'], ['30 min', 'Develop A Solid Understanding'], ['60 min', 'Recommended for Content Mastery']].map(([t, d]) => `
              <button class="goal ${store.goal === t ? 'sel' : ''}" data-goal="${t}">${goalIcon(parseInt(t, 10))}<span class="t">${t}</span><span class="d">${d}</span></button>`).join('')}
          </div>
        </div>`;
          contBtn.disabled = !store.goal;
          break;

      }
      stage.innerHTML = html;
      wireScreen(s);
    }

    function topicNode(label, xpct, ypct, dim) {
      return `<span class="node ${dim ? 'dim' : ''}" style="left:${xpct}%; top:${ypct}%; transform:translate(-50%,-50%)"><span class="bar"></span>${label}</span>`;
    }
    function constellationDots() {
      const cols = ['#c4b5fd', '#fca5a5', '#86efac', '#fcd34d', '#93c5fd', '#f9a8d4'];
      let out = ''; const rows = 6, colsN = 11;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < colsN; c++) {
          if (Math.abs(r - 2.5) < 0.6 && Math.abs(c - 5) < 0.6) continue;
          const x = 6 + c * 8.2, y = 8 + r * 15, sz = (c + r) % 3 === 0 ? 9 : 6, col = cols[(r * colsN + c) % cols.length];
          out += `<span class="dot" style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;background:${col}"></span>`;
        }
      }
      return out;
    }

    function wireScreen(s) {
      if (s.type === 'experts') {
        const scroll = document.getElementById('fhScroll');
        if (scroll) {
          const sections = [...scroll.querySelectorAll('.fh-section')];
          scroll.querySelectorAll('.fh-down').forEach((btn, i) => {
            btn.addEventListener('click', () => sections[i + 1]?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
          });

          // Sticky-scroll convergence: while a founder's section is pinned, the two
          // names start fully spread (top & bottom) and slide together as you scroll
          // through the section. Only once converged does scrolling reveal the next.
          let raf = 0;
          const updateNames = () => {
            raf = 0;
            const cr = scroll.getBoundingClientRect();
            const maxSpread = cr.height * 0.13;
            sections.forEach(sec => {
              const r = sec.getBoundingClientRect();
              const range = r.height - cr.height;                 // extra scroll room
              const raw = range > 0 ? (cr.top - r.top) / range : 1; // 0 at entry → 1 fully scrolled
              // Section scroll room ≈ 3 screen-heights: names converge over the
              // first 2 (CONVERGE = 2/3), then the last screen-height holds the
              // converged card pinned before scrolling on to the next founder.
              const CONVERGE = 0.667;
              const p = Math.max(0, Math.min(1, raw / CONVERGE));
              const spread = (1 - p) * maxSpread;                 // spread at p=0, converged at p=1
              const names = sec.querySelectorAll('.fh-name');
              if (names.length >= 2) {
                names[0].style.transform = 'translateY(' + (-spread) + 'px)';
                names[1].style.transform = 'translateY(' + spread + 'px)';
              } else if (names[0]) {
                names[0].style.transform = 'none';
              }
            });
          };
          scroll.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(updateNames); }, { passive: true });
          requestAnimationFrame(updateNames);
        }
      }
      if (s.type === 'select') {
        stage.querySelectorAll('.card[data-v]').forEach(c => c.addEventListener('click', () => {
          stage.querySelectorAll('.card').forEach(x => x.classList.remove('sel'));
          c.classList.add('sel'); set(s.key, c.dataset.v); contBtn.disabled = false;
        }));
      }
      if (s.type === 'sound') {
        stage.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
          stage.querySelectorAll('.tile').forEach(x => { x.classList.remove('sel'); x.classList.toggle('off', x.dataset.voice === 'deep'); });
          t.classList.add('sel'); t.classList.toggle('off', false); set('voice_style', t.dataset.voice);
        }));
        const tg = document.getElementById('voiceToggle');
        tg.addEventListener('click', () => { tg.classList.toggle('on'); set('voice_on', tg.classList.contains('on')); });
      }
      if (s.type === 'nameinput') {
        const inp = document.getElementById('nameInput');
        inp.addEventListener('input', () => { set('name', inp.value.trim()); contBtn.disabled = !inp.value.trim(); });
        setTimeout(() => inp.focus(), 40);
      }
      if (s.type === 'subjectinput') {
        const inp = document.getElementById('subjectInput');
        let preT;
        // Prefetch the subject-specific level options while the user is still typing,
        // so the next screen already has them ready (no generic→adapted flicker).
        const prefetch = () => { clearTimeout(preT); preT = setTimeout(() => { if (inp.value.trim()) fetchLevelOptions(inp.value.trim()); }, 500); };
        inp.addEventListener('input', () => { set('subject', inp.value.trim()); contBtn.disabled = !inp.value.trim(); prefetch(); });
        setTimeout(() => inp.focus(), 40);
      }
      if (s.type === 'age') {
        const inp = document.getElementById('ageInput');
        inp.addEventListener('input', () => { set('age', inp.value.trim()); contBtn.disabled = !inp.value.trim(); });
        const bump = (d) => { let v = parseInt(inp.value || '0', 10); if (isNaN(v)) v = 0; v = Math.max(0, Math.min(120, v + d)); inp.value = v; set('age', String(v)); contBtn.disabled = false; };
        stage.querySelector('.step-up')?.addEventListener('click', () => bump(1));
        stage.querySelector('.step-down')?.addEventListener('click', () => bump(-1));
        setTimeout(() => inp.focus(), 40);
      }
      if (s.type === 'goal') {
        stage.querySelectorAll('.goal').forEach(g => g.addEventListener('click', () => {
          stage.querySelectorAll('.goal').forEach(x => x.classList.remove('sel'));
          g.classList.add('sel'); set('goal', g.dataset.goal); contBtn.disabled = false;
        }));
      }
      if (s.type === 'signup') {
        // Optional Supabase backend (configured in supabase-config.js). When the
        // URL + anon key are set, accounts are stored in Supabase; otherwise the
        // app runs local-only (account saved to the browser).
        const sb = (window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase)
          ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;

        // Everything we collected during onboarding — attached to the account.
        const profilePayload = (email) => ({
          email: email || null,
          name: (store.name || '').trim() || null,
          motivation: store.motivation || null,
          improve: store.improve || null,
          age: store.age || null,
          level: store.level || null,
          goal: store.goal || null,
          subject: (store.subject || '').trim() || null,
        });

        const saveLocalAccount = (email, provider) => {
          const acc = profilePayload(email);
          acc.provider = provider || 'email';
          acc.created_at = new Date().toISOString();
          try { localStorage.setItem('NOURA_ACCOUNT', JSON.stringify(acc)); } catch (e) { }
          if (acc.name) { try { localStorage.setItem('TEACHLOOP_NAME', acc.name); } catch (e) { } }
          if (email) { try { localStorage.setItem('NOURA_EMAIL', email); } catch (e) { } }
        };

        const saveSubject = () => {
          const subj = (store.subject || '').trim();
          if (!subj) return;
          try {
            const subs = JSON.parse(localStorage.getItem('TEACHLOOP_SUBJECTS') || '[]');
            if (Array.isArray(subs) && !subs.includes(subj)) { subs.push(subj); localStorage.setItem('TEACHLOOP_SUBJECTS', JSON.stringify(subs)); }
            let rec = JSON.parse(localStorage.getItem('TEACHLOOP_RECENTS') || '[]'); if (!Array.isArray(rec)) rec = [];
            rec = rec.filter(x => x !== subj); rec.unshift(subj); localStorage.setItem('TEACHLOOP_RECENTS', JSON.stringify(rec.slice(0, 8)));
          } catch (e) { }
        };

        const goDashboard = () => {
          try { localStorage.setItem('TEACHLOOP_ONBOARDED', '1'); } catch (e) { }
          document.body.style.transition = 'opacity .3s ease'; document.body.style.opacity = '0';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 300);
        };

        // Real email + password sign-up via Supabase Auth. Creates an account
        // under Authentication → Users and (if confirmations are on) emails a
        // verification link. The profile row is attached after the session
        // exists (immediately, or on the dashboard after they confirm).
        const msgEl = () => document.getElementById('signupMsg');
        const showMsg = (text, isError) => {
          const m = msgEl(); if (!m) return;
          m.style.display = 'block';
          m.textContent = text;
          m.style.color = isError ? '#ff6b6b' : '#c9b6ef';
        };

        const finishEmail = async () => {
          const email = (document.getElementById('emailInput')?.value || '').trim();
          const password = (document.getElementById('passwordInput')?.value || '');
          const btn = document.getElementById('signupBtn');
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showMsg('Please enter a valid email address.', true); return; }
          if (password.length < 6) { showMsg('Password must be at least 6 characters.', true); return; }

          saveSubject();
          saveLocalAccount(email, 'email');

          if (!sb) { goDashboard(); return; }   // local-only fallback (Supabase not configured)

          if (btn) { btn.disabled = true; btn.textContent = 'Creating account…'; }
          // Stash onboarding answers so the dashboard attaches them to the
          // account once the session exists (now, or after email confirmation).
          try { localStorage.setItem('NOURA_PENDING_PROFILE', JSON.stringify(profilePayload(email))); } catch (e) { }
          const redirectTo = window.location.href.replace(/onboarding\.html.*$/, 'dashboard.html');
          try {
            const { data, error } = await sb.auth.signUp({
              email, password,
              options: { data: { name: (store.name || '').trim() || null }, emailRedirectTo: redirectTo }
            });
            if (error) {
              if (btn) { btn.disabled = false; btn.textContent = 'Sign up'; }
              showMsg(error.message || 'Sign-up failed. Please try again.', true);
              return;
            }
            if (data && data.session) {
              // Email confirmations are OFF → signed in immediately.
              try { localStorage.setItem('TEACHLOOP_ONBOARDED', '1'); } catch (e) { }
              goDashboard();
            } else {
              // Confirmations ON → they must click the link in their inbox.
              if (btn) { btn.textContent = 'Confirmation sent'; }
              showMsg('Almost there! We sent a confirmation link to ' + email + '. Open it to finish and land on your dashboard.', false);
            }
          } catch (e) {
            if (btn) { btn.disabled = false; btn.textContent = 'Sign up'; }
            showMsg((e && e.message) || 'Sign-up failed. Please try again.', true);
          }
        };

        // Google sign-up via Supabase OAuth. Falls back to a local account if
        // Supabase isn't configured yet.
        const finishGoogle = async () => {
          saveSubject();
          saveLocalAccount(null, 'google');
          if (sb) {
            // Stash onboarding answers so the dashboard can attach them to the
            // new account once Google redirects back.
            try { localStorage.setItem('NOURA_PENDING_PROFILE', JSON.stringify(profilePayload(null))); } catch (e) { }
            try { localStorage.setItem('TEACHLOOP_ONBOARDED', '1'); } catch (e) { }
            const redirectTo = window.location.href.replace(/onboarding\.html.*$/, 'dashboard.html');
            try {
              const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo } });
              if (error) throw error;
            } catch (e) { alert('Google sign-in error: ' + (e.message || e)); }
          } else {
            goDashboard();   // local-only mode
          }
        };

        document.getElementById('googleBtn').addEventListener('click', finishGoogle);
        document.getElementById('signupBtn').addEventListener('click', finishEmail);
        document.getElementById('emailInput').addEventListener('keydown', e => { if (e.key === 'Enter') finishEmail(); });
        document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') finishEmail(); });
      }
    }

    function go(n) { idx = Math.max(0, Math.min(screens.length - 1, n)); render(); window.scrollTo(0, 0); }

    // End of onboarding → stash the collected answers so the account (created on
    // login.html) attaches them once the session exists, then hand off to the
    // login / sign-up page. From there, auth leads to the dashboard.
    function finishOnboarding() {
      const payload = {
        email: null,
        name: (store.name || '').trim() || null,
        motivation: store.motivation || null,
        improve: store.improve || null,
        age: store.age || null,
        level: store.level || null,
        goal: store.goal || null,
        subject: (store.subject || '').trim() || null,
      };
      try { localStorage.setItem('NOURA_PENDING_PROFILE', JSON.stringify(payload)); } catch (e) { }
      try { localStorage.setItem('TEACHLOOP_ONBOARDED', '1'); } catch (e) { }
      if (payload.name) { try { localStorage.setItem('TEACHLOOP_NAME', payload.name); } catch (e) { } }
      // Add the chosen subject to the sidebar's subject + recents lists.
      const subj = (store.subject || '').trim();
      if (subj) {
        try {
          const subs = JSON.parse(localStorage.getItem('TEACHLOOP_SUBJECTS') || '[]');
          if (Array.isArray(subs) && !subs.includes(subj)) { subs.push(subj); localStorage.setItem('TEACHLOOP_SUBJECTS', JSON.stringify(subs)); }
          let rec = JSON.parse(localStorage.getItem('TEACHLOOP_RECENTS') || '[]'); if (!Array.isArray(rec)) rec = [];
          rec = rec.filter(x => x !== subj); rec.unshift(subj); localStorage.setItem('TEACHLOOP_RECENTS', JSON.stringify(rec.slice(0, 8)));
        } catch (e) { }
      }
      document.body.style.transition = 'opacity .3s ease'; document.body.style.opacity = '0';
      setTimeout(() => { window.location.href = 'login.html'; }, 300);
    }

    // Advance a slide, or finish onboarding when we're on the last screen.
    const advance = () => { if (idx >= screens.length - 1) finishOnboarding(); else go(idx + 1); };
    contBtn.addEventListener('click', advance);
    skipBtn.addEventListener('click', advance);
    backBtn.addEventListener('click', () => go(idx - 1));

    // Pressing Enter advances to the next slide whenever the Continue button is
    // available and enabled — works from inputs (name/age/subject) and select
    // screens alike, and finishes onboarding on the last screen.
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.shiftKey) return;
      if ((e.target && e.target.tagName) === 'TEXTAREA') return;
      if (foot.classList.contains('hidden') || contBtn.disabled) return;
      e.preventDefault();
      advance();
    });

    ensureUsBg();
    render();
  </script>
</body>
