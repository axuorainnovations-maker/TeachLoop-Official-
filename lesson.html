<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noura — Lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
<style>
  :root { --grad: linear-gradient(140deg,#c4b5fd 0%,#a855f7 38%,#7c3aed 72%,#6d28d9 100%); --purple:#8b5cf6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:#0A0A0B; color:#E8E8E6; font-family:'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; }
  button { font-family:'Plus Jakarta Sans','Inter',sans-serif; }

  .grad-logo { display:inline-block; background:var(--grad); -webkit-mask:url('logo.png?v=3') center/contain no-repeat; mask:url('logo.png?v=3') center/contain no-repeat; }
  .grad-text { background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

  /* Top bar */
  .topbar { position:fixed; top:0; left:0; right:0; height:58px; z-index:40; display:flex; align-items:center; gap:16px; padding:0 20px; background:transparent; backdrop-filter:none; border-bottom:none; }
  .brand { display:flex; align-items:center; gap:8px; text-decoration:none; flex-shrink:0; }
  .brand .grad-logo { width:20px; height:20px; }
  .brand span.word { font-size:16px; font-weight:800; letter-spacing:-.3px; }
  .crumb { display:flex; align-items:center; gap:8px; min-width:0; font-size:13.5px; color:#a1a1aa; }
  .crumb a { color:#d4d4d8; text-decoration:none; display:flex; align-items:center; gap:6px; font-weight:500; }
  .crumb a:hover { color:#ffffff; }
  .crumb svg { width:14px; height:14px; flex-shrink:0; }
  .crumb .title { color:#ffffff; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Left rail */
  .rail { position:fixed; top:58px; left:0; bottom:0; width:86px; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-bottom:50px; gap:10px; background:transparent; border-right:none; }
  .rail-item { width:70px; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:6px; border:none; background:transparent !important; outline:none !important; border-radius:12px; color:#8a8a93; font-size:11.5px; font-weight:600; cursor:pointer; transition:background .15s,color .15s; -webkit-tap-highlight-color:transparent; }
  .rail-item svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .rail-item:hover { background:transparent !important; color:#d4d4d8; }
  .rail-item.active { background:transparent !important; color:#fff; }
  .rail-item:focus { outline:none !important; box-shadow:none !important; background:transparent !important; }
  .rail-item.soon { opacity:.55; }
  .rail-item.locked { opacity:.38; cursor:not-allowed; position:relative; }
  .rail-item.locked:hover { background:transparent; color:#8a8a93; }
  .rail-item .rail-lock { position:absolute; top:17px; left:calc(50% + 1px); width:11px; height:11px; stroke:#a855f7; fill:#0c0c0e; stroke-width:2.4; display:none; }
  .rail-item.locked .rail-lock { display:block; }
  .rail-item .rail-lock rect { fill:#0c0c0e; }

  .main { padding:58px 0 90px 86px; min-height:100%; }
  @media (max-width:720px) { .rail { display:none; } .main { padding-left:0; } }

  /* ── Loading view ── */
  .loadwrap { min-height:calc(100vh - 58px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 24px; }
  .load-logo { width:120px; height:120px; position:relative; margin-bottom:34px; }
  .load-logo .grad-logo { width:100%; height:100%; animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.06);opacity:.85;} }
  .load-kicker { font-size:13px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:#b79df5; margin-bottom:18px; }
  .load-title { font-size:clamp(30px,4.6vw,46px); font-weight:800; letter-spacing:-.02em; line-height:1.15; color:#fff; max-width:760px; }
  .load-progress {
    width:min(420px,74vw); height:10px; margin-top:0; border-radius:999px; background:#1c1c20; overflow:hidden;
    box-shadow:inset 0 2px 3px rgba(0,0,0,0.45), inset 0 -1px 2px rgba(255,255,255,0.05);
  }
  .load-progress i {
    display:block; position:relative; overflow:hidden; height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,#7c3aed 0%,#9d7bf5 35%,#c4b5fd 55%,#9d7bf5 78%,#7c3aed 100%);
    box-shadow:0 0 18px rgba(139,92,246,0.55), 0 0 32px rgba(196,181,253,0.35),
               inset 0 1.5px 0 rgba(255,255,255,0.45), inset 0 -2px 3px rgba(60,20,120,0.35);
  }
  /* Bright sheen gliding along the filled part */
  .load-progress i::after {
    content:''; position:absolute; top:0; bottom:0; left:0; width:50%; border-radius:999px;
    background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
    mix-blend-mode:screen; animation:fluxSheen 1.6s linear infinite;
  }
  /* Animated thinking orb rendered on a canvas, centred above the bar */
  @keyframes fluxSheen { from { transform:translateX(-110%); } to { transform:translateX(210%); } }
  @media (prefers-reduced-motion: reduce) { .load-progress i::after { animation:none; opacity:0; } }
  .load-status { margin-top:0; font-size:22px; letter-spacing:-.01em; color:#8a8a93; }
  .load-pct { margin-left:8px; color:#c9b6ef; font-weight:600; }
  .load-status .dots::after { content:''; animation:dots 1.4s steps(4,end) infinite; }
  @keyframes dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} }
  .load-error { margin-top:22px; font-size:14.5px; color:#f0a5a5; max-width:520px; line-height:1.5; }
  .retry-btn { margin-top:16px; padding:11px 26px; border:none; border-radius:999px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:14.5px; font-weight:600; cursor:pointer; }
  .retry-btn:hover { filter:brightness(1.08); }

  /* ── Premium Learn Overview (Contents) View ── */
  .overview { display:none; max-width:820px; margin:0 auto; padding:48px 24px 60px; }
  .ov-head { margin-bottom:32px; }
  .ov-logo { width:130px; height:130px; flex-shrink:0; position:relative; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .ov-logo .grad-logo { width:100%; height:100%; }
  .ov-logo .topic-emoji { font-size:90px; line-height:1; user-select:none; filter:drop-shadow(0 8px 24px rgba(139,92,246,0.35)); }
  .ov-logo lottie-player { width:130px !important; height:130px !important; filter:drop-shadow(0 8px 28px rgba(167,139,250,0.45)); transition:transform .3s ease; }
  .ov-logo lottie-player:hover { transform:scale(1.08); }
  .topic-illu-wrap { position:relative; width:130px; height:130px; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; }
  .topic-illu-wrap lord-icon { width:130px; height:130px; filter:brightness(1.5) contrast(1.1); }
  .topic-3d-img { width:110px; height:110px; object-fit:contain; filter:brightness(1.3) !important; animation:none !important; transform:none !important; user-select:none; pointer-events:none; }
  .ov-title { font-size:clamp(30px,3.8vw,42px); font-weight:800; letter-spacing:-.02em; line-height:1.2; color:#ffffff; }
  .ov-start-row { display:flex; align-items:center; gap:24px; margin-bottom:44px; flex-wrap:wrap; }

  /* Rich Deep Purple PopButton for Start Lesson */
  .start-btn {
    padding: 12px 34px;
    height: 50px;
    border: 2px solid #a78bfa;
    border-bottom: 5px solid #4c1d95;
    border-radius: 14px;
    background: #7c3aed;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
    transition: all 0.1s ease;
    transform-origin: bottom;
  }
  .start-btn:hover {
    background: #8b5cf6;
    border-color: #c4b5fd;
    color: #ffffff;
    box-shadow: 0 8px 22px rgba(139, 92, 246, 0.45);
  }
  .start-btn:active {
    border-bottom-width: 2px;
    transform: translateY(3px) scaleY(0.98);
  }

  .upnext .k { font-size:11px; font-weight:700; letter-spacing:.14em; color:#a1a1aa; text-transform:uppercase; }
  .upnext .v { margin-top:2px; font-size:16px; font-weight:700; color:#ffffff; }

  .contents-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .contents-head h2 { font-size:24px; font-weight:800; letter-spacing:-.01em; color:#ffffff; }
  .contents-head .prog { font-size:13.5px; font-weight:600; color:#a1a1aa; background:rgba(255,255,255,0.05); padding:4px 12px; border-radius:999px; border:1px solid rgba(255,255,255,0.08); }

  /* 100% Dead-Center Aligned Timeline Line */
  .timeline { position:relative; display:flex; flex-direction:column; gap:14px; }
  .timeline::before {
    content:''; position:absolute; left:26px; transform:translateX(-50%); top:var(--tl-top, 22px); height:var(--tl-track, 0px); width:2px;
    background:rgba(255, 255, 255, 0.1); z-index:0;
  }
  /* Green Completed Line */
  .timeline::after {
    content:''; position:absolute; left:26px; transform:translateX(-50%); top:var(--tl-top, 22px); width:3px; border-radius:3px;
    height:var(--tl-fill, 0px);
    background:#419b67;
    box-shadow:0 0 10px rgba(65,155,103,0.45);
    transition:height .35s ease; z-index:0;
  }

  /* Timeline Rows */
  .tl-row {
    position:relative; display:flex; align-items:center; gap:20px; padding:10px 0; transition:all .15s ease; z-index:1;
  }
  .tl-row.locked { opacity:.55; }

  /* Circular Nodes with Crisp Geometry */
  .tl-dot {
    position:relative; z-index:2; width:44px; height:44px; flex-shrink:0; border-radius:50%;
    background:#1c1c20; border:2px solid rgba(255, 255, 255, 0.12); display:flex; align-items:center;
    justify-content:center; font-size:15px; font-weight:700; color:#a1a1aa; transition:all .15s ease;
    margin-left:4px;
  }
  .tl-row.current .tl-dot {
    border-color:#a78bfa; background:#7c3aed; color:#ffffff;
    box-shadow:0 0 16px rgba(139, 92, 246, 0.45);
  }
  .tl-row.done .tl-dot {
    background:#419b67; border-color:#419b67; color:#ffffff;
    box-shadow:0 2px 10px rgba(65,155,103,0.35);
  }
  .tl-row.done .tl-dot svg { stroke:#ffffff; stroke-width:3.2; }
  .tl-dot svg { width:18px; height:18px; }

  .tl-score-done {
    display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:700;
  }
  .tl-score-done svg { width:14px; height:14px; stroke:#419b67; fill:none; stroke-width:3.2; flex-shrink:0; }
  .tl-score-done.green-pct span { color:#419b67; }
  .tl-score-done.yellow-pct span { color:#facc15; }
  .tl-score-done.orange-pct span { color:#f97316; }

  .tl-title { font-size:16px; font-weight:700; color:#f4f4f5; }
  .tl-row.locked .tl-title { color:#71717a; font-weight:600; }

  .tl-meta { margin-left:auto; display:flex; align-items:center; gap:12px; font-size:13.5px; color:#a1a1aa; font-weight:600; }
  .tl-meta svg { width:15px; height:15px; stroke:#71717a; fill:none; stroke-width:1.8; }

  /* Active step card container to the right of node dot */
  .tl-card {
    position:relative; z-index:1; margin-left:0; flex:1; display:flex; align-items:center;
    justify-content:space-between; gap:18px;
    background:rgba(139, 92, 246, 0.08); border:1.5px solid rgba(139, 92, 246, 0.35); border-radius:16px;
    padding:16px 20px; box-shadow:0 4px 20px rgba(124, 58, 237, 0.15);
  }
  .tl-card .tl-title { font-size:16.5px; font-weight:800; color:#ffffff; }
  .tl-card .tl-sub { font-size:13px; color:#c4b5fd; margin-top:3px; font-weight:600; }

  /* Rich Purple PopButton for Start inside active card */
  .tl-start {
    padding: 8px 24px;
    height: 44px;
    border: 2px solid #a78bfa;
    border-bottom: 4px solid #4c1d95;
    border-radius: 12px;
    background: #7c3aed;
    color: #ffffff;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);
    transition: all 0.1s ease;
    transform-origin: bottom;
    flex-shrink: 0;
  }
  .tl-start:hover {
    background: #8b5cf6;
    border-color: #c4b5fd;
    color: #ffffff;
  }
  .tl-start:active {
    border-bottom-width: 2px;
    transform: translateY(2px) scaleY(0.98);
  }

  .tl-scorepill { padding:4px 12px; border-radius:999px; font-size:12.5px; font-weight:700; border:1px solid; }
  .tl-scorepill.perfect { color:#4ade80; border-color:rgba(74,222,128,0.4); background:rgba(74,222,128,0.12); }
  .tl-scorepill.good { color:#c4b5fd; border-color:rgba(167,139,250,0.4); background:rgba(167,139,250,0.12); }
  .tl-scorepill.low { color:#facc15; border-color:rgba(250,204,21,0.4); background:rgba(250,204,21,0.12); }
  .tl-scorepill.done-pill { color:#a1a1aa; border-color:rgba(255,255,255,0.1); background:rgba(255,255,255,0.04); font-weight:600; }
  .tl-review { padding:6px 16px; border:1px solid #3f3f46; border-radius:10px; background:#27272a; color:#f4f4f5; font-size:13px; font-weight:600; cursor:pointer; transition:background .15s ease; }
  .tl-review:hover { background:#3f3f46; color:#ffffff; }

  /* ── Study Brief ── */
  .brief { display:none; max-width:880px; margin:0 auto; padding:48px 28px 40px; }
  /* ── HeroUI Table Component Styles ── */
  .heroui-table-container {
    width: 100%;
    margin: 16px 0 28px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: #18181b;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  }
  .heroui-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .heroui-table th {
    background: rgba(109, 40, 217, 0.28);
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    text-transform: none;
    letter-spacing: normal;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(139, 92, 246, 0.25);
  }
  .heroui-table td {
    padding: 14px 20px;
    color: #f4f4f5;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .heroui-table tr:last-child td {
    border-bottom: none;
  }
  .heroui-table tr:hover td {
    background: rgba(255, 255, 255, 0.03);
  }
  .heroui-chip {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
  }
  .heroui-chip-success {
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
  }
  .heroui-chip-warning {
    background: rgba(234, 179, 8, 0.15);
    color: #facc15;
  }
  .heroui-chip-danger {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
  }
  .heroui-chip-purple {
    background: rgba(168, 85, 247, 0.15);
    color: #c084fc;
  }
  @media (max-width:760px) { .br-grid { grid-template-columns:1fr; } }

  /* ── 3D PopButton Style for Lesson Navigation ── */
  .flow-foot {
    margin-top: 32px;
    margin-bottom: 24px;
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .flow-btn {
    width: 100%;
    height: 52px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    background: #8b5cf6;
    border: 2px solid #8b5cf6;
    border-bottom: 5px solid #6d28d9;
    border-radius: 16px;
    cursor: pointer;
    user-select: none;
    transition: all 0.1s ease;
    transform-origin: bottom;
    box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
  }
  .flow-btn:hover {
    background: #7c3aed;
    border-color: #7c3aed;
    color: #ffffff;
  }
  .flow-btn:active {
    border-bottom-width: 2px;
    transform: translateY(3px) scaleY(0.98);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  }

  /* Animated shimmer for loading labels — a highlight sweeps across the text. */
  .shimmer-text {
    display:inline-block; white-space:pre;
    background-image:linear-gradient(90deg,#a1a1aa 0%,#a1a1aa 42%,#ffffff 50%,#a1a1aa 58%,#a1a1aa 100%);
    background-size:200% 100%;
    background-repeat:repeat-x;
    -webkit-background-clip:text; background-clip:text;
    color:#a1a1aa;
    animation:textShimmer 2.4s linear infinite;
  }
  @keyframes textShimmer {
    from { background-position:200% center; }
    to   { background-position:0% center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .shimmer-text { animation:none; color:#a1a1aa; -webkit-text-fill-color:#a1a1aa; }
  }

  /* Loading screens show only the status text and the progress bar. */
  .loadwrap .load-logo, .loadwrap .load-kicker, .loadwrap .load-title,
  .tab-load .grad-logo { display:none !important; }
  .loadwrap .load-status { order:1; margin:0 0 20px; }
  .loadwrap .load-progress { order:2; }
  /* While loading, pin the block to the content area so text + bar sit dead
     centre of the page regardless of each tab's own padding. */
  .is-loading .tab-load {
    position:fixed; top:58px; left:86px; right:0; bottom:0;
    padding:0 20px; margin:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  @media (max-width:720px) { .is-loading .tab-load { left:0; } }
  .loadwrap {
    position:fixed; top:58px; left:86px; right:0; bottom:0;
    min-height:0; padding:0 20px; margin:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  @media (max-width:720px) { .loadwrap { left:0; } }
  .tab-load .load-progress { margin-top:0; }
  .tab-load .tab-load-txt { order:1; margin:0 0 20px; }
  .tab-load .load-progress { order:2; }

  /* Shared loading block for the side tabs (same bar as the Learn tab) */
  .tab-load { display:flex; flex-direction:column; align-items:center; padding:64px 20px; }
  .tab-load .grad-logo { width:46px; height:46px; animation:pulse 2.6s ease-in-out infinite; }
  .tab-load-txt { margin-top:0; font-size:22px; letter-spacing:-.01em; color:#8a8a93; }
  .tab-load .load-progress { margin-top:18px; }

  /* ── Recall Layout (Simplified & Clean) ── */
  .recall { display:none; max-width:680px; margin:0 auto; padding:16px 20px 60px; }
  .rc-meta { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
  .rc-count { font-size:13px; font-weight:600; color:#8e8e93; }
  .rc-tally { display:flex; align-items:center; gap:14px; }
  .rc-tally span { font-size:13.5px; font-weight:700; color:#ffffff; display:inline-flex; align-items:center; gap:5px; border:none; background:transparent; padding:0; }
  .rc-tally .g, .rc-tally .a, .rc-tally .f { color:#ffffff; border:none; background:transparent; }

  .rc-bar { height:4px; border-radius:99px; background:rgba(255,255,255,0.06); overflow:hidden; margin-bottom:20px; position:relative; }
  .rc-bar i { display:block; height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#a78bfa,#8b5cf6); transition:width .35s cubic-bezier(0.16,1,0.3,1); }

  /* Question Prompt Header matching Image 1 */
  .rc-prompt-wrap { margin-bottom:24px; text-align:left; }
  .rc-prompt {
    font-family:'Plus Jakarta Sans','Inter',-apple-system,sans-serif !important;
    font-size:25px !important;
    font-weight:800 !important;
    line-height:1.35 !important;
    color:#ffffff !important;

  .br-example { font-size:15px; line-height:1.65; color:#cfc6ea; }
  .br-cta { margin-top:22px; display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; background:#161618; border:1px solid rgba(139,92,246,0.32); border-radius:16px; padding:18px 22px; }
  .br-cta-txt { font-size:16px; font-weight:700; color:#fff; }

  .br-cta-btn:hover { filter:brightness(1.07); }

  .br-loading .grad-logo { width:26px; height:26px; animation:pulse 2.6s ease-in-out infinite; }
  .is-loading .br-head { display:none !important; }
  /* ── Audio Recap player (podcast-style) ────────────────────── */
  /* The recap title already appears inside the player card, so the page-level
     kicker and heading are redundant here — keep only the Regenerate action. */

  #castView .br-head { margin-bottom:0; justify-content:flex-end; }
</style>

<body>

<div class="topbar">
  <div class="crumb">
    <a href="chatbot.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      Home
    </a>
    <span>›</span>
    <span class="title" id="crumbTitle">Lesson</span>
  </div>
</div>

<div class="rail">
  <button class="rail-item active" type="button" id="railBrief">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
    Study Brief
  </button>
  <button class="rail-item" type="button" id="railLearn">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    Learn
  </button>
  <button class="rail-item" type="button" id="railCheck">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m8 12 2.5 2.5L16 9"/></svg>
    Checkpoint
  </button>
  <button class="rail-item" type="button" id="railRecall">
    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="16" height="12" rx="2"/><path d="M6 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>
    Recall
  </button>
  <button class="rail-item" type="button" id="railCast">
    <svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>

</div>

<div class="main">
  <!-- Generating -->
  <div class="loadwrap" id="loadView" style="display:none;">
    <div class="load-logo"><span class="grad-logo"></span></div>
    <div class="load-kicker">Writing your lesson</div>
    <h1 class="load-title" id="loadTitle">Your lesson</h1>

    <div class="load-error" id="loadError" hidden></div>
    <button class="retry-btn" id="retryBtn" type="button" hidden>Try again</button>
  </div>

  <!-- Overview / contents -->
  <div class="overview" id="overview">
    <div class="ov-head">
      <div class="br-kicker">Learn</div>
      <h1 class="br-title" id="ovTitle"></h1>
    </div>
    <div class="ov-start-row">
      <button class="start-btn" id="startLessonBtn" type="button">Start lesson</button>
      <div class="upnext"><div class="k">Up next</div><div class="v" id="upNext"></div></div>
    </div>

      <h2>Contents</h2>
      <div class="prog" id="ovProg"></div>
    </div>

  </div>

  <!-- Study Brief -->
  <div class="brief" id="briefView">
    <div class="br-head hero-head">
      <div class="ov-hero">
        <div class="ov-logo" id="brLogo"><span class="grad-logo"></span></div>
        <h1 class="ov-title" id="brTitle"></h1>
      </div>
      <button class="br-regen" id="brRegen" type="button" title="Regenerate">Regenerate</button>
    </div>

  <!-- Audio Recap -->

    <div class="br-head">
      <button class="br-regen" id="scRegen" type="button" title="Regenerate">Regenerate</button>
      <button class="flow-btn-top" id="castContinueBtn" type="button">Continue</button>
    </div>

  <!-- Checkpoint -->
  <div class="checkpoint" id="checkView">
    <div class="br-head">
      <div>
        <div class="br-kicker">Checkpoint</div>
        <h1 class="br-title" id="cpTitle"></h1>
      </div>
      <button class="br-regen" id="cpRegen" type="button" title="Regenerate">Regenerate</button>
    </div>

  <!-- Recall -->
  <div class="recall" id="recallView">
    <button class="br-regen" id="rcRegen" type="button" title="Regenerate" style="display:none;">Regenerate</button>
    <div id="rcBody"></div>
  </div>

  <!-- Player -->
  <div class="player" id="player">
    <div class="pl-top">
      <div class="pl-label" id="plLabel"></div>

    <div class="pl-bar"><i id="plBarFill"></i></div>
    <div id="plBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const title = (params.get('title') || 'Your lesson').trim();
  const subject = (params.get('subject') || '').trim();
  const slug = title.toLowerCase();
  const DATA_KEY = 'NOURA_LESSON_V2_' + slug;
  const STATE_KEY = 'NOURA_LESSON_STATE_' + slug;

  document.title = 'Noura — ' + title;
  document.getElementById('crumbTitle').textContent = title;
  document.getElementById('loadTitle').textContent = title;
  document.getElementById('ovTitle').textContent = title;

  // Opening a lesson counts as studying → keep the streak alive.
  try {
    const d = new Date();
    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const arr = JSON.parse(localStorage.getItem('TEACHLOOP_ACTIVE_DAYS') || '[]');
    if (Array.isArray(arr) && arr.indexOf(ds) === -1) { arr.push(ds); localStorage.setItem('TEACHLOOP_ACTIVE_DAYS', JSON.stringify(arr)); }
  } catch (e) {}

  // Toast + coming-soon rail
  const toast = document.getElementById('toast');
  let toastT = null;
  function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('show'), 2200); }
  document.querySelectorAll('.rail-item.soon').forEach(b => b.addEventListener('click', () => showToast(b.dataset.soon + ' — coming soon')));

  const loadView = document.getElementById('loadView');
  const overview = document.getElementById('overview');
  const player = document.getElementById('player');
  const loadStatus = document.getElementById('loadStatus');
  const loadError = document.getElementById('loadError');
  const retryBtn = document.getElementById('retryBtn');

  let lesson = null;   // { title, overview, items:[{type:'checkpoint'|'section', title, questions|pages}] }
  let state = { done: [], scores: {}, answers: {} };
  try { const st = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); if (st && Array.isArray(st.done)) state = { done: st.done, scores: st.scores || {}, answers: st.answers || {} }; } catch (e) {}
  function saveState() { try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {} }
  const isDone = i => state.done.indexOf(i) !== -1;
  function markDone(i) { if (!isDone(i)) { state.done.push(i); saveState(); } }
  function firstIncomplete() { for (let i = 0; i < lesson.items.length; i++) if (!isDone(i)) return i; return -1; }
  function isLocked(i) { for (let j = 0; j < i; j++) if (!isDone(j)) return true; return false; }
  function totalScore() { let n = 0; for (const k in state.scores) n += state.scores[k]; return n; }

  function md(text) {
    const html = marked.parse(String(text || ''), { gfm: true, breaks: false });
    return html;
  }
  // ── Plain-language maths ────────────────────────────────────
  // The models sometimes reply with LaTeX ($F(x)=\int_{-\infty}^{x} f(t)dt$),
  // which is unreadable to a learner if it is not typeset. We ask for plain
  // wording in every prompt, and run this over all generated text so anything
  // already cached — or any slip — still reads as ordinary words and numbers.
  const GREEK = {
    alpha:'alpha', beta:'beta', gamma:'gamma', delta:'delta', epsilon:'epsilon',
    theta:'theta', lambda:'lambda', mu:'mu', pi:'pi', rho:'rho', sigma:'sigma',
    tau:'tau', phi:'phi', omega:'omega', Delta:'Delta', Sigma:'Sigma', Omega:'Omega'
  };
  function plainMath(str) {
    if (typeof str !== 'string' || str.indexOf('\\') === -1 && str.indexOf('$') === -1) return str;
    let t = str;

    // Drop the math delimiters themselves.
    t = t.replace(/\$\$([\s\S]*?)\$\$/g, ' $1 ').replace(/\$([^$\n]*?)\$/g, '$1');

    // Integrals, sums, limits → spoken form.
    t = t.replace(/\\int\s*_\{?([^{}\s]*)\}?\s*\^\s*\{?([^{}\s]*)\}?/g,
      (m, a, b) => 'the integral from ' + a + ' to ' + b + ' of');
    t = t.replace(/\\int/g, 'the integral of');
    t = t.replace(/\\sum\s*_\{?([^{}]*)\}?\s*\^\s*\{?([^{}]*)\}?/g,
      (m, a, b) => 'the sum from ' + a + ' to ' + b + ' of');
    t = t.replace(/\\sum/g, 'the sum of');
    t = t.replace(/\\lim\s*_\{?([^{}]*?)\\to([^{}]*?)\}?(?=\s|$)/g,
      (m, v, a) => 'the limit as ' + v.trim() + ' approaches ' + a.trim() + ' of');
    t = t.replace(/\\lim/g, 'the limit of');
    t = t.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '($1)/($2)');
    t = t.replace(/\\sqrt\s*\{([^{}]*)\}/g, 'the square root of ($1)');

    // Symbols → words the learner already knows.
    t = t.replace(/\\infty/g, 'infinity')
         .replace(/\\times/g, ' times ').replace(/\\cdot/g, ' times ')
         .replace(/\\div/g, ' divided by ')
         .replace(/\\pm/g, ' plus or minus ')
         .replace(/\\leq|\\le\b/g, ' <= ').replace(/\\geq|\\ge\b/g, ' >= ')
         .replace(/\\neq|\\ne\b/g, ' is not equal to ')
         .replace(/\\approx/g, ' is about ')
         .replace(/\\to|\\rightarrow/g, ' to ')
         .replace(/\\in\b/g, ' in ')
         .replace(/\\prime/g, "'");
    t = t.replace(/\\(alpha|beta|gamma|delta|epsilon|theta|lambda|mu|pi|rho|sigma|tau|phi|omega|Delta|Sigma|Omega)\b/g,
      (m, g) => GREEK[g] || g);

    // Structural noise.
    t = t.replace(/\\left|\\right/g, '')
         .replace(/\\!|\\,|\;|\\:/g, ' ')
         .replace(/\\text\s*\{([^{}]*)\}/g, '$1')
         .replace(/\\mathrm\s*\{([^{}]*)\}/g, '$1')
         .replace(/\\begin\{[^}]*\}|\\end\{[^}]*\}/g, ' ');

    // Superscripts / subscripts in a form people read normally.
    t = t.replace(/\^\s*\{([^{}]*)\}/g, '^$1').replace(/_\s*\{([^{}]*)\}/g, '_$1');
    t = t.replace(/\^2\b/g, ' squared').replace(/\^3\b/g, ' cubed');

    // Anything left over, plus tidy spacing.
    t = t.replace(/\\[a-zA-Z]+/g, '').replace(/[{}]/g, '');
    return t.replace(/[ \t]{2,}/g, ' ').replace(/\s+([,.;:!?])/g, '$1').trim();
  }
  // Walk a parsed object and clean every string it holds.
  function plainMathDeep(v) {
    if (typeof v === 'string') return plainMath(v);
    if (Array.isArray(v)) return v.map(plainMathDeep);
    if (v && typeof v === 'object') {
      const o = {};
      for (const k in v) if (Object.prototype.hasOwnProperty.call(v, k)) o[k] = plainMathDeep(v[k]);
      return o;
    }
    return v;
  }

  function mathify(el) {
    if (window.renderMathInElement) renderMathInElement(el, { delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false });
  }

  // Guided-flow completion state (declared early: the rail lock logic reads it).
  const FLOW_KEY = 'NOURA_FLOW_' + slug;
  let flow = {};
  try { const f = JSON.parse(localStorage.getItem(FLOW_KEY) || '{}'); if (f && typeof f === 'object') flow = f; } catch (e) {}

  // ── Views ──
  const briefView = document.getElementById('briefView');
  const recallView = document.getElementById('recallView');
  const checkView = document.getElementById('checkView');
  const castView = document.getElementById('castView');
  const railLearn = document.getElementById('railLearn');
  const railBrief = document.getElementById('railBrief');
  const railRecall = document.getElementById('railRecall');
  const railCheck = document.getElementById('railCheck');
  const railCast = document.getElementById('railCast');
  function show(view) {
    loadView.style.display = view === 'load' ? 'flex' : 'none';
    overview.style.display = view === 'overview' ? 'block' : 'none';
    player.style.display = view === 'player' ? 'block' : 'none';
    briefView.style.display = view === 'brief' ? 'block' : 'none';
    recallView.style.display = view === 'recall' ? 'block' : 'none';
    checkView.style.display = view === 'check' ? 'flex' : 'none';
    castView.style.display = view === 'cast' ? 'block' : 'none';
    railBrief.classList.toggle('active', view === 'brief');
    railRecall.classList.toggle('active', view === 'recall');
    railCheck.classList.toggle('active', view === 'check');
    railCast.classList.toggle('active', view === 'cast');
    railLearn.classList.toggle('active', ['brief','recall','check','cast'].indexOf(view) === -1);
    window.scrollTo(0, 0);
  }
  // Tabs unlock in order: each one needs the previous step finished.
  const RAIL = [
    { key: 'brief',  btn: railBrief,  label: 'Study Brief', needs: null,     open: () => openBrief() },
    { key: 'learn',  btn: railLearn,  label: 'Learn',       needs: 'brief',  open: () => { if (lesson) renderOverview(); else generate(false); } },
    { key: 'check',  btn: railCheck,  label: 'Checkpoint',  needs: 'brief',  open: () => openCheck() },
    { key: 'recall', btn: railRecall, label: 'Recall',      needs: 'check',  open: () => openRecall() },
    { key: 'cast',   btn: railCast,   label: 'Audio Recap',  needs: 'recall', open: () => openCast() }
  ];
  const LOCK_SVG = '<svg class="rail-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const RAIL_LABEL = {};
  RAIL.forEach(r => { RAIL_LABEL[r.key] = r.label; r.btn.insertAdjacentHTML('beforeend', LOCK_SVG); });

  // A tab unlocks only when every step before it is complete, so a stale flag
  // on one step can't skip the ones ahead of it.
  function railLocked(r) {
    const i = RAIL.findIndex(x => x.key === r.key);
    for (let j = 0; j < i; j++) if (!flow[RAIL[j].key]) return true;
    return false;
  }
  // The first incomplete step before this tab — used for the "finish X first" hint.
  function railBlocker(r) {
    const i = RAIL.findIndex(x => x.key === r.key);
    for (let j = 0; j < i; j++) if (!flow[RAIL[j].key]) return RAIL[j];
    return null;
  }
  function refreshRailLocks() {
    RAIL.forEach(r => r.btn.classList.toggle('locked', railLocked(r)));
  }
  RAIL.forEach(r => r.btn.addEventListener('click', () => {
    if (railLocked(r)) {
      const blocker = railBlocker(r);
      showToast('Finish ' + (blocker ? blocker.label : 'the previous step') + ' first to unlock ' + r.label);
      return;
    }
    r.open();
  }));
  refreshRailLocks();

  const STAR = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 16.9 6.2 19.8l1.6-6.6L2.6 8.8l6.8-.5z"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  const LOCK = '<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

  function renderOverview() {
    // Reachable before the lesson exists (e.g. the "Next: Learn" flow button,
    // now that Study Brief comes first). Build it instead of rendering a shell.
    if (!lesson || !Array.isArray(lesson.items) || !lesson.items.length) { generate(false); return; }
    show('overview');
    const cur = firstIncomplete();
    const ovLogoEl = document.getElementById('ovLogo');
    if (ovLogoEl) {
      renderTopicIllustration(ovLogoEl, title, subject);
    }
    document.getElementById('upNext').textContent = cur === -1 ? 'All complete' : lesson.items[cur].title;
    document.getElementById('startLessonBtn').textContent = cur === -1 ? 'Review lesson' : (state.done.length ? 'Continue lesson' : 'Start lesson');
    document.getElementById('ovProg').textContent = state.done.length + ' of ' + lesson.items.length + ' complete';

    const tl = document.getElementById('timeline');
    tl.innerHTML = '';
    lesson.items.forEach((item, i) => {
      const row = document.createElement('div');
      const done = isDone(i), locked = isLocked(i), current = (i === cur);
      row.className = 'tl-row' + (done ? ' done' : '') + (locked ? ' locked' : '') + (current ? ' current' : '');

      const dot = document.createElement('div');
      dot.className = 'tl-dot';
      dot.innerHTML = done ? CHECK : (item.type === 'checkpoint' ? STAR : String(seqNum(i)));
      row.appendChild(dot);

      if (current) {
        // Highlighted card for the item that's up next
        const card = document.createElement('div');
        card.className = 'tl-card';
        const info = document.createElement('div');
        info.innerHTML = '<div class="tl-title"></div><div class="tl-sub"></div>';
        info.querySelector('.tl-title').textContent = item.title;
        info.querySelector('.tl-sub').textContent = item.type === 'checkpoint'
          ? 'Checkpoint · answers lock after one attempt'
          : item.pages.length + (item.pages.length === 1 ? ' page' : ' pages');
        card.appendChild(info);
        const btn = document.createElement('button');
        btn.className = 'tl-start'; btn.type = 'button'; btn.textContent = 'Start';
        btn.style.marginLeft = 'auto';
        btn.addEventListener('click', () => openItem(i));
        card.appendChild(btn);
        row.appendChild(card);
      } else {
        const t = document.createElement('div');
        t.className = 'tl-title'; t.textContent = item.title;
        row.appendChild(t);
        const meta = document.createElement('div');
        meta.className = 'tl-meta';
        let metaHtml = '';
        if (done && item.type === 'checkpoint') {
          // Completed checkpoint → show score % with green checkmark
          const sc = state.scores[i] || 0, tot = (item.questions || []).length || 1;
          const pct = Math.round((sc / tot) * 100);
          const colClass = pct >= 80 ? 'green-pct' : (pct >= 50 ? 'yellow-pct' : 'orange-pct');
          metaHtml += '<span class="tl-score-done ' + colClass + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="#419b67" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>' +
            '<span>' + pct + '%</span>' +
          '</span>';
        } else if (done) {
          metaHtml += '<span class="tl-score-done green-pct">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="#419b67" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>' +
            '<span>100%</span>' +
          '</span>';
        } else if (item.type === 'checkpoint') {
          metaHtml += '<span>Checkpoint</span>';
        } else {
          metaHtml += '<span>' + item.pages.length + (item.pages.length === 1 ? ' page' : ' pages') + '</span>';
        }
        if (locked) metaHtml += LOCK;
        meta.innerHTML = metaHtml;
        if (done) {
          const rb = document.createElement('button');

  // Time-based progress bar shared by the side tabs. Eases toward 92%
  // while the request is in flight, then snaps to 100% on completion.
  // ── Streaming chat ──────────────────────────────────────────
  // Streams the model's reply over SSE so the loader can follow real
  // generation progress instead of guessing from a timer. `onText` is called
  // with the running output length after every delta.
  async function streamChat(payload, onText) {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({}, payload, { stream: true }))
    });
    if (!r.ok) {
      let msg = 'HTTP ' + r.status;
      try { const j = await r.json(); if (j && j.error) msg = j.error.message || msg; } catch (e) {}
      throw new Error(msg);
    }
    // No streaming body available (very old browser) — fall back to one shot.
    if (!r.body || !r.body.getReader) {
      const data = await r.json();
      if (data.error) throw new Error(data.error.message || 'API error');
      return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '', apiErr = null;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (line.slice(0, 5) !== 'data:') continue;
        const raw = line.slice(5).trim();
        if (!raw) continue;
        let ev; try { ev = JSON.parse(raw); } catch (e) { continue; }
        if (ev.type === 'content_block_delta' && ev.delta && typeof ev.delta.text === 'string') {
          text += ev.delta.text;
          if (onText) onText(text.length);
        } else if (ev.type === 'error' && ev.error) {
          apiErr = ev.error.message || 'stream error';
        }
      }
    }
    if (apiErr) throw new Error(apiErr);
    if (!text) throw new Error('Empty response.');
    return text;
  }


  // Sets the shimmer text and scales the highlight to the label length,
  // mirroring the reference component's dynamic spread.
  function applyShimmer(el, text) {

  }

  // Loader whose bar is driven by real generation progress. `expectChars` is
  // the rough output size we asked the model for; `report(n)` feeds it the
  // characters received so far. A slow time-based creep runs underneath so the
  // bar still moves during the initial wait before the first token lands.
  function tabLoading(host, label, expectChars, calKey) {
    const view = host.parentElement;
    if (view) view.classList.add('is-loading');
    host.innerHTML = '<div class="tab-load"><span class="grad-logo"></span>' +
      '<div class="tab-load-txt"><span class="lbl shimmer-text"></span></div>' +
      '<div class="load-progress"><i></i></div></div>';
    applyShimmer(host.querySelector('.lbl'), label);
    const fill = host.querySelector('.load-progress i');
    return driveBar(fill, view, expectChars, calKey);
  }

  // Shared bar driver: eases the painted width toward the real target every
  // frame, so the bar glides instead of stepping.
  // Remembers how many characters each generator actually produced last time,
  // so the bar's denominator converges on reality instead of staying a guess.
  function calChars(key, fallback) {
    try {
      const v = parseFloat(localStorage.getItem('NOURA_CAL_' + key) || '');
      if (isFinite(v) && v > 200) return v;
    } catch (e) {}
    return fallback;
  }
  function learnChars(key, actual) {
    if (!key || !(actual > 200)) return;
    try {
      const prev = parseFloat(localStorage.getItem('NOURA_CAL_' + key) || '') || actual;
      localStorage.setItem('NOURA_CAL_' + key, String(Math.round(prev * 0.6 + actual * 0.4)));
    } catch (e) {}
  }

  function driveBar(fill, view, expectChars, calKey) {
    const started = Date.now();
    let shown = 0, chars = 0, finishing = false, ended = false;
    let raf = 0, timer = 0, last = Date.now();
    if (calKey) expectChars = calChars(calKey, expectChars);

    function computeTarget() {
      if (finishing) return 100;
      // Real progress once tokens arrive; capped so it never claims to be done.
      const real = expectChars > 0 ? Math.min(0.97, chars / expectChars) : 0;
      // Pre-token creep: eases to ~18% during the wait before the first token.
      const creep = 0.18 * (1 - Math.exp(-(Date.now() - started) / 2600));
      return Math.max(real, creep) * 100;
    }

    // Time-based easing, so the motion is identical whether it is driven at
    // 120fps or by the fallback timer in a throttled background tab.
    function step() {
      if (ended) return;
      const now = Date.now();
      const dt = Math.min(250, now - last);
      last = now;
      const target = computeTarget();
      shown += (target - shown) * (1 - Math.exp(-dt / 170));
      if (target - shown < 0.15) shown = target;
      fill.style.width = shown.toFixed(2) + '%';
      if (finishing && shown >= 99.9) { fill.style.width = '100%'; halt(); }
    }

    function frame() { step(); if (!ended) raf = requestAnimationFrame(frame); }
    function halt() { ended = true; cancelAnimationFrame(raf); clearInterval(timer); }

    raf = requestAnimationFrame(frame);
    timer = setInterval(step, 60);   // keeps moving when rAF is throttled

    const clearFlag = function () { if (view) view.classList.remove('is-loading'); };
    return {
      // Called from the stream as text arrives.
      report: function (n) { chars = n; },
      done: function () { finishing = true; learnChars(calKey, chars); clearFlag(); },
      stop: function () { halt(); clearFlag(); }
    };
  }

      if (colonIdx > 0 && colonIdx < 50) {
        return '<b>' + s.slice(0, colonIdx + 1) + '</b>' + s.slice(colonIdx + 1);
      }
      const words = s.split(' ');
      if (words.length > 4) {
        return '<b>' + words.slice(0, 3).join(' ') + '</b> ' + words.slice(3).join(' ');
      }
      return '<b>' + s + '</b>';
    };

    const li = arr => '<ul>' + arr.map(x => '<li>' + formatBullet(x) + '</li>').join('') + '</ul>';

      '<div class="heroui-table-container"><table class="heroui-table"><thead><tr>' +

  async function openBrief(force) {

  // ── Recall ──────────────────────────────────────────────────

  const RECALL_KEY = 'NOURA_RECALL_' + slug;

  function rcTally() {
    let got = 0, almost = 0, forgot = 0;

  async function openRecall(force) {

  // ── Checkpoint ──────────────────────────────────────────────
  // A short understanding check: one question at a time, immediate
  // feedback, a follow-up after mistakes, then a summary with next steps.
  const CHECK_KEY = 'NOURA_CHECK_' + slug;
  const CP_TYPES = { mc: 'Multiple choice', short: 'Short answer', reasoning: 'Why / how', misconception: 'Misconception check', scenario: 'Apply it' };
  let check = null, checkBusy = false;
  let cpIndex = 0, cpResults = [], cpStartTime = null;

  document.getElementById('cpTitle').textContent = title;

  function validCheck(q) {
    return Array.isArray(q) && q.length >= 3 && q.every(c =>
      c && c.q && c.concept && CP_TYPES[c.type] && c.why &&

  function renderCheckQuestion() {
    const brHead = document.querySelector('#checkView .br-head');

    document.getElementById('cpRegen').hidden = true;

    if (cpIndex === 0) cpStartTime = Date.now();

    const total = check.length;
    if (cpIndex >= total) { renderCheckSummary(); return; }
    const item = check[cpIndex];
    let picked = -1;

    cpBody.innerHTML =
      '<div class="cp-meta" style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;">' +
        '<div class="cp-count" style="font-size:14px;font-weight:600;color:#8a8a9e;">' + (cpIndex + 1) + ' / ' + total + '</div>' +
      '</div>' +
      '<div class="cp-bar"><i style="width:' + Math.round(((cpIndex + 1) / total) * 100) + '%;"></i></div>' +
      '<div class="cp-card-wrap">' +
        '<div class="cp-card">' +
          '<div class="cp-q"></div>' +
          '<div id="cpAnswerArea"></div>' +
          '<div class="cp-action-row" id="cpActionRow">' +
            '<button class="cp-submit-btn" id="cpSubmit" type="button" disabled>Check</button>' +
          '</div>' +
          '<div id="cpFeedback"></div>' +
        '</div>' +
      '</div>';

    cpBody.querySelector('.cp-q').textContent = item.q;

    const area = document.getElementById('cpAnswerArea');
    const submit = document.getElementById('cpSubmit');

    if (item.type === 'mc') {
      const wrap = document.createElement('div');
      wrap.className = 'cp-opts';
      item.options.forEach((opt, oi) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'cp-opt';
        b.innerHTML =
          '<div class="opt-left">' +
            '<span class="opt-radio"></span>' +
            '<span class="txt"></span>' +
          '</div>' +
          '<span class="cp-opt-icon"></span>';
        b.querySelector('.txt').textContent = opt;
        b.addEventListener('click', () => {
          if (b.classList.contains('locked')) return;
          picked = oi;
          wrap.querySelectorAll('.cp-opt').forEach(o => o.classList.remove('sel'));
          b.classList.add('sel');
          submit.disabled = false;
        });
        wrap.appendChild(b);
      });
      area.appendChild(wrap);
    } else {
      const ta = document.createElement('textarea');
      ta.className = 'cp-input'; ta.id = 'cpText';
      ta.placeholder = 'Answer in a sentence or two…';
      ta.spellcheck = false;

      submit.disabled = true;

        correct = picked === item.answer;
        feedback = correct ? item.why : (item.whyWrong || item.why);
        area.querySelectorAll('.cp-opt').forEach((o, oi) => {
          o.classList.add('locked');
          const iconEl = o.querySelector('.cp-opt-icon');
          if (oi === item.answer) {
            o.classList.remove('sel');
            o.classList.add('correct');
            if (iconEl) iconEl.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

            o.classList.remove('sel');
            o.classList.add('wrong');

        const ta = document.getElementById('cpText');
        ta.readOnly = true;
        submit.textContent = 'Checking…';
        const graded = await gradeOpen(item, ta.value.trim());
        correct = graded.correct;

  // Grade an open-ended answer. Falls back to self-marking if the call fails.
  async function gradeOpen(item, answer) {
    if (!answer) return { correct: false, feedback: 'No answer given.' };
    try {
      const system = 'You grade one short student answer. Reply with ONLY valid JSON: {"correct": boolean, "feedback": string}. Mark correct:true if the answer captures the key idea, even if worded loosely or incomplete in wording - you are testing understanding, not memorised phrasing. feedback: 1-2 short sentences. If correct, say briefly why it is right. If not, name the specific mistake and state the correct idea. Address the student as "you". No preamble.';
      const user = 'Question: ' + item.q + '\nIdeal answer: ' + item.ideal + '\nStudent answer: ' + answer;
      const r = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 400, system: system, messages: [{ role: 'user', content: user }] })
      });
      const data = await r.json();
      const raw = Array.isArray(data.content) ? data.content.filter(b => b.type === 'text').map(b => b.text).join('').trim() : '';
      const a = raw.indexOf('{'), b = raw.lastIndexOf('}');
      const parsed = JSON.parse(raw.slice(a, b + 1));
      if (typeof parsed.correct !== 'boolean') throw new Error('bad grade');
      return { correct: parsed.correct, feedback: String(parsed.feedback || '') };
    } catch (e) {
      return { correct: null, feedback: 'Could not auto-check that one — compare your answer with the ideal answer below.' };
    }
  }

  async function openCheck(force) {
    show('check');
    if (!title || title === 'Your lesson') { renderCheckEmpty(); return; }
    if (check && !force) { renderCheckQuestion(); return; }
    if (!force) {
      try { const c = JSON.parse(localStorage.getItem(CHECK_KEY) || 'null'); if (validCheck(c)) { check = plainMathDeep(c); cpIndex = 0; cpResults = []; renderCheckQuestion(); return; } } catch (e) {}
    }
    if (checkBusy) return;
    checkBusy = true;
    const prog = renderCheckLoading();
    const system = 'You are Noura, a study tutor writing a short UNDERSTANDING CHECK (not a memorisation quiz). Reply with ONLY a valid JSON array, no markdown fences, no commentary. Schema: [{"type": one of "mc"|"short"|"reasoning"|"misconception"|"scenario", "concept": string (2-4 word label for the idea being tested, used to report strong/weak areas), "q": string (the question), "options": [string x4] (ONLY for type mc), "answer": number 0-based (ONLY for type mc), "ideal": string (the ideal answer, 1-2 sentences - required for every non-mc type), "why": string (1-2 sentences explaining why the correct answer is right), "whyWrong": string (ONLY for mc: 1 sentence naming the likely mistake), "followUp": string (REQUIRED for every question - one short follow-up question to ask if the student gets it wrong, pushing them to reason rather than recall)} x5]. EVERY object must include concept, why and followUp. Use FIVE questions covering five different types: one mc, one short, one reasoning (why/how), one misconception check, one scenario (apply it). Questions must test understanding of the topic, be concise, and be answerable in a sentence or two. No numbering in the question text. MATHS MUST BE PLAIN READABLE TEXT: never use LaTeX, never use dollar signs, backslash commands, \\frac, \\int, \\infty, ^{} or _{}. Write maths with ordinary letters, numbers and symbols the way a person types it in a message - for example "F(x) = the integral from negative infinity to x of f(t) dt", "x squared", "3/4", "the square root of 2", "pi", "<=". Spell out symbol names in words.';
    const user = 'Write the Checkpoint questions for the topic: "' + title + '".' + (subject ? (' It is part of the subject "' + subject + '".') : '') + ' Depth: motivated high-school / intro-college student unless the title implies otherwise.';
    try {
      const raw = (await streamChat(
        { model: 'claude-haiku-4-5-20251001', max_tokens: 3000, system: system, messages: [{ role: 'user', content: user }] },
        n => prog.report(n)
      )).trim();
      const a = raw.indexOf('['), b = raw.lastIndexOf(']');
      if (a === -1 || b === -1) throw new Error('No JSON in response.');
      const parsed = JSON.parse(raw.slice(a, b + 1)).filter(c =>
        c && c.q && c.concept && CP_TYPES[c.type] && c.why &&
        (c.type !== 'mc' || (Array.isArray(c.options) && c.options.length >= 2 && typeof c.answer === 'number')) &&
        (c.type === 'mc' || c.ideal)).slice(0, 5);
      if (!validCheck(parsed)) throw new Error('Questions incomplete.');
      prog.done();
      check = plainMathDeep(parsed); cpIndex = 0; cpResults = [];
      try { localStorage.setItem(CHECK_KEY, JSON.stringify(parsed)); } catch (e) {}
      renderCheckQuestion();
    } catch (err) {
      prog.stop();
      renderCheckError('Could not build your Checkpoint (' + err.message + '). Tap Regenerate to try again.');
    } finally { checkBusy = false; }
  }

        '<div class="pc-tr" id="pcTr">' +
          segs.map((sg, i) =>
            '<div class="pc-seg" data-seg="' + i + '">' +
              '<div class="pc-seg-head"><span class="pc-seg-name">' + esc(sg.label) + '</span></div>' +
              '<div class="pc-seg-text">' + esc(sg.text) + '</div>' +
            '</div>').join('') +
        '</div>' +
        '<div id="pcAnswer"></div>' +
      '</div>' +
      '<div class="pc-ask-wrap"><div class="pc-ask-inner"><div class="pc-ask">' +
        '<input id="pcAsk" type="text" placeholder="Ask about this recap…" autocomplete="off">' +
        '<button class="pc-ask-btn" id="pcAskBtn" type="button">' + PC.mic + '<span>Ask</span></button>' +
      '</div></div></div>';

    markFlow('cast');
    wireCastPlayer(segs);
  }

  function wireCastPlayer(segs) {
    const playBtn = document.getElementById('pcPlay');
    const state = document.getElementById('pcState');
    const note = document.getElementById('pcNote');
    const seek = document.getElementById('pcSeek');
    const fill = document.getElementById('pcFill');
    const knob = document.getElementById('pcKnob');
    const curEl = document.getElementById('pcCur');
    const durEl = document.getElementById('pcDur');
    const speedBtn = document.getElementById('pcSpeed');
    const tr = document.getElementById('pcTr');
    const SPEEDS = [1, 1.25, 1.5, 2];

    // No word-level timings come back from TTS, so segment starts are derived
    // from character share of the whole script — accurate enough to follow along.
    const lens = segs.map(sg => sg.text.length);
    const total = lens.reduce((a, b) => a + b, 0) || 1;
    let starts = [];
    function computeStarts(dur) {
      starts = []; let acc = 0;
      for (let k = 0; k < lens.length; k++) { starts.push((acc / total) * dur); acc += lens[k]; }
    }

    let live = -1;
    function syncTranscript(t) {
      let idx = 0;
      for (let k = 0; k < starts.length; k++) if (t >= starts[k]) idx = k;
      if (idx === live) return;
      live = idx;
      tr.querySelectorAll('.pc-seg').forEach((el, k) => {
        el.classList.toggle('live', k === idx);
        el.classList.toggle('past', k < idx);
      });
      const el = tr.querySelector('.pc-seg.live');
      if (el && document.getElementById('pcAuto').classList.contains('on')) {
        el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }

    function paint() {
      const d = castAudio && castAudio.duration ? castAudio.duration : 0;
      const t = castAudio ? castAudio.currentTime : 0;
      const pct = d ? Math.min(100, (t / d) * 100) : 0;
      fill.style.width = pct + '%';
      knob.style.left = 'calc(' + pct + '% - 6px)';
      curEl.textContent = fmtTime(t);
      durEl.textContent = fmtTime(d);
      if (d) syncTranscript(t);
    }
    function syncPlayIcon() {
      const playing = castAudio && !castAudio.paused && !castAudio.ended;
      playBtn.innerHTML = playing
        ? '<svg viewBox="0 0 14 14"><path d="M2 1.2C2 .54 2.54 0 3.2 0H5.2C5.86 0 6.4 .54 6.4 1.2V12.8C6.4 13.46 5.86 14 5.2 14H3.2C2.54 14 2 13.46 2 12.8V1.2Z"/><path d="M8 1.2C8 .54 8.54 0 9.2 0H11.2C11.86 0 12.4 .54 12.4 1.2V12.8C12.4 13.46 11.86 14 11.2 14H9.2C8.54 14 8 13.46 8 12.8V1.2Z"/></svg>'
        : '<svg viewBox="0 0 14 14"><path d="M3 1.3C3 .6 3.75.2 4.35.56L12.1 6.26C12.66 6.6 12.66 7.4 12.1 7.74L4.35 13.44C3.75 13.8 3 13.4 3 12.7V1.3Z"/></svg>';
      playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    }
    function bindAudio() {
      castAudio.playbackRate = castRate;
      castAudio.ontimeupdate = paint;
      castAudio.onloadedmetadata = () => { computeStarts(castAudio.duration || 0); paint(); };
      castAudio.onended = () => { syncPlayIcon(); state.textContent = 'Finished — replay any time'; };
      castAudio.onplay = () => { syncPlayIcon(); state.textContent = 'Playing'; };
      castAudio.onpause = () => { syncPlayIcon(); if (!castAudio.ended) state.textContent = 'Paused'; };
    }
    if (castAudio) {
      bindAudio(); syncPlayIcon();
      computeStarts(castAudio.duration || 0); paint();
      state.textContent = castAudio.paused ? (castAudio.currentTime ? 'Paused' : 'Ready to play') : 'Playing';
    }

    // Synthesize voice audio and await metadata load before completing loading screen
    async function prepareCastAudio(prog) {
      if (castAudio && castAudio.duration) return castAudio;
      if (prog) prog.report(85);
      const r = await fetch('/api/tts', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: castScript(cast) })
      });
      if (!r.ok) {
        let msg = 'HTTP ' + r.status;
        try { const j = await r.json(); msg = j.error || msg; } catch (e) {}
        throw new Error(msg);
      }
      const blob = await r.blob();
      castUrl = URL.createObjectURL(blob);
      castAudio = new Audio(castUrl);
      bindAudio();
      await new Promise((resolve) => {
        if (castAudio.readyState >= 1 && castAudio.duration) { resolve(); return; }
        castAudio.onloadedmetadata = () => { computeStarts(castAudio.duration || 0); paint(); resolve(); };
        castAudio.onerror = () => resolve();
        setTimeout(resolve, 3500);
      });
      return castAudio;
    }

    function generateAudio() {
      if (castAudio && castAudio.duration) return Promise.resolve(castAudio);
      if (castGen) return castGen;
      state.textContent = 'Preparing audio…';
      note.innerHTML = '';
      castGen = prepareCastAudio().then(a => {
        state.textContent = 'Ready to play';
        return a;
      }).catch(err => {
        castGen = null;
        state.textContent = 'Audio unavailable';
        note.innerHTML = '<div class="pc-note">' + esc(err.message) + '</div>';
      });
      return castGen;
    }

    playBtn.addEventListener('click', async () => {
      if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
      if (answerAudio && !answerAudio.paused) { answerAudio.pause(); }
      if (castAudio) { if (castAudio.paused) castAudio.play(); else castAudio.pause(); return; }
      playBtn.disabled = true;
      try {
        const a = await generateAudio();
        playBtn.disabled = false;
        if (a) { a.play(); syncPlayIcon(); }
      } catch (err) { playBtn.disabled = false; }
    });

    // Start synthesising immediately unless it is already done or running.
    if (!castAudio && !castGen) generateAudio();

    speedBtn.addEventListener('click', () => {
      castRate = SPEEDS[(SPEEDS.indexOf(castRate) + 1) % SPEEDS.length];
      speedBtn.querySelector('span').textContent = castRate + 'x';
      if (castAudio) castAudio.playbackRate = castRate;
    });
    seek.addEventListener('click', (e) => {
      if (!castAudio || !castAudio.duration) return;
      const rect = seek.getBoundingClientRect();
      castAudio.currentTime = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * castAudio.duration;
      paint();
    });

    const hideBtn = document.getElementById('pcHide');
    hideBtn.addEventListener('click', () => {
      const hidden = tr.style.display === 'none';
      tr.style.display = hidden ? '' : 'none';
      hideBtn.querySelector('span').textContent = hidden ? 'Hide Transcript' : 'Show Transcript';
    });
    document.getElementById('pcAuto').addEventListener('click', (e) => e.currentTarget.classList.toggle('on'));

    // Ask a question about this recap; answered from the recap text itself.
    const askIn = document.getElementById('pcAsk');
    const askBtn = document.getElementById('pcAskBtn');
    const answer = document.getElementById('pcAnswer');
    async function ask() {
      const q = askIn.value.trim();
      if (!q) return;

      // Immediately pause main recap audio & any previous speech if playing
      if (castAudio && !castAudio.paused) {
        castAudio.pause();
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (answerAudio) {
        answerAudio.pause();
        answerAudio = null;
      }
      if (answerUrl) {
        URL.revokeObjectURL(answerUrl);
        answerUrl = null;
      }

      askBtn.disabled = true;
      answer.innerHTML = '<div class="pc-answer"><span class="shimmer-text">Thinking…</span></div>';
      try {
        const text = await streamChat({
          model: 'claude-haiku-4-5-20251001', max_tokens: 700,
          system: 'You are Noura, answering a learner\'s question about an audio recap they just heard. Answer in 2-4 plain sentences using the recap below; if it does not cover the answer, say so briefly and then answer from your own knowledge. MATHS MUST BE PLAIN READABLE TEXT: no LaTeX, no dollar signs, no backslash commands.\n\nRECAP:\n' + castScript(cast),
          messages: [{ role: 'user', content: q }]
        });
        const ansText = text.trim();
        answer.innerHTML = '<div class="pc-answer">' + md(ansText) + '</div>';
        askIn.value = '';

        // Instant zero-delay voice response using native SpeechSynthesis!
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const cleanText = ansText.replace(/[*_#`~]/g, '');
          const utter = new SpeechSynthesisUtterance(cleanText);
          utter.rate = castRate || 1;
          const voices = window.speechSynthesis.getVoices();
          const preferred = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Daniel') || v.name.includes('Karen') || v.name.includes('Siri'))) || voices.find(v => v.lang.startsWith('en'));
          if (preferred) utter.voice = preferred;
          window.speechSynthesis.speak(utter);
        } else {
          try {
            const r = await fetch('/api/tts', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: ansText })
            });
            if (r.ok) {
              const blob = await r.blob();
              answerUrl = URL.createObjectURL(blob);
              answerAudio = new Audio(answerUrl);
              answerAudio.playbackRate = castRate;
              answerAudio.play();
            }
          } catch (ttsErr) {
            console.warn('Answer TTS playback error:', ttsErr);
          }
        }
      } catch (err) {
        answer.innerHTML = '<div class="pc-note">' + esc(err.message) + '</div>';
      } finally { askBtn.disabled = false; }
    }
    askBtn.addEventListener('click', ask);
    askIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
  }

  async function openCast(force) {
    show('cast');
    if (!title || title === 'Your lesson') { renderCastEmpty(); return; }
    if (cast && !force) { renderCast(); return; }
    if (!force) {
      try {
        const c = JSON.parse(localStorage.getItem(CAST_KEY) || 'null');
        if (validCast(c)) {
          cast = c;
          renderCast();
          return;
        }
      } catch (e) {}
    } else {
      cast = null;
      try { localStorage.removeItem(CAST_KEY); } catch (e) {}
      if (castAudio) { castAudio.pause(); }
      if (answerAudio) { answerAudio.pause(); answerAudio = null; }
      if (castUrl) { URL.revokeObjectURL(castUrl); }
      if (answerUrl) { URL.revokeObjectURL(answerUrl); answerUrl = null; }
      castAudio = null; castUrl = null; castGen = null;
    }
    if (castBusy) return;
    castBusy = true;
    const prog = renderCastLoading();
    const system = 'You are Noura, writing a short spoken-word study recap that will be read aloud by a text-to-speech voice. Reply with ONLY a valid JSON object, no markdown fences, no commentary. Schema: {"intro": string (one warm opening line, must start with "Here\'s your quick recap of" and name the topic), "recap": [string x4-6] (the main recap, each item one spoken paragraph of 50-80 words, conversational, explaining the topic clearly and building in order), "pausePoints": [string x3] (each a spoken instruction telling the listener to pause and think, e.g. "Pause for a second. Can you explain why this matters in your own words?"), "questions": [string x3] (short reflection questions to ask the listener), "mistakes": [string x2] (each names a common misunderstanding and corrects it, spoken aloud), "summary": string (a 40-60 word spoken recap of the most important ideas)}. Write for the EAR: plain spoken sentences, no headings, no bullet characters, no markdown, no symbols, no LaTeX, no numbers written as formulas - spell out any maths in words. Total speaking time should be about 2-4 minutes.';
    const user = 'Write the Audio Recap for the topic: "' + title + '".' + (subject ? (' It is part of the subject "' + subject + '".') : '') + ' Depth: motivated high-school / intro-college student unless the title implies otherwise.';
    try {
      const raw = (await streamChat(
        { model: 'claude-haiku-4-5-20251001', max_tokens: 3000, system: system, messages: [{ role: 'user', content: user }] },
        n => prog.report(n)
      )).trim();
      let clean = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
      const a = clean.indexOf('{'), b = clean.lastIndexOf('}');
      if (a === -1 || b === -1) throw new Error('No JSON in response.');
      const parsed = JSON.parse(clean.slice(a, b + 1));
      if (!validCast(parsed)) throw new Error('Script incomplete.');
      cast = parsed;
      try { localStorage.setItem(CAST_KEY, JSON.stringify(parsed)); } catch (e) {}

      // Fast UI unlock: Finish progress bar as soon as script text is ready!
      prog.done();
      renderCast();
    } catch (err) {
      cast = null;
      try { localStorage.removeItem(CAST_KEY); } catch (e) {}
      prog.stop();
      renderCastError('Could not build your Audio Recap (' + err.message + '). Tap Regenerate to try again.');
    } finally { castBusy = false; }
  }
  document.getElementById('scRegen').addEventListener('click', () => openCast(true));
  if (document.getElementById('castContinueBtn')) {
    document.getElementById('castContinueBtn').addEventListener('click', () => {
      window.location.href = 'chatbot.html';
    });
  }

  // ── Generation ──
  const statusLines = ['Getting started', 'Planning the sections', 'Writing explanations and examples', 'Building your checkpoints', 'Polishing your lesson'];
  let statusIdx = 0;

  function okItem(it) {
    return (it && it.type === 'section' && it.title && Array.isArray(it.pages) && it.pages.length) ||
      (it && it.type === 'checkpoint' && it.title && Array.isArray(it.questions) && it.questions.length &&
        it.questions.every(qq => qq && qq.q && Array.isArray(qq.options) && qq.options.length >= 2 && typeof qq.answer === 'number'));
  }
  function validLesson(o) { return !!(o && Array.isArray(o.items) && o.items.length && o.items.every(okItem)); }

  // Keep only well-formed items so a truncated or partly malformed response
  // still yields a usable lesson instead of failing outright.
  function cleanLesson(o) {
    if (!o || !Array.isArray(o.items)) return null;
    const items = o.items.filter(okItem);
    if (!items.length) return null;
    return { title: o.title || title, items: items };
  }

  // Tolerant JSON reader: parses normally, and if the model's reply was cut
  // off mid-array, rewinds to the last complete item and closes the JSON.
  function readLessonJSON(raw) {
    const a = raw.indexOf('{');
    if (a === -1) throw new Error('No JSON in response.');
    const b = raw.lastIndexOf('}');
    if (b > a) { try { return JSON.parse(raw.slice(a, b + 1)); } catch (e) {} }
    const body = raw.slice(a);
    let depth = 0, inStr = false, esc = false;
    const cuts = [];
    for (let i = 0; i < body.length; i++) {
      const ch = body[i];
      if (esc) { esc = false; continue; }
      if (ch === '\\') { esc = true; continue; }
      if (ch === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (ch === '{' || ch === '[') depth++;
      else if (ch === '}' || ch === ']') { depth--; if (depth === 2) cuts.push(i); }
    }
    for (let k = cuts.length - 1; k >= 0; k--) {
      try {
        const o = JSON.parse(body.slice(0, cuts[k] + 1) + ']}');
        if (o && Array.isArray(o.items) && o.items.length) return o;
      } catch (e) {}
    }
    throw new Error('The reply was cut off.');
  }

  async function generate(force) {
    if (!force) {
      try { const c = JSON.parse(localStorage.getItem(DATA_KEY) || 'null'); if (validLesson(c)) { lesson = plainMathDeep(c); renderOverview(); return; } } catch (e) {}
    } else {
      state = { done: [], scores: {} }; saveState();
    }
    show('load');
    loadError.hidden = true; retryBtn.hidden = true; loadStatus.hidden = false;
    statusIdx = 0;
    const fill = document.getElementById('loadProgressFill');
    document.getElementById('loadProgress').style.display = 'block';
    // A full lesson runs ~9000 characters of JSON; the bar tracks that.
    const LESSON_CHARS = 9000;
    const prog = driveBar(fill, null, LESSON_CHARS, 'lesson');
    // Status line advances with real output, not a stopwatch.
    let lastIdx = -1;
    function setStatus(chars) {
      const i = Math.min(statusLines.length - 1, Math.floor((chars / LESSON_CHARS) * statusLines.length));
      if (i === lastIdx) return;
      lastIdx = i; statusIdx = i;
      loadStatus.innerHTML = '<span class="lbl"></span>';
      applyShimmer(loadStatus.querySelector('.lbl'), statusLines[i] + '…');
    }
    setStatus(0);

    const system = 'You are Noura, an expert study tutor who builds structured interactive lessons. Reply with ONLY a valid JSON object - no markdown fences, no commentary. Schema: {"title": string, "items": [ {"type":"checkpoint","title":"Warm-up","questions":[{"q":string,"options":[string,string,string,string],"answer":number (0-based index),"explain":string} x4]} , {"type":"section","title":string,"pages":[string x2]} x3 , one mid "checkpoint" (title "Checkpoint") after the first 2 sections with 4 questions, and a final "checkpoint" (title "Final checkpoint") at the end with 4 questions ]. The FIRST item must be the Warm-up checkpoint testing intuition before teaching. Each page is GitHub-flavored Markdown, 90-130 words, starting with a ## heading, using **bold** key terms, short paragraphs or bullets, one concrete example; write all maths in plain readable text (see the maths rule below). Questions must be answerable from the lesson (warm-up = common-sense intuition), each with exactly 4 options and a one-sentence explain. Include fill-in-the-blank style questions where the question string contains "___________" for the blank slot to be filled by the correct option. Keep the whole lesson tight and readable in 10-15 minutes. Be concise - no filler. MATHS MUST BE PLAIN READABLE TEXT: never use LaTeX, never use dollar signs, backslash commands, \\frac, \\int, \\infty, ^{} or _{}. Write maths with ordinary letters, numbers and symbols the way a person types it in a message - for example "F(x) = the integral from negative infinity to x of f(t) dt", "x squared", "3/4", "the square root of 2", "pi", "<=". Spell out symbol names in words.';
    const user = 'Build the interactive lesson titled: "' + title + '".' + (subject ? (' It is part of the subject "' + subject + '".') : '') + ' Depth: motivated high-school / intro-college student unless the title implies otherwise.';

    try {
      const raw = (await streamChat(
        { model: 'claude-haiku-4-5-20251001', max_tokens: 8000, system: system, messages: [{ role: 'user', content: user }] },
        n => { prog.report(n); setStatus(n); }
      )).trim();
      const parsed = cleanLesson(readLessonJSON(raw));
      if (!parsed) throw new Error('Lesson structure incomplete.');
      prog.done();
      lesson = plainMathDeep(parsed);
      try { localStorage.setItem(DATA_KEY, JSON.stringify(parsed)); } catch (e) {}
      renderOverview();
    } catch (err) {
      prog.stop();
      document.getElementById('loadProgress').style.display = 'none';
      loadStatus.hidden = true;
      loadError.hidden = false;
      loadError.textContent = 'Something went wrong while building your lesson (' + err.message + ').';
      retryBtn.hidden = false;
    }
  }
  retryBtn.addEventListener('click', () => generate(true));

  show('brief');   // Immediately show the Study Brief tab before content loads
  openBrief();   // Study Brief comes first — the lesson builds when Learn is opened
})();
</script>
<script>
  // ── Study Time Tracker for Dashboard ──
  (function () {
    const TIME_KEY = 'TEACHLOOP_STUDY_TIME';    // { subject: seconds }
    const DAILY_KEY = 'TEACHLOOP_STUDY_DAILY';   // { 'YYYY-MM-DD': seconds }
    const DAYS_KEY = 'TEACHLOOP_STUDY_DAYS';     // ['YYYY-MM-DD', ...]

    function readObj(k) { try { const v = JSON.parse(localStorage.getItem(k)); return (v && typeof v === 'object') ? v : {}; } catch (e) { return {}; } }
    function readArr(k) { try { const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
    function write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
    function todayKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

    function currentSubject() {
      const p = new URLSearchParams(window.location.search);
      const s = p.get('subject');
      if (s && s.trim()) return s.trim();
      const rec = readArr('TEACHLOOP_RECENTS');
      if (rec[0]) return rec[0];
      const subs = readArr('TEACHLOOP_SUBJECTS');
      return subs[0] || 'General Study';
    }

    let last = Date.now();
    function tick() {
      const now = Date.now();
      const dt = (now - last) / 1000;
      last = now;
      if (document.visibilityState !== 'visible') return;
      if (dt <= 0 || dt > 90) return;
      const subj = currentSubject();
      if (!subj) return;

      const t = readObj(TIME_KEY); t[subj] = (t[subj] || 0) + dt; write(TIME_KEY, t);
      const tk = todayKey();
      const d = readObj(DAILY_KEY); d[tk] = (d[tk] || 0) + dt; write(DAILY_KEY, d);
      const days = readArr(DAYS_KEY); if (days.indexOf(tk) < 0) { days.push(tk); write(DAYS_KEY, days); }
    }

    document.addEventListener('visibilitychange', () => { last = Date.now(); });
    window.addEventListener('focus', () => { last = Date.now(); });
    setInterval(tick, 3000);
  })();
</script>
