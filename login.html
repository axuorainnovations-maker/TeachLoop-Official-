<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Axoura</title>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100%; }
  body{
    background:#111111; color:#fff;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro','system-ui',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:row; min-height:100vh;
  }
  ::selection{ background:rgba(255,255,255,0.2); }

  /* ===== Left (form) panel ===== */
  .auth-left{
    width:48%; flex-shrink:0; background:#0A0A0B;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:40px 48px; min-height:100vh;
  }
  .auth-inner{ width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .auth-logo{
    width:52px; height:52px; display:block;
    background:linear-gradient(140deg,#c4b5fd 0%,#a855f7 38%,#7c3aed 72%,#6d28d9 100%);
    -webkit-mask:url('logo.png?v=3') center/contain no-repeat;
    mask:url('logo.png?v=3') center/contain no-repeat;
  }
  .auth-h1{ font-size:28px; font-weight:600; letter-spacing:-0.02em; line-height:1.2; margin:32px 0; text-align:center; }

  .col{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:336px; }
  .oauth-btn{
    position:relative; display:flex; align-items:center; justify-content:center;
    width:100%; height:44px; border-radius:999px; background:#161616; border:1px solid #2A2A2A;
    color:#fff; cursor:pointer; font-size:14.5px; font-weight:500; letter-spacing:0.01em;
    transition:background .15s ease, border-color .15s ease;
  }
  .oauth-btn:hover{ background:#1d1d1d; border-color:#333; }
  .oauth-btn svg{ position:absolute; left:14px; width:20px; height:20px; }

  .divider{ display:flex; align-items:center; width:100%; max-width:336px; margin:24px 0 20px; }
  .divider .line{ height:1px; flex:1; background:#2A2A2A; }
  .divider span{ padding:0 12px; color:#6B6B6B; font-size:11px; font-weight:500; letter-spacing:0.08em; }

  .field{ width:100%; max-width:336px; }
  .field-label{ display:block; font-size:13px; font-weight:600; margin-bottom:8px; line-height:1; text-align:left; padding-left:6px; }
  .field-input{
    width:100%; height:44px; background:#181818; border:1px solid #262626; border-radius:999px;
    padding:0 18px; color:#fff; font-size:14px; outline:none; transition:border-color .15s ease;
    font-family:inherit;
  }
  .field-input::placeholder{ color:#6B6B6B; }
  .field-input:focus{ border-color:#3A3A3A; }
  .field + .field{ margin-top:24px; }

  .submit-btn{
    width:100%; max-width:336px; height:46px; border-radius:999px; background:#EDEEF0; color:#111;
    font-weight:600; font-size:14.5px; border:0; cursor:pointer; margin-top:16px;
    transition:background .15s ease; font-family:inherit;
  }
  .submit-btn:hover{ background:#e1e2e4; }
  .submit-btn:active{ background:#d6d7d9; }
  .submit-btn:disabled{ opacity:.7; cursor:default; }

  .auth-msg{ display:none; max-width:336px; margin-top:14px; font-size:13px; line-height:1.5; }
  .auth-foot{ margin-top:16px; font-size:13px; color:#8A8A8A; }
  .auth-foot a{ color:#EDEEF0; text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
  .auth-foot a:hover{ color:#fff; }

  /* ===== Right (decorative) panel ===== */
  .auth-right{ width:52%; padding:8px; background:#0A0A0B; }
  .auth-canvas{
    position:relative; width:100%; height:calc(100vh - 16px); min-height:680px;
    overflow:hidden; border-radius:16px; background:#08060f;
  }
  .auth-base{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 90% 65% at 50% 6%, rgba(124,58,237,0.30) 0%, transparent 62%),
      radial-gradient(ellipse 110% 80% at 50% 118%, rgba(139,92,246,0.90) 0%, rgba(91,33,182,0.55) 38%, transparent 72%),
      linear-gradient(180deg, #08060f 0%, #0f0a1f 28%, #241247 58%, #4c1d95 84%, #7c3aed 100%);
  }
  .blob{ position:absolute; border-radius:50%; }
  .blob-1{ width:70%; height:45%; left:-8%; top:4%;  background:radial-gradient(circle, rgba(124,58,237,0.55) 0%, transparent 70%); filter:blur(70px); }
  .blob-2{ width:60%; height:42%; left:18%;  top:30%; background:radial-gradient(circle, rgba(167,139,250,0.45) 0%, transparent 72%); filter:blur(85px); }
  .blob-3{ width:65%; height:40%; left:-4%;  bottom:6%; background:radial-gradient(circle, rgba(139,92,246,0.55) 0%, transparent 74%); filter:blur(75px); }
  .blob-4{ width:52%; height:36%; right:-8%; top:44%; background:radial-gradient(circle, rgba(109,40,217,0.55) 0%, transparent 70%); filter:blur(65px); }
  .glow-band{ position:absolute; width:100%; height:58%; bottom:0; left:0; background:linear-gradient(180deg, transparent 0%, rgba(124,58,237,0.18) 30%, rgba(139,92,246,0.42) 68%, rgba(167,139,250,0.55) 100%); filter:blur(22px); }
  .glow-core{ position:absolute; width:85%; height:52%; left:5%; bottom:-16%; background:radial-gradient(ellipse at center, #8b5cf6 0%, #5b21b6 42%, transparent 78%); filter:blur(44px); opacity:.9; border-radius:50%; }

  /* Floating Axoura prompt mockup — centered in the gradient */
  .mock-wrap{ position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:24px; }
  .mock-bar{
    display:flex; align-items:center; justify-content:space-between;
    width:min(86%, 460px); height:56px; background:#D6DEEE; border-radius:16px;
    box-shadow:0 8px 32px rgba(0,0,0,0.18), 0 1px 2px rgba(0,0,0,0.1);
    padding:6px 8px 6px 20px; backdrop-filter:blur(8px);
  }
  .mock-text{ display:flex; align-items:center; min-width:0; flex:1; padding-right:12px; }
  .mock-text span{ color:#1A1A1A; font-size:15px; font-weight:400; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.4; }
  .mock-caret{ display:inline-block; width:2px; height:18px; background:#2F6BFF; margin-left:3px; flex-shrink:0; animation:blink 1s infinite; }
  @keyframes blink{ 0%,50%{ opacity:1 } 51%,100%{ opacity:0 } }
  .mock-send{ flex-shrink:0; display:flex; align-items:center; justify-content:center; width:38px; height:38px; background:#121212; border-radius:999px; border:0; cursor:pointer; }

  @media (max-width:1023px){
    body{ flex-direction:column; }
    .auth-left{ width:100%; padding:32px 24px 40px; min-height:auto; justify-content:flex-start; }
    .auth-inner{ margin:0 auto; }
    .auth-right{ width:100%; }
    .auth-canvas{ height:420px; min-height:0; }
  }
</style>
</head>
<body>
  <!-- LEFT: form -->
  <div class="auth-left">
    <div class="auth-inner">
      <span class="auth-logo" role="img" aria-label="Axoura"></span>

      <h1 class="auth-h1" id="authTitle">Log in</h1>

      <div class="col">
        <button class="oauth-btn" id="googleBtn" type="button">
          <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span id="googleLabel">Continue with Google</span>
        </button>
      </div>

      <div class="divider"><div class="line"></div><span>OR</span><div class="line"></div></div>

      <div class="field">
        <label class="field-label" for="emailInput">Email</label>
        <input class="field-input" id="emailInput" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label class="field-label" for="passwordInput">Password</label>
        <input class="field-input" id="passwordInput" type="password" placeholder="Your password" autocomplete="current-password">
      </div>

      <button class="submit-btn" id="submitBtn" type="button">Log in</button>
      <div class="auth-msg" id="authMsg"></div>

      <div class="auth-foot" id="authFoot">
        Don't have an account? <a id="modeToggle">Create your account</a>
      </div>
    </div>
  </div>

  <!-- RIGHT: decorative -->
  <div class="auth-right">
    <div class="auth-canvas">
      <div class="auth-base"></div>
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
      <div class="glow-band"></div>
      <div class="glow-core"></div>
      <div class="mock-wrap">
        <div class="mock-bar">
          <div class="mock-text">
            <span id="mockText">Teach your student about photosynthesis…</span>
            <span class="mock-caret"></span>
          </div>
          <button class="mock-send" id="mockSend" type="button" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 19V5M12 5L6 11M12 5L18 11" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const sb = (window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase)
        ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;

      let mode = 'login'; // 'login' | 'signup'
      const $ = (id) => document.getElementById(id);
      const title = $('authTitle'), submit = $('submitBtn'), foot = $('authFoot'),
            googleLabel = $('googleLabel'), pwd = $('passwordInput'), msg = $('authMsg');

      function applyMode() {
        if (mode === 'login') {
          title.textContent = 'Log in';
          submit.textContent = 'Log in';
          googleLabel.textContent = 'Continue with Google';
          pwd.setAttribute('autocomplete', 'current-password');
          foot.innerHTML = "Don't have an account? <a id=\"modeToggle\">Create your account</a>";
        } else {
          title.textContent = 'Create your account';
          submit.textContent = 'Create account';
          googleLabel.textContent = 'Sign up with Google';
          pwd.setAttribute('autocomplete', 'new-password');
          foot.innerHTML = "Already have an account? <a id=\"modeToggle\">Log in</a>";
        }
        hideMsg();
        $('modeToggle').addEventListener('click', () => { mode = (mode === 'login') ? 'signup' : 'login'; applyMode(); });
      }

      function showMsg(text, isError) {
        msg.style.display = 'block';
        msg.textContent = text;
        msg.style.color = isError ? '#ff6b6b' : '#c9b6ef';
      }
      function hideMsg() { msg.style.display = 'none'; msg.textContent = ''; }

      const go = (page) => { window.location.href = page; };
      const saveLocal = (email) => {
        try {
          const acc = { email: email || '', method: 'email' };
          localStorage.setItem('AXOURA_ACCOUNT', JSON.stringify(acc));
          if (email) localStorage.setItem('AXOURA_EMAIL', email);
        } catch (e) {}
      };

      async function submitEmail() {
        const email = ($('emailInput').value || '').trim();
        const password = ($('passwordInput').value || '');
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showMsg('Please enter a valid email address.', true); return; }
        if (password.length < 6) { showMsg('Password must be at least 6 characters.', true); return; }

        saveLocal(email);
        if (!sb) { go('dashboard.html'); return; }

        submit.disabled = true;
        const redirectTo = window.location.href.replace(/login\.html.*$/, 'dashboard.html');

        try {
          if (mode === 'login') {
            submit.textContent = 'Signing in…';
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) { submit.disabled = false; submit.textContent = 'Log in'; showMsg(error.message || 'Sign-in failed.', true); return; }
            go('dashboard.html');
          } else {
            submit.textContent = 'Creating account…';
            const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: redirectTo } });
            if (error) { submit.disabled = false; submit.textContent = 'Create account'; showMsg(error.message || 'Sign-up failed.', true); return; }
            if (data && data.session) {
              // Confirmations OFF → signed in immediately; onboarding already done.
              go('dashboard.html');
            } else {
              // Confirmations ON → verify by email first.
              submit.textContent = 'Confirmation sent';
              showMsg('Almost there! We sent a confirmation link to ' + email + '. Open it to finish setting up your account.', false);
            }
          }
        } catch (e) {
          submit.disabled = false;
          submit.textContent = (mode === 'login') ? 'Log in' : 'Create account';
          showMsg((e && e.message) || 'Something went wrong. Please try again.', true);
        }
      }

      async function submitGoogle() {
        saveLocal(null);
        const dest = 'dashboard.html';
        if (!sb) { go(dest); return; }
        const redirectTo = window.location.href.replace(/login\.html.*$/, dest);
        try {
          const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo } });
          if (error) throw error;
        } catch (e) { showMsg('Google sign-in error: ' + (e.message || e), true); }
      }

      $('submitBtn').addEventListener('click', submitEmail);
      $('googleBtn').addEventListener('click', submitGoogle);
      $('emailInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitEmail(); });
      $('passwordInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitEmail(); });

      // Cycle the Axoura prompt mockup text for a little life.
      const prompts = [
        'Teach your student about photosynthesis…',
        'Explain the water cycle to your student…',
        'Walk your student through the French Revolution…',
        'Show your student how fractions work…'
      ];
      let pi = 0;
      const mockText = $('mockText');
      setInterval(() => { pi = (pi + 1) % prompts.length; mockText.textContent = prompts[pi]; }, 2800);
      $('mockSend').addEventListener('click', () => { $('emailInput').focus(); });

      applyMode();
    })();
  </script>
</body>
</html>
