<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, height=750">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin:0; background:#0A0A0D; color:#EDEDED; font-family:'Plus Jakarta Sans',sans-serif; overflow:hidden; }
.avatar-circle {
  width: 250px;
  height: 250px;
  border-radius: 50%;
  background: #382641;
  box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  position: relative;
  overflow: hidden;
}
.speech-bubble {
  position: absolute;
  left: calc(50% + 140px);
  top: 50%;
  transform: translateY(-85%);
  background: #1c1c23;
  border: 1px solid rgba(192, 132, 252, 0.28);
  border-radius: 16px;
  padding: 14px 20px;
  max-width: 260px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.6), 0 0 20px rgba(168,85,247,0.15);
}
.speech-bubble::before {
  content: '';
  position: absolute;
  left: -6px;
  top: 20px;
  width: 12px;
  height: 12px;
  background: #1c1c23;
  border-left: 1px solid rgba(192, 132, 252, 0.28);
  border-bottom: 1px solid rgba(192, 132, 252, 0.28);
  transform: rotate(45deg);
}
.icon-btn {
  background: #15151A;
  border: 1px solid rgba(255,255,255,0.08);
  color: #D4D4D8;
}
</style>
</head>
<body class="w-[1200px] h-[750px] relative flex flex-col justify-between p-8 select-none">
  <!-- Top Bar -->
  <div class="flex items-center justify-between">
    <div class="text-[17px] font-mono font-bold text-white tracking-widest">
      0:03
    </div>
    
    <div class="flex items-center gap-1.5 p-1 rounded-2xl icon-btn">
      <button class="p-2 px-2.5 rounded-xl hover:bg-white/10 text-[#A1A1AA]">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </button>
      <button class="p-2 px-2.5 rounded-xl hover:bg-white/10 text-[#A1A1AA]">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      </button>
    </div>
  </div>

  <!-- Center Stage: Avatar + Bubble -->
  <div class="relative flex items-center justify-center -mt-6">
    <!-- Circular Avatar -->
    <div class="avatar-circle flex items-center justify-center">
      <svg width="220" height="220" viewBox="0 0 100 100" fill="none" class="translate-y-4">
        <!-- Background inside -->
        <circle cx="50" cy="50" r="50" fill="#382641"/>
        <!-- Hair back / base -->
        <rect x="24" y="30" width="52" height="52" rx="14" fill="#fcd34d"/>
        <!-- Hair top -->
        <path d="M22 34C22 22 34 14 50 14C66 14 78 22 78 34V44H22V34Z" fill="#4B5563"/>
        <!-- Neck & Turtleneck -->
        <rect x="36" y="58" width="28" height="20" fill="#fcd34d"/>
        <path d="M18 90C18 70 32 64 50 64C68 64 82 70 82 90V100H18V90Z" fill="#374151"/>
        <!-- Face Features -->
        <circle cx="37" cy="46" r="4.5" fill="#111827"/>
        <circle cx="63" cy="46" r="4.5" fill="#111827"/>
        <circle cx="39" cy="44.5" r="1.5" fill="#ffffff"/>
        <circle cx="65" cy="44.5" r="1.5" fill="#ffffff"/>
        <!-- Glasses -->
        <rect x="28" y="38" width="19" height="17" rx="4" fill="none" stroke="#e5e7eb" stroke-width="2.5"/>
        <rect x="53" y="38" width="19" height="17" rx="4" fill="none" stroke="#e5e7eb" stroke-width="2.5"/>
        <line x1="47" y1="46.5" x2="53" y2="46.5" stroke="#e5e7eb" stroke-width="2.5"/>
        <!-- Smile -->
        <path d="M44 57C47 60 53 60 56 57" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Speech Bubble (Exact to screenshot) -->
    <div class="speech-bubble">
      <p class="text-[15.5px] font-semibold text-white leading-snug m-0">
        Hey! I'm ready. Where should we kick off?
      </p>
    </div>
  </div>

  <!-- Bottom Dock Controls (Exact to screenshot) -->
  <div class="flex flex-col items-center gap-3">
    <!-- Space hint -->
    <div class="flex items-center gap-2 text-[13px] text-[#71717A] font-medium">
      <span>Press</span>
      <span class="px-2 py-0.5 rounded-md bg-[#1B1B22] border border-white/10 text-white font-mono text-[12px]">space</span>
      <span>to interrupt</span>
    </div>

    <!-- Buttons -->
    <div class="flex items-center gap-4">
      <button class="w-12 h-12 rounded-full bg-[#1B1B22] border border-white/10 flex items-center justify-center text-[#D4D4D8] hover:bg-white/10 transition-all">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <button class="w-12 h-12 rounded-full bg-[#1B1B22] border border-white/10 flex items-center justify-center text-[#D4D4D8] hover:bg-white/10 transition-all">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
      </button>
    </div>
  </div>
</body>
</html>
