<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who would you like to call</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body {
  background:#0B0B0E;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}
.container { width:100%; max-width:900px; text-align:center; }
h1 { font-size:34px; font-weight:700; margin-bottom:10px; }
.subtitle { font-size:17px; color:#9A9AA3; margin-bottom:56px; }
.cards { display:flex; gap:28px; justify-content:center; flex-wrap:wrap; }
.card {
  position:relative;
  width:340px; height:360px;
  border-radius:32px;
  overflow:hidden;
  cursor:pointer;
  border:none;
  background:#111;
  transition:transform .18s ease;
}
.card:hover { transform:translateY(-4px); }
.card-bg {
  position:absolute; inset:0;
  background-size:cover; background-position:center;
  transition:transform .3s ease;
}
.card:hover .card-bg { transform:scale(1.03); }
.card-overlay {
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.45) 100%);
}
.card-content {
  position:absolute; top:0; left:0; right:0;
  padding:24px 26px;
  display:flex; justify-content:space-between; align-items:flex-start;
  color:white;
  font-weight:600; font-size:22px;
  text-shadow:0 1px 2px rgba(0,0,0,0.3);
}
.arrow { width:24px; height:24px; opacity:0.9; }
@media (max-width:760px) {
  .cards { flex-direction:column; align-items:center; }
  .card { width:100%; max-width:360px; height:340px; }
}
.close-btn {
  position: fixed;
  top: 32px;
  right: 32px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.06);
  border: none;
  color: #9A9AA3;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  z-index: 100;
}
.close-btn:hover {
  background: rgba(255, 255, 255, 0.12);
  color: white;
}
</style>
</head>
<body>
<button class="close-btn" aria-label="Close" onclick="document.body.style.transition='all 0.3s ease'; document.body.style.opacity='0'; setTimeout(() => window.location.href='chatbot.html?v=1', 300);">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </svg>
</button>
<div class="container">
  <h1>Who would you like to call ?</h1>
  <p class="subtitle">Select the preferred person you would like to talked to .</p>
  <div class="cards">
    <button class="card" aria-label="Teacher">
      <div class="card-bg" style="background-image:url('./teacher.png')"></div>
      <div class="card-overlay"></div>
      <div class="card-content">
        <span>Teacher</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </div>
    </button>
    <button class="card" aria-label="Student">
      <div class="card-bg" style="background-image:url('./student.png')"></div>
      <div class="card-overlay"></div>
      <div class="card-content">
        <span>Student</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </div>
    </button>
  </div>
</div>
</body>
</html>
