<svg class="interactive-avatar__canvas tr-character" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" width="256" height="256" aria-label="Noura character" style="display:block; filter:drop-shadow(0 12px 32px rgba(0,0,0,0.55));">
        <defs>
          <clipPath id="tr-char-frame"><circle cx="210" cy="210" r="210"/></clipPath>
        </defs>
        <g clip-path="url(#tr-char-frame)">
          <circle cx="210" cy="210" r="210" fill="#382641"/>
          <!-- body / turtleneck -->
          <g class="tr-char-body" transform="translate(210 250)">
            <path d="M-130 95 C-118 18 -70 -6 -36 -6 L-36 95 Z" fill="#2F3136"/>
            <path d="M130 95 C118 18 70 -6 36 -6 L36 95 Z" fill="#2F3136"/>
            <rect x="-40" y="-18" width="80" height="120" rx="22" fill="#2F3136"/>
            <!-- skin neck -->
            <rect x="-28" y="-42" width="56" height="36" rx="10" fill="#5C3317"/>
            <ellipse cx="0" cy="-6" rx="40" ry="12" fill="#3A3D44"/>
          </g>
          <!-- head unit -->
          <g class="tr-char-head" transform="translate(210 155)">
            <g class="tr-char-head-bob">
              <!-- ears + studs -->
              <ellipse cx="-82" cy="12" rx="16" ry="20" fill="#5C3317"/>
              <circle cx="-82" cy="14" r="3.2" fill="#F2EEE8"/>
              <ellipse cx="82" cy="12" rx="16" ry="20" fill="#5C3317"/>
              <circle cx="82" cy="14" r="3.2" fill="#F2EEE8"/>
              <!-- face block -->
              <rect x="-76" y="-72" width="152" height="158" rx="26" fill="#6B3F22"/>
              <!-- hair with three tufts -->
              <path d="M-70 -48 C-66 -84 -28 -96 0 -96 C28 -96 66 -84 70 -48 L70 -28 C52 -52 28 -58 0 -58 C-28 -58 -52 -52 -70 -28 Z" fill="#2A2C31"/>
              <path d="M-36 -78 C-28 -90 -12 -94 0 -94 C12 -94 28 -90 36 -78 C24 -86 10 -88 0 -88 C-10 -88 -24 -86 -36 -78 Z" fill="#35383E"/>
              <ellipse cx="-22" cy="-86" rx="10" ry="8" fill="#2A2C31"/>
              <ellipse cx="0" cy="-90" rx="11" ry="9" fill="#2A2C31"/>
              <ellipse cx="22" cy="-86" rx="10" ry="8" fill="#2A2C31"/>
              <!-- nose -->
              <ellipse cx="2" cy="22" rx="6.5" ry="4.5" fill="#4A2C16"/>
              <!-- mouth (SMIL talk when speaking) -->
              <path class="tr-char-mouth" d="M-16 48 Q2 58 20 46" fill="none" stroke="#3A2412" stroke-width="4" stroke-linecap="round">
                <animate class="tr-mouth-anim" attributeName="d" values="M-16 48 Q2 58 20 46;M-14 46 Q2 68 18 46;M-16 48 Q2 58 20 46" dur="0.34s" repeatCount="indefinite" begin="indefinite"/>
              </path>
              <!-- glasses -->
              <g class="tr-char-glasses">
                <rect x="-62" y="-14" width="52" height="48" rx="11" fill="none" stroke="#F5F2ED" stroke-width="8"/>
                <rect x="10" y="-14" width="52" height="48" rx="11" fill="none" stroke="#F5F2ED" stroke-width="8"/>
                <path d="M-10 10 H10" stroke="#F5F2ED" stroke-width="7" stroke-linecap="round"/>
                <path d="M-62 10 H-78" stroke="#F5F2ED" stroke-width="6" stroke-linecap="round"/>
                <path d="M62 10 H78" stroke="#F5F2ED" stroke-width="6" stroke-linecap="round"/>
              </g>
              <!-- eyes -->
              <g class="tr-char-eyes">
                <g transform="translate(-36 8)">
                  <circle r="9.5" fill="#111"/>
                  <circle cx="-2.8" cy="-2.8" r="2.5" fill="#fff"/>
                </g>
                <g transform="translate(36 8)">
                  <circle r="9.5" fill="#111"/>
                  <circle cx="-2.8" cy="-2.8" r="2.5" fill="#fff"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </svg>