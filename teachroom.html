<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noura — TeachRoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="beginnerPrompt.js"></script>
<script src="intermediatePrompt.js"></script>
<script src="advancedPrompt.js"></script>
<script src="noura-credits.js"></script>
<style>
  :root {
    --ts-bg:#0a0a0d;
    --ts-text:#E8E8E6;
    --ts-dim:#9a9aa2;
    --ts-accent:#8b5cf6;
    --ts-good:#3fb950;
    --ts-bad:#ef4444;
    --grad: linear-gradient(140deg,#c4b5fd 0%,#a855f7 38%,#7c3aed 72%,#6d28d9 100%);
  }
  * { box-sizing:border-box; }
  html, body { min-height:100%; margin:0; padding:0; background:var(--ts-bg); color:var(--ts-text); font-family:'Plus Jakarta Sans','Inter',-apple-system,sans-serif; overflow:hidden; }
  
  .avatar-wrapper {
    position: relative;
    border-radius: 50%;
    transform: none !important;
    animation: none !important;
  }

  /* Shimmer Text Animation */
  @keyframes textShimmer {
    0% { background-position: 100% center; }
    100% { background-position: 0% center; }
  }
  .tr-text-shimmer {
    display: inline-block;
    background-size: 250% 100%, auto;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent !important;
    background-repeat: no-repeat, padding-box;
    --spread: 50px;
    --base-color: #c084fc;
    --base-gradient-color: #ffffff;
    background-image:
      linear-gradient(90deg, transparent calc(50% - var(--spread)), var(--base-gradient-color), transparent calc(50% + var(--spread))),
      linear-gradient(var(--base-color), var(--base-color));
    animation: textShimmer 2s linear infinite;
  }

  .tr-dock-container {
    width: 100%;
    padding-bottom: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .tr-dock-label {
    font-size: 15px;
    font-weight: 500;
    color: #a1a1aa;
    margin-bottom: 12px;
  }

  #trLive {
    background:#0a0a0d; width:100vw; height:100vh; position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; justify-content:space-between; align-items:center; overflow:hidden;
  }
  
  .tr-topbar { width:100%; display:flex; justify-content:space-between; align-items:center; padding:20px 28px 0; z-index:10; }
  .tr-conn { display:flex; align-items:center; gap:8px; font-size:13px; color:#a1a1aa; }
  .tr-conn i { width:8px; height:8px; border-radius:50%; background:#10b981; display:inline-block; box-shadow:0 0 8px #10b981; }
  .tr-elapsed { color:#71717a; font-weight:600; margin-left:8px; }
  
  .tr-stage { flex:1; width:100%; max-width:760px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 24px; text-align:center; position:relative; }
  
  .tr-response-box { display:none; max-width:620px; margin-bottom:24px; text-align:center; }
  .tr-response-text { font-size:22px; font-weight:600; color:#ffffff; line-height:1.6; letter-spacing:-0.01em; }
  
  .tr-caption { max-width:640px; margin-top:0; transition:all 0.3s ease; }
  .tr-caption-text { font-size:20px; font-weight:600; color:#c084fc; line-height:1.5; text-shadow:0 0 16px rgba(192,132,252,0.35); letter-spacing:-0.01em; }
  .tr-state-label { display: none !important; }
  
  .tr-dock { width:100%; padding:0 0 32px; display:flex; justify-content:center; align-items:center; gap:28px; z-index:10; }
  .tr-btn-circle { width:58px; height:58px; border-radius:50%; background:#222226; border:1px solid rgba(255,255,255,0.08); color:#ffffff; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform 0.15s, background 0.15s; box-shadow:0 6px 24px rgba(0,0,0,0.5); }
  .tr-btn-circle:hover { background:#2e2e34; transform:scale(1.05); }
  .tr-btn-circle:active { transform:scale(0.95); }
  .tr-btn-circle.muted { background:#ef4444; border-color:#ef4444; }

  /* Toast notification */
  .tr-toast { position:fixed; bottom:110px; left:50%; transform:translateX(-50%); background:#1e1e24; border:1px solid rgba(255,255,255,0.12); color:#fff; padding:10px 20px; border-radius:999px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity 0.25s ease; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,0.4); }
  .tr-toast.on { opacity:1; }

    /* Natural Human Eye Blinking Animation */
    @keyframes humanBlink {
      0%, 86%, 94%, 100% {
        transform: scaleY(1);
      }
      90% {
        transform: scaleY(0.06);
      }
    }
    .bear-blinking-eyes {
      transform-origin: 210px 172px;
      animation: humanBlink 3.8s infinite ease-in-out;
    }

  </style>
</head>

  const FAST_MODEL = 'claude-3-5-haiku-20241022';

  // ── Session State ────────────────────────────────────────────────────────
  let sessionData = {};
  try {
    sessionData = JSON.parse(localStorage.getItem('NOURA_TS_LIVE') || localStorage.getItem('NOURA_TS_DRAFT') || '{}');
  } catch(e) { sessionData = {}; }

  const topic = sessionData.topic || 'General Overview';
  const level = (sessionData.level || 'intermediate').toLowerCase();

  const STUDENTS = {
    beginner: {
      name: 'Alex',
      opening: "Hey! Ready whenever you are. What are we starting with today?",
      prompt: () => window.BEGINNER_SYSTEM_PROMPT
    },
    intermediate: {
      name: 'Taylor',
      opening: "Hey! I'm ready. Where should we kick off?",
      prompt: () => window.INTERMEDIATE_SYSTEM_PROMPT
    },
    advanced: {
      name: 'Sam',
      opening: "Hey, ready when you are! What's our first main topic today?",
      prompt: () => window.ADVANCED_SYSTEM_PROMPT
    }
  };
  const currentStudent = STUDENTS[level] || STUDENTS.intermediate;
  // ── Pre-fetch Opening TTS Audio for Instant Playback ─────────────────────
  let prefetchedOpeningAudio = null;
  const openingText = currentStudent.opening;
  fetch('/api/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: openingText, model: 'chatterbox-multilingual-tts' })
  }).then(r => r.ok ? r.arrayBuffer() : null).then(buf => {
    if (buf) prefetchedOpeningAudio = buf;
  }).catch(e => console.warn('[Prefetch] Opening TTS error:', e));


  // ── State Variables ──────────────────────────────────────────────────────
  // state: 'connecting' | 'listening' | 'user_speaking' | 'processing_turn' | 'ai_speaking'
  let state = 'connecting';
  let micMuted = false;
  let turnBusy = false;
  let turns = [];
  let currentAudio = null;
  let currentSource = null;
  let audioCtx = null;
  let audioUnlocked = false;
  let recognition = null;
  let speechSilenceTimer = null;
  let lastFinalTranscript = '';
  let pendingSpeechText = '';
  let typingTimer = null;
  let lastTurnTime = 0;

  // ── Toast ────────────────────────────────────────────────────────────────
  function toast(msg) {
    const t = $('trToast');
    t.textContent = msg;
    t.classList.add('on');
    setTimeout(() => t.classList.remove('on'), 3500);
  }

  // ── setState ─────────────────────────────────────────────────────────────
  function setState(s) {
    state = s;
    const avatar = $('avatarContainer');
    const capTxt = $('trCaptionText');
    const respBox = $('trResponseBox');

    avatar.className = 'avatar-wrapper ' + (
      s === 'ai_speaking' ? 'avatar-speaking' :
      s === 'user_speaking' ? 'avatar-listening' :
      s === 'processing_turn' ? 'avatar-thinking' : 'avatar-idle'
    );

    if (s === 'listening') {
      capTxt.textContent = 'Say something...';
      capTxt.classList.add('tr-text-shimmer');
      capTxt.style.color = '';
      respBox.style.display = 'none';
    } else if (s === 'user_speaking') {
      capTxt.classList.remove('tr-text-shimmer');
      capTxt.style.color = '#ffffff';
      respBox.style.display = 'none';
    } else if (s === 'processing_turn') {
      capTxt.textContent = 'Thinking…';
      capTxt.classList.add('tr-text-shimmer');
      capTxt.style.color = '';
      respBox.style.display = 'none';
    } else if (s === 'ai_speaking') {
      capTxt.classList.remove('tr-text-shimmer');
      capTxt.style.color = '';
      respBox.style.display = 'block';
    }
  }

  // ── Timer ────────────────────────────────────────────────────────────────
  let elapsedSec = 0;
  setInterval(() => {
    elapsedSec++;
    const m = Math.floor(elapsedSec / 60);
    const s = elapsedSec % 60;
    $('trElapsed').textContent = m + ':' + (s < 10 ? '0' : '') + s;
  }, 1000);

  // ── Chat API ─────────────────────────────────────────────────────────────
  async function chat(data) {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error('Chat API returned ' + r.status);
    const res = await r.json();
    return res.content?.[0]?.text || '';
  }

  // ── Audio Unlock ─────────────────────────────────────────────────────────
  function unlockAudio() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AudioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (!audioUnlocked) {
        audioUnlocked = true;
        const dummy = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
        dummy.play().then(() => dummy.pause()).catch(() => {});
      }
    } catch(e) {
      console.warn('[AudioUnlock] error:', e);
    }
  }

  ['click', 'touchstart', 'mousedown', 'pointerdown', 'keydown'].forEach(evt => {
    window.addEventListener(evt, unlockAudio, { passive: true });
  });

  // ── Stop AI Speech ───────────────────────────────────────────────────────
  function stopAiSpeech() {
    if (currentSource) {
      try { currentSource.stop(); } catch(e){}
      currentSource = null;
    }
    if (currentAudio) {
      try { currentAudio.pause(); currentAudio.currentTime = 0; } catch(e){}
      currentAudio = null;
    }
    if (typingTimer) {
      clearInterval(typingTimer);
      typingTimer = null;
    }
  }

  // ── TTS Speak ─────────────────────────────────────────────────────────────
  // Speaks text via Chatterbox TTS. Calls onStart() when audio begins playing.
  // If TTS fails or is slow, onStart() fires after 900ms as a fallback.
  async function speak(text, onStart) {
    unlockAudio();
    stopAiSpeech();

    if (!text) {
      if (typeof onStart === 'function') onStart();
      return;
    }

    let started = false;
    function triggerStart() {
      if (!started) {
        started = true;
        if (typeof onStart === 'function') onStart();
      }
    }

    // Fallback: start typewriter even if audio takes too long
    const fallbackId = setTimeout(triggerStart, 900);

    try {
      let arrayBuf = null;
      if (text === currentStudent.opening && prefetchedOpeningAudio) {
        arrayBuf = prefetchedOpeningAudio;
        prefetchedOpeningAudio = null; // Use once
        console.log('[TTS] Using pre-fetched opening audio buffer instantly!');
      } else {
        console.log('[TTS] Requesting synthesis for:', text.slice(0, 60) + (text.length > 60 ? '...' : ''));
        const r = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text, model: 'chatterbox-multilingual-tts' })
        });
        if (r.ok) arrayBuf = await r.arrayBuffer();
      }

      if (arrayBuf) {

        // Prefer Web Audio API (no autoplay block, precise timing)
        unlockAudio();
        if (audioCtx) {
          try {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuf.slice(0));
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioCtx.destination);
            currentSource = source;
            clearTimeout(fallbackId);
            triggerStart();
            source.start(0);
            await new Promise(resolve => {
              source.onended = () => { currentSource = null; resolve(); };
            });
            return;
          } catch(err) {
            console.warn('[AudioContext] decode failed, trying HTML5 Audio:', err);
          }
        }

        // HTML5 Audio fallback
        const blob = new Blob([arrayBuf], { type: 'audio/wav' });
        const url = URL.createObjectURL(blob);
        currentAudio = new Audio(url);
        clearTimeout(fallbackId);
        triggerStart();
        await new Promise(resolve => {
          currentAudio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; resolve(); };
          currentAudio.onerror = () => { URL.revokeObjectURL(url); currentAudio = null; resolve(); };
          currentAudio.play().catch(() => { URL.revokeObjectURL(url); currentAudio = null; resolve(); });
        });
      } else {
        console.warn('[TTS] HTTP error:', r.status);
        clearTimeout(fallbackId);
        triggerStart();
      }
    } catch(e) {
      console.warn('[TTS] Network/parse error:', e.message);
      clearTimeout(fallbackId);
      triggerStart();
    }
  }

  // ── Speak + Typewriter ────────────────────────────────────────────────────
  // Plays TTS audio while animating text character by character.
  // Text is always fully shown when done (no partial cut-offs).
  async function speakAndType(text) {
    if (!text) return;

    // Switch status to AI speaking
    setState('ai_speaking');

    const respTxt = $('trResponseText');
    respTxt.textContent = '';

    const charDelay = Math.max(20, Math.min(45, Math.floor(2800 / Math.max(text.length, 1))));
    let charIdx = 0;
    let typewriterRunning = false;

    function startTypewriter() {
      if (typewriterRunning) return;
      typewriterRunning = true;
      setState('ai_speaking');
      if (typingTimer) clearInterval(typingTimer);
      typingTimer = setInterval(() => {
        if (state !== 'ai_speaking') {
          clearInterval(typingTimer);
          typingTimer = null;
          return;
        }
        charIdx++;
        respTxt.textContent = text.slice(0, charIdx);
        if (charIdx >= text.length) {
          clearInterval(typingTimer);
          typingTimer = null;
        }
      }, charDelay);
    }

    await speak(text, startTypewriter);

    // Ensure typewriter started (covers all edge cases)
    startTypewriter();

    // Wait for typing to finish if it's still running
    if (typingTimer) {
      await new Promise(resolve => {
        const check = setInterval(() => {
          if (!typingTimer) { clearInterval(check); resolve(); }
        }, 100);
      });
    }

    // Always ensure full text is visible when done
    respTxt.textContent = text;
  }

  // ── Parse AI Reply ────────────────────────────────────────────────────────
  function parseAiReply(raw) {
    if (!raw) return '';
    let text = raw.trim();

    // 1. Extract "message": "..." via robust regex
    const m = text.match(/"message"\s*:\s*"((?:[^"\\]|\\.)*)"/i);
    if (m && m[1]) return m[1].replace(/\\"/g, '"').replace(/\\n/g, ' ').trim();

    // 2. Truncated mid-quote
    const tm = text.match(/"message"\s*:\s*"([^"\n]*)/i);
    if (tm && tm[1]) return tm[1].replace(/\\"/g, '"').trim();

    // 3. Strip code blocks
    if (text.startsWith('```')) {
      text = text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
    }

    // 4. JSON parse fallback
    if (text.includes('{') && text.includes('}')) {
      try {
        const a = text.indexOf('{'), b = text.lastIndexOf('}');
        const parsed = JSON.parse(text.slice(a, b + 1));
        if (parsed && parsed.message) return parsed.message;
      } catch(e) {}
    }

    // 5. Strip JSON wrapper tokens
    return text.replace(/^\{\s*"message"\s*:\s*"/i, '').replace(/",?\s*"move"[\s\S]*$/, '').replace(/"\s*\}\s*$/, '').trim();
  }

  // ── Handle Human Turn ─────────────────────────────────────────────────────
    // ── Speaker Echo Detection ───────────────────────────────────────────────
  function isSpeakerEcho(text) {
    if (!text) return false;
    const lastTurn = turns[turns.length - 1];
    if (lastTurn && lastTurn.role === 'assistant' && lastTurn.content) {
      const aiWords = lastTurn.content.toLowerCase().split(/\s+/);
      const userWords = text.toLowerCase().split(/\s+/);
      let matches = 0;
      for (const w of userWords) {
        if (w.length > 3 && aiWords.includes(w)) matches++;
      }
      if (matches >= 2) return true;
    }
    return false;
  }

async function handleHumanTurn(text) {
    // Prevent duplicate calls
    if (turnBusy) return;
    if (!text || !text.trim()) return;

    // Rate-limiting: enforce gap between turns
    const now = Date.now();
    const timeSinceLast = now - lastTurnTime;
    if (timeSinceLast < 1200) {
      await new Promise(r => setTimeout(r, 1200 - timeSinceLast));
    }

    // Double check not busy after delay
    if (turnBusy) return;
    turnBusy = true;
    lastTurnTime = Date.now();

    // Stop recognition while processing
    try { if (recognition) recognition.stop(); } catch(e){}

    turns.push({ role: 'user', content: text.trim() });
    setState('processing_turn');

    try {
      const basePrompt = (typeof currentStudent.prompt === 'function' ? currentStudent.prompt() : '') || window.BEGINNER_SYSTEM_PROMPT || '';
      const voiceRules = `\n\nREAL-TIME VOICE ROOM RULES:\n- Topic: ${topic}\n- Your Name (AI Student): ${currentStudent.name}\n- Role: You are the student (${currentStudent.name}) learning from the human Teacher.\n- Address the human as "Teacher" or by their topic. Never call the teacher Jordan.\n- Speak completely naturally, casually, and conversationally.\n- CRITICAL OUTPUT FORMAT: Return ONLY a JSON object: {"message": "your response here"}. No other fields.\n- Keep response under 20 words as 1 short natural spoken sentence.`;
      const sysPrompt = basePrompt + voiceRules;
      const messages = turns.slice(-8).map(t => ({ role: t.role === 'user' ? 'user' : 'assistant', content: t.content }));

      const rawReply = await chat({
        model: FAST_MODEL,
        max_tokens: 160,
        system: sysPrompt,
        messages: messages
      });

      const aiReply = parseAiReply(rawReply);
      console.log('[TeachRoom] AI reply:', aiReply);

      if (aiReply) {
        turns.push({ role: 'assistant', content: aiReply });
        await speakAndType(aiReply);
      }

    } catch(err) {
      console.error('[TeachRoom] Error:', err);
      toast('Student had trouble responding — try again!');
    } finally {
      turnBusy = false;
      lastFinalTranscript = '';
      pendingSpeechText = '';
      setState('listening');
      // Safely restart recognition for next teacher turn
      if (!micMuted) {
        setTimeout(safeStartRecognition, 300);
      }
    }
  }

  // ── Speech Recognition ────────────────────────────────────────────────────
  function initSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      toast('Speech recognition not supported — please use Chrome.');
      return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';
    recognition.maxAlternatives = 1;

    recognition.onresult = event => {
      // Only capture speech when not muted or in LLM thinking phase
      if (micMuted || state === 'processing_turn') return;
      // If AI is busy but NOT in ai_speaking state (e.g. initial setup), ignore
      if (turnBusy && state !== 'ai_speaking') return;

      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const trans = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          lastFinalTranscript += ' ' + trans;
        } else {
          interim += trans;
        }
      }

      const fullText = (lastFinalTranscript + ' ' + interim).trim();
      if (!fullText) return;

      // If AI is speaking and teacher speaks a clear phrase (>6 chars), allow barge-in interruption
      if (state === 'ai_speaking') {
        if (fullText.length >= 7 && !isSpeakerEcho(fullText)) {
          console.log('[TeachRoom] Teacher interrupted AI with:', fullText);
          stopAiSpeech();
          turnBusy = false;
          setState('user_speaking');
        } else {
          return; // Ignore echo / ambient noise during AI speech
        }
      } else if (state === 'listening') {
        setState('user_speaking');
      }

      // Show live transcript
      $('trCaptionText').textContent = fullText;
      pendingSpeechText = fullText;

      // Reset silence timer: commit speech after 750ms of silence
      clearTimeout(speechSilenceTimer);
      speechSilenceTimer = setTimeout(() => {
        const committedText = pendingSpeechText;
        lastFinalTranscript = '';
        pendingSpeechText = '';
        if (committedText && committedText.trim().length >= 2 && !turnBusy && state !== 'processing_turn') {
          handleHumanTurn(committedText);
        }
      }, 750);
    };

    recognition.onerror = event => {
      if (event.error === 'not-allowed') {
        toast('Microphone blocked — check browser permissions.');
        return;
      }
      if (event.error === 'no-speech' || event.error === 'aborted') {
        // Normal — just restart
        return;
      }
      console.warn('[STT] error:', event.error);
    };

    recognition.onend = () => {
      // Auto-restart recognition unless muted or busy
      if (!document.hidden && !micMuted && state !== 'processing_turn') {
        setTimeout(safeStartRecognition, 200);
      }
    };
  }

  function safeStartRecognition() {
    if (micMuted || !recognition) return;
    if (state === 'processing_turn') return;
    try {
      recognition.start();
    } catch(e) {
      // Already running — abort and retry
      if (e.name === 'InvalidStateError') {
        try { recognition.abort(); } catch(e2){}
        setTimeout(() => {
          if (!micMuted && state !== 'processing_turn') {
            try { recognition.start(); } catch(e3){}
          }
        }, 300);
      }
    }
  }

  // ── Tab Visibility Recovery ───────────────────────────────────────────────
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      unlockAudio();
      if (state === 'listening' || state === 'user_speaking') {
        safeStartRecognition();
      }
    }
  });

  window.addEventListener('focus', () => {
    if (!document.hidden && (state === 'listening' || state === 'user_speaking')) {
      unlockAudio();
      safeStartRecognition();
    }
  });

  // ── Watchdog: restart recognition every 4s if it stopped ─────────────────
  setInterval(() => {
    if (!document.hidden && !micMuted && !turnBusy && (state === 'listening' || state === 'connecting')) {
      safeStartRecognition();
    }
  }, 4000);

  // ── Mute Button ───────────────────────────────────────────────────────────
  $('trMicBtn').addEventListener('click', () => {
    micMuted = !micMuted;
    const dockLbl = $('trDockLabel');
    if (micMuted) {
      clearTimeout(speechSilenceTimer);
      try { if (recognition) recognition.stop(); } catch(e){}
      $('trMicIcon').innerHTML = `
        <line x1="2" y1="2" x2="22" y2="22"/>
        <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/>
        <path d="M5 10v2a7 7 0 0 0 12.23 4.86"/>
        <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/>
        <path d="M9 9v3a3 3 0 0 0 4.29 2.71"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      `;
      dockLbl.textContent = 'Muted';
      dockLbl.style.display = 'block';
      toast('Microphone muted');
    } else {
      $('trMicIcon').innerHTML = `
        <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      `;
      dockLbl.style.display = 'none';
      toast('Microphone on');
      if (state !== 'ai_speaking' && state !== 'processing_turn') {
        safeStartRecognition();
      }
    }
  });

  // ── Close Button ──────────────────────────────────────────────────────────
  $('trCloseBtn').addEventListener('click', () => {
    if (confirm('End TeachRoom session?')) {
      stopAiSpeech();
      clearTimeout(speechSilenceTimer);
      try { if (recognition) recognition.stop(); } catch(e){}
      window.location.href = 'teachstudio.html';
    }
  });

  // ── Init TeachRoom ────────────────────────────────────────────────────────
  async function initTeachRoom() {
    initSpeechRecognition();

    // Play AI student opening
    const openingText = currentStudent.opening;
    turns.push({ role: 'assistant', content: openingText });

    await speakAndType(openingText);

    // Small pause after opening, then start listening
    await new Promise(r => setTimeout(r, 800));
    setState('listening');
    safeStartRecognition();
  }

  // Fire after DOM is ready
  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', initTeachRoom);
  } else {
    initTeachRoom();
  }

})();
</script>
</body>
</html>
