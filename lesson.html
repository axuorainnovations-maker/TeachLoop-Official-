<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noura — Lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<style>
  :root { --grad: linear-gradient(140deg,#c4b5fd 0%,#a855f7 38%,#7c3aed 72%,#6d28d9 100%); --purple:#8b5cf6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:#0A0A0B; color:#E8E8E6; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; }
  button { font-family:'Inter',sans-serif; }

  .grad-logo { display:inline-block; background:var(--grad); -webkit-mask:url('logo.png?v=3') center/contain no-repeat; mask:url('logo.png?v=3') center/contain no-repeat; }
  .grad-text { background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

  /* Top bar */
  .topbar { position:fixed; top:0; left:0; right:0; height:58px; z-index:40; display:flex; align-items:center; gap:16px; padding:0 20px; background:rgba(10,10,11,0.85); backdrop-filter:blur(10px); border-bottom:1px solid #1a1a1d; }
  .brand { display:flex; align-items:center; gap:8px; text-decoration:none; flex-shrink:0; }
  .brand .grad-logo { width:20px; height:20px; }
  .brand span.word { font-size:16px; font-weight:800; letter-spacing:-.3px; }
  .crumb { display:flex; align-items:center; gap:8px; min-width:0; font-size:13.5px; color:#8a8a93; }
  .crumb a { color:#8a8a93; text-decoration:none; display:flex; align-items:center; gap:6px; }
  .crumb a:hover { color:#e4e4e5; }
  .crumb svg { width:14px; height:14px; flex-shrink:0; }
  .crumb .title { color:#d4d4d8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Left rail */
  .rail { position:fixed; top:58px; left:0; bottom:0; width:86px; z-index:30; display:flex; flex-direction:column; align-items:center; gap:6px; padding-top:26px; background:#0c0c0e; border-right:1px solid #1a1a1d; }
  .rail-item { width:70px; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:6px; border:none; background:transparent; border-radius:12px; color:#8a8a93; font-size:11.5px; font-weight:600; cursor:pointer; transition:background .15s,color .15s; }
  .rail-item svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .rail-item:hover { background:#161619; color:#d4d4d8; }
  .rail-item.active { background:#1c1c20; color:#fff; }
  .rail-item.soon { opacity:.55; }
  .rail-item.locked { opacity:.38; cursor:not-allowed; position:relative; }
  .rail-item.locked:hover { background:transparent; color:#8a8a93; }
  .rail-item .rail-lock { position:absolute; top:17px; left:calc(50% + 1px); width:11px; height:11px; stroke:#9a9aa2; fill:#0c0c0e; stroke-width:2.4; display:none; }
  .rail-item.locked .rail-lock { display:block; }
  .rail-item .rail-lock rect { fill:#0c0c0e; }

  .main { padding:58px 0 90px 86px; min-height:100%; }
  @media (max-width:720px) { .rail { display:none; } .main { padding-left:0; } }

  /* ── Loading view ── */
  .loadwrap { min-height:calc(100vh - 58px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 24px; }
  .load-logo { width:120px; height:120px; position:relative; margin-bottom:34px; }
  .load-logo .grad-logo { width:100%; height:100%; animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.06);opacity:.85;} }
  .load-kicker { font-size:13px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:#b79df5; margin-bottom:18px; }
  .load-title { font-size:clamp(30px,4.6vw,46px); font-weight:800; letter-spacing:-.02em; line-height:1.15; color:#fff; max-width:760px; }
  .load-progress { width:min(420px,74vw); height:6px; margin-top:30px; border-radius:99px; background:#1c1c20; overflow:hidden; }
  .load-progress i { display:block; height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#a78bfa,#7c3aed); transition:width .4s ease; }
  .load-status { margin-top:16px; font-size:15px; color:#8a8a93; }
  .load-pct { margin-left:8px; color:#c9b6ef; font-weight:600; }
  .load-status .dots::after { content:''; animation:dots 1.4s steps(4,end) infinite; }
  @keyframes dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} }
  .load-error { margin-top:22px; font-size:14.5px; color:#f0a5a5; max-width:520px; line-height:1.5; }
  .retry-btn { margin-top:16px; padding:11px 26px; border:none; border-radius:999px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:14.5px; font-weight:600; cursor:pointer; }
  .retry-btn:hover { filter:brightness(1.08); }

  /* ── Overview (contents) view ── */
  .overview { display:none; max-width:880px; margin:0 auto; padding:56px 28px 40px; }
  .ov-hero { display:flex; align-items:center; gap:34px; margin-bottom:40px; }
  .ov-logo { width:150px; height:150px; flex-shrink:0; position:relative; }
  .ov-logo .grad-logo { width:100%; height:100%; }
  .ov-title { font-size:clamp(30px,4vw,44px); font-weight:800; letter-spacing:-.02em; line-height:1.15; color:#fff; }
  .ov-start-row { display:flex; align-items:center; gap:26px; margin-bottom:52px; flex-wrap:wrap; }
  .start-btn { padding:16px 44px; border:none; border-radius:16px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 10px 26px rgba(123,92,250,0.3), inset 0 1px 0 rgba(255,255,255,0.18); transition:filter .15s, transform .1s; }
  .start-btn:hover { filter:brightness(1.07); }
  .start-btn:active { transform:scale(.99); }
  .upnext .k { font-size:11.5px; font-weight:700; letter-spacing:.14em; color:#8a8a93; text-transform:uppercase; }
  .upnext .v { margin-top:3px; font-size:16.5px; font-weight:600; color:#fff; }
  .contents-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; }
  .contents-head h2 { font-size:26px; font-weight:800; letter-spacing:-.02em; color:#fff; }
  .contents-head .prog { font-size:14px; color:#9a9aa2; }
  .timeline { position:relative; }
  .timeline::before { content:''; position:absolute; left:25px; top:14px; bottom:14px; width:2px; background:#232327; }
  /* Neon progress line that grows through the completed steps */
  .timeline::after {
    content:''; position:absolute; left:25px; top:14px; width:2px; border-radius:2px;
    height:var(--tl-fill, 0px);
    background:linear-gradient(180deg,#c4b5fd 0%,#a78bfa 45%,#7c3aed 100%);
    box-shadow:0 0 8px rgba(139,92,246,0.75), 0 0 18px rgba(139,92,246,0.35);
    transition:height .45s ease;
  }
  .tl-dot, .tl-card { position:relative; z-index:1; }
  .tl-row.done .tl-dot { box-shadow:0 0 10px rgba(139,92,246,0.55); }
  .tl-row { position:relative; display:flex; align-items:center; gap:20px; padding:15px 0; }
  .tl-dot { position:relative; z-index:1; width:52px; height:52px; flex-shrink:0; border-radius:50%; background:#141416; border:2px solid #2a2a2e; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:#9a9aa2; }
  .tl-row.current .tl-dot { border-color:#8b5cf6; background:#221a38; color:#fff; box-shadow:0 0 0 4px rgba(139,92,246,0.18); }
  .tl-row.done .tl-dot { background:#8b5cf6; border-color:#8b5cf6; color:#fff; }
  .tl-dot svg { width:20px; height:20px; }
  .tl-title { font-size:17px; font-weight:600; color:#e8e8e6; }
  .tl-row.locked .tl-title { color:#6f6f76; }
  .tl-meta { margin-left:auto; display:flex; align-items:center; gap:12px; font-size:14px; color:#8a8a93; }
  .tl-meta svg { width:15px; height:15px; stroke:#6f6f76; fill:none; stroke-width:1.8; }
  .tl-start { padding:11px 30px; border:none; border-radius:12px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(123,92,250,0.28); }
  .tl-start:hover { filter:brightness(1.07); }
  .tl-scorepill { padding:5px 12px; border-radius:999px; font-size:13px; font-weight:700; border:1px solid; }
  .tl-scorepill.perfect { color:#3fb950; border-color:rgba(63,185,80,0.45); background:rgba(63,185,80,0.10); }
  .tl-scorepill.good { color:#c9b6ef; border-color:rgba(139,92,246,0.45); background:rgba(139,92,246,0.12); }
  .tl-scorepill.low { color:#f0a500; border-color:rgba(233,118,4,0.45); background:rgba(233,118,4,0.10); }
  .tl-scorepill.done-pill { color:#9a9aa2; border-color:#2e2e34; background:transparent; font-weight:600; }
  .tl-review { padding:9px 20px; border:1px solid #2e2e34; border-radius:11px; background:transparent; color:#c7c7cc; font-size:13.5px; font-weight:600; cursor:pointer; }
  .tl-review:hover { background:#1c1c20; color:#fff; }
  .tl-card { position:relative; z-index:1; margin-left:-14px; padding:16px 20px 16px 14px; flex:1; display:flex; align-items:center; gap:20px; background:#161618; border:1px solid #2a2a2e; border-radius:18px; }
  .tl-card .tl-sub { font-size:13.5px; color:#8a8a93; margin-top:3px; }

  /* ── Study Brief ── */
  .brief { display:none; max-width:880px; margin:0 auto; padding:48px 28px 40px; }
  .br-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:26px; }
  .br-kicker { font-size:11.5px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:#b79df5; margin-bottom:8px; }
  .br-title { font-size:clamp(24px,3.2vw,34px); font-weight:800; letter-spacing:-.02em; line-height:1.2; color:#fff; }
  .br-regen { flex-shrink:0; padding:9px 18px; border:1px solid #2e2e34; border-radius:11px; background:transparent; color:#c7c7cc; font-size:13.5px; font-weight:600; cursor:pointer; }
  .br-regen:hover { background:#1c1c20; color:#fff; }
  .br-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .br-card { background:#161618; border:1px solid #2a2a2e; border-radius:16px; padding:18px 20px; }
  .br-card.full { grid-column:1 / -1; }
  .br-card.big { background:linear-gradient(150deg, rgba(139,92,246,0.13) 0%, #161618 58%); border-color:rgba(139,92,246,0.32); }
  .br-ct { display:flex; align-items:center; gap:9px; font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#8a8a93; margin-bottom:12px; }
  .br-ct svg { width:15px; height:15px; stroke:#a78bfa; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .br-big-text { font-size:17px; line-height:1.6; color:#e8e8e6; font-weight:500; }
  .br-list { list-style:none; display:flex; flex-direction:column; gap:10px; }
  .br-list li { display:flex; gap:11px; font-size:14.8px; line-height:1.55; color:#cfcfcd; }
  .br-list li::before { content:''; flex-shrink:0; width:6px; height:6px; margin-top:8px; border-radius:50%; background:#8b5cf6; }
  .br-list.warn li::before { background:#f0a500; }
  .br-list.goal { counter-reset:g; }
  .br-list.goal li::before { content:counter(g); counter-increment:g; width:20px; height:20px; margin-top:1px; border-radius:6px; background:rgba(139,92,246,0.18); color:#c9b6ef; font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .br-terms { display:flex; flex-direction:column; gap:11px; }
  .br-term { font-size:14.8px; line-height:1.55; color:#a9a9b0; }
  .br-term b { color:#fff; font-weight:700; }
  .br-example { font-size:15px; line-height:1.65; color:#cfc6ea; }
  .br-cta { margin-top:22px; display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; background:#161618; border:1px solid rgba(139,92,246,0.32); border-radius:16px; padding:18px 22px; }
  .br-cta-txt { font-size:16px; font-weight:700; color:#fff; }
  .br-cta-btn { padding:12px 26px; border:none; border-radius:12px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:14.5px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(123,92,250,0.28); text-decoration:none; display:inline-block; }
  .br-cta-btn:hover { filter:brightness(1.07); }
  .br-empty { text-align:center; padding:70px 20px; }
  .br-empty .grad-logo { width:64px; height:64px; opacity:.85; }
  .br-empty p { margin-top:20px; font-size:16px; color:#8a8a93; }
  .br-loading { display:flex; align-items:center; justify-content:center; gap:11px; padding:70px 20px; font-size:15px; color:#8a8a93; }
  .br-loading .grad-logo { width:26px; height:26px; animation:pulse 2.6s ease-in-out infinite; }
  @media (max-width:760px) { .br-grid { grid-template-columns:1fr; } }

  /* Single "next step" button that guides the tab flow */
  .flow-foot { margin-top:22px; }
  .flow-btn { width:100%; padding:15px; border:none; border-radius:14px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:15.5px; font-weight:700; cursor:pointer; box-shadow:0 8px 22px rgba(123,92,250,0.28); transition:filter .15s; }
  .flow-btn:hover { filter:brightness(1.07); }

  /* Shared loading block for the side tabs (same bar as the Learn tab) */
  .tab-load { display:flex; flex-direction:column; align-items:center; padding:64px 20px; }
  .tab-load .grad-logo { width:46px; height:46px; animation:pulse 2.6s ease-in-out infinite; }
  .tab-load-txt { margin-top:20px; font-size:15px; color:#8a8a93; }
  .tab-load .load-progress { margin-top:18px; }

  /* ── Recall (active recall practice) ── */
  .recall { display:none; max-width:760px; margin:0 auto; padding:48px 28px 40px; }
  .rc-meta { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:14px; }
  .rc-count { font-size:13.5px; font-weight:600; color:#8a8a93; }
  .rc-tally { display:flex; gap:8px; }
  .rc-tally span { font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; border:1px solid; }
  .rc-tally .g { color:#3fb950; border-color:rgba(63,185,80,0.40); background:rgba(63,185,80,0.10); }
  .rc-tally .a { color:#f0a500; border-color:rgba(233,118,4,0.40); background:rgba(233,118,4,0.10); }
  .rc-tally .f { color:#f0857f; border-color:rgba(248,81,73,0.35); background:rgba(248,81,73,0.09); }
  .rc-bar { height:5px; border-radius:99px; background:#1e1e22; overflow:hidden; margin-bottom:22px; }
  .rc-bar i { display:block; height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#a78bfa,#7c3aed); transition:width .3s ease; }
  .rc-card { background:#161618; border:1px solid #2a2a2e; border-radius:18px; padding:24px; }
  .rc-type { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#c9b6ef; background:rgba(139,92,246,0.14); border:1px solid rgba(139,92,246,0.30); padding:5px 11px; border-radius:999px; margin-bottom:16px; }
  .rc-prompt { font-size:20px; font-weight:700; line-height:1.4; color:#fff; letter-spacing:-.01em; margin-bottom:18px; }
  .rc-label { font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#8a8a93; margin-bottom:8px; }
  .rc-input { width:100%; min-height:96px; resize:vertical; background:#0f0f10; border:1px solid #2a2a2e; border-radius:12px; padding:13px 15px; color:#e8e8e6; font-size:15px; line-height:1.55; font-family:'Inter',sans-serif; outline:none; }
  .rc-input:focus { border-color:#7c3aed; }
  .rc-input::placeholder { color:#6a6a72; }
  .rc-reveal { margin-top:16px; width:100%; padding:13px; border:none; border-radius:12px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(123,92,250,0.26); }
  .rc-reveal:hover { filter:brightness(1.07); }
  .rc-answer { margin-top:20px; border-top:1px solid #2a2a2e; padding-top:20px; }
  .rc-ideal { font-size:15.5px; line-height:1.65; color:#cfc6ea; background:rgba(139,92,246,0.08); border:1px solid rgba(139,92,246,0.26); border-radius:13px; padding:14px 16px; }
  .rc-why { margin-top:20px; }
  .rc-why .rc-input { min-height:74px; }
  .rc-conf { margin-top:22px; }
  .rc-conf-btns { display:flex; gap:10px; }
  .rc-conf-btn { flex:1; padding:12px 10px; border-radius:12px; border:1.5px solid #2e2e34; background:transparent; color:#c7c7cc; font-size:14.5px; font-weight:700; cursor:pointer; transition:border-color .12s, background .12s, color .12s; }
  .rc-conf-btn:hover { background:#1c1c20; color:#fff; }
  .rc-conf-btn.got.on { border-color:#3fb950; color:#3fb950; background:rgba(63,185,80,0.12); }
  .rc-conf-btn.almost.on { border-color:#f0a500; color:#f0a500; background:rgba(233,118,4,0.12); }
  .rc-conf-btn.forgot.on { border-color:#f85149; color:#f0857f; background:rgba(248,81,73,0.10); }
  .rc-nav { display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
  .rc-prev { padding:11px 24px; border:1px solid #2e2e34; border-radius:12px; background:transparent; color:#c7c7cc; font-size:14.5px; font-weight:600; cursor:pointer; }
  .rc-prev:hover { background:#1c1c20; color:#fff; }
  .rc-prev[disabled] { opacity:.35; pointer-events:none; }
  .rc-next { padding:11px 30px; border:none; border-radius:12px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:14.5px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(123,92,250,0.26); }
  .rc-next:hover { filter:brightness(1.07); }
  .rc-next[disabled] { opacity:.4; pointer-events:none; box-shadow:none; }
  .rc-done { text-align:center; padding:52px 20px 26px; }
  .rc-done .grad-logo { width:64px; height:64px; }
  .rc-done h2 { font-size:26px; font-weight:800; color:#fff; margin:18px 0 8px; }
  .rc-done p { font-size:15.5px; color:#9a9aa2; }
  .rc-restart { margin-top:22px; padding:12px 28px; border:1px solid #2e2e34; border-radius:12px; background:transparent; color:#c7c7cc; font-size:14.5px; font-weight:600; cursor:pointer; }
  .rc-restart:hover { background:#1c1c20; color:#fff; }

  /* ── StudyCast (audio-style recap) ── */
  .studycast { display:none; max-width:780px; margin:0 auto; padding:48px 28px 40px; }
  .sc-player { background:linear-gradient(150deg, rgba(139,92,246,0.16) 0%, #161618 62%); border:1px solid rgba(139,92,246,0.34); border-radius:18px; padding:20px 22px; }
  .sc-player-top { display:flex; align-items:center; gap:16px; }
  .sc-play { width:54px; height:54px; flex-shrink:0; border:none; border-radius:50%; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 8px 20px rgba(123,92,250,0.32); }
  .sc-play svg { width:22px; height:22px; fill:currentColor; }
  .sc-play:hover { filter:brightness(1.08); }
  .sc-play[disabled] { opacity:.55; pointer-events:none; }
  .sc-pinfo { min-width:0; flex:1; }
  .sc-plabel { font-size:15.5px; font-weight:700; color:#fff; }
  .sc-psub { font-size:13px; color:#9a9aa2; margin-top:3px; }
  .sc-ctrls { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .sc-ctrl { padding:8px 13px; border:1px solid #2e2e34; border-radius:10px; background:transparent; color:#c7c7cc; font-size:13px; font-weight:600; cursor:pointer; }
  .sc-ctrl:hover { background:#1c1c20; color:#fff; }
  .sc-ctrl.on { border-color:#8b5cf6; color:#c9b6ef; background:rgba(139,92,246,0.14); }

  .sc-note { margin-top:14px; font-size:13.5px; line-height:1.5; color:#f0b3ae; background:rgba(248,81,73,0.07); border:1px solid rgba(248,81,73,0.28); border-radius:11px; padding:11px 13px; }
  .sc-sections { margin-top:20px; display:flex; flex-direction:column; gap:14px; }

  .sc-ct { display:flex; align-items:center; gap:9px; font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#8a8a93; margin-bottom:11px; }

  .sc-list li::before { content:''; flex-shrink:0; width:6px; height:6px; margin-top:8px; border-radius:50%; background:#8b5cf6; }

  .sc-list.warn li::before { background:#f0a500; }

  /* Collapsible Main recap */
  .sc-card.drop { padding:0; }
  .sc-drop-head { width:100%; display:flex; align-items:center; gap:9px; padding:18px 20px; background:transparent; border:none; cursor:pointer; text-align:left; font-family:'Inter',sans-serif; }

  /* ── Checkpoint (understanding check) ── */
  .checkpoint { display:none; max-width:760px; margin:0 auto; padding:48px 28px 40px; }
  .cp-meta { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px; }
  .cp-count { font-size:13.5px; font-weight:600; color:#8a8a93; }
  .cp-score { font-size:13.5px; font-weight:700; color:#c9b6ef; }
  .cp-bar { height:5px; border-radius:99px; background:#1e1e22; overflow:hidden; margin-bottom:22px; }
  .cp-bar i { display:block; height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#a78bfa,#7c3aed); transition:width .3s ease; }
  .cp-card { background:#161618; border:1px solid #2a2a2e; border-radius:18px; padding:24px; }
  .cp-type { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#c9b6ef; background:rgba(139,92,246,0.14); border:1px solid rgba(139,92,246,0.30); padding:5px 11px; border-radius:999px; margin-bottom:16px; }
  .cp-q { font-size:20px; font-weight:700; line-height:1.42; color:#fff; letter-spacing:-.01em; margin-bottom:18px; }
  .cp-opts { display:flex; flex-direction:column; gap:10px; }
  .cp-opt { display:flex; align-items:center; gap:14px; text-align:left; padding:15px 17px; background:#0f0f10; border:1.5px solid #2a2a2e; border-radius:13px; color:#e4e4e5; font-size:15.5px; line-height:1.45; cursor:pointer; transition:border-color .12s, background .12s; }
  .cp-opt:hover { border-color:#3a3a40; }
  .cp-opt .num { width:26px; height:26px; flex-shrink:0; border-radius:7px; border:1.5px solid #3a3a40; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:#9a9aa2; }
  .cp-opt.sel { border-color:#8b5cf6; background:#1d1730; }
  .cp-opt.sel .num { border-color:#8b5cf6; color:#c9b6ef; }
  .cp-opt.correct { border-color:#3fb950; background:rgba(63,185,80,0.10); }
  .cp-opt.correct .num { border-color:#3fb950; color:#3fb950; }
  .cp-opt.wrong { border-color:#f85149; background:rgba(248,81,73,0.10); }
  .cp-opt.wrong .num { border-color:#f85149; color:#f85149; }
  .cp-opt.locked { pointer-events:none; }
  .cp-input { width:100%; min-height:92px; resize:vertical; background:#0f0f10; border:1px solid #2a2a2e; border-radius:12px; padding:13px 15px; color:#e8e8e6; font-size:15px; line-height:1.55; font-family:'Inter',sans-serif; outline:none; }
  .cp-input:focus { border-color:#7c3aed; }
  .cp-input::placeholder { color:#6a6a72; }
  .cp-input[readonly] { opacity:.75; }
  .cp-submit { margin-top:16px; width:100%; padding:13px; border:none; border-radius:12px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(123,92,250,0.26); }
  .cp-submit:hover { filter:brightness(1.07); }
  .cp-submit[disabled] { opacity:.4; pointer-events:none; box-shadow:none; }
  .cp-fb { margin-top:18px; border-radius:13px; padding:14px 16px; font-size:15px; line-height:1.6; border:1px solid; }
  .cp-fb.good { color:#a9e5b4; background:rgba(63,185,80,0.09); border-color:rgba(63,185,80,0.32); }
  .cp-fb.bad { color:#f0b3ae; background:rgba(248,81,73,0.07); border-color:rgba(248,81,73,0.30); }
  .cp-fb b { display:block; margin-bottom:5px; color:#fff; font-size:13px; letter-spacing:.06em; text-transform:uppercase; }
  .cp-ideal { margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.09); color:#cfc6ea; }
  .cp-follow { margin-top:16px; }
  .cp-follow .cp-input { min-height:66px; }
  .cp-label { font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#8a8a93; margin-bottom:8px; }
  .cp-next { margin-top:18px; width:100%; padding:13px; border:none; border-radius:12px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(123,92,250,0.26); }
  .cp-next:hover { filter:brightness(1.07); }
  /* Summary */
  .cp-sum-top { text-align:center; padding:34px 0 10px; }
  .cp-sum-top .grad-logo { width:60px; height:60px; }
  .cp-sum-top h2 { font-size:32px; font-weight:800; color:#fff; margin:16px 0 6px; letter-spacing:-.02em; }
  .cp-sum-top p { font-size:15.5px; color:#9a9aa2; }
  .cp-areas { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:26px; }
  .cp-area { background:#161618; border:1px solid #2a2a2e; border-radius:16px; padding:18px 20px; }
  .cp-area.strong { border-color:rgba(63,185,80,0.28); }
  .cp-area.weak { border-color:rgba(233,118,4,0.30); }
  .cp-area .cp-label { margin-bottom:11px; }
  .cp-area ul { list-style:none; display:flex; flex-direction:column; gap:9px; }
  .cp-area li { display:flex; gap:10px; font-size:14.8px; line-height:1.5; color:#cfcfcd; }
  .cp-area li::before { content:''; flex-shrink:0; width:6px; height:6px; margin-top:7px; border-radius:50%; }
  .cp-area.strong li::before { background:#3fb950; }
  .cp-area.weak li::before { background:#f0a500; }
  .cp-area .none { font-size:14.5px; color:#6f6f76; }
  .cp-nextstep { margin-top:16px; background:#161618; border:1px solid rgba(139,92,246,0.32); border-radius:16px; padding:20px 22px; }
  .cp-nextstep .rec { font-size:16px; font-weight:700; color:#fff; margin-bottom:4px; }
  .cp-nextstep .why { font-size:14.5px; color:#9a9aa2; }
  .cp-steps { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .cp-step { flex:1; min-width:150px; padding:12px 14px; border-radius:12px; border:1px solid #2e2e34; background:transparent; color:#c7c7cc; font-size:14px; font-weight:600; cursor:pointer; text-align:center; }
  .cp-step:hover { background:#1c1c20; color:#fff; }
  .cp-step.primary { border-color:transparent; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-weight:700; box-shadow:0 6px 18px rgba(123,92,250,0.26); }
  .cp-retry { margin-top:16px; width:100%; padding:12px; border:1px solid #2e2e34; border-radius:12px; background:transparent; color:#c7c7cc; font-size:14.5px; font-weight:600; cursor:pointer; }
  .cp-retry:hover { background:#1c1c20; color:#fff; }
  @media (max-width:640px) { .cp-areas { grid-template-columns:1fr; } }

  /* ── Player (section reader + checkpoint quiz) ── */
  .player { display:none; max-width:820px; margin:0 auto; padding:34px 28px 60px; }
  .pl-top { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  .pl-close { width:34px; height:34px; border:none; border-radius:9px; background:transparent; color:#8a8a93; font-size:20px; cursor:pointer; flex-shrink:0; }
  .pl-close:hover { background:#1c1c20; color:#fff; }
  .pl-label { font-size:14px; color:#d4d4d8; font-weight:600; display:flex; align-items:center; gap:7px; min-width:0; }
  .pl-label .star { color:#f0a500; }
  .pl-label .dim { color:#8a8a93; font-weight:500; }
  .pl-score { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:15px; font-weight:700; color:#c9b6ef; }
  .pl-score .score-logo { width:17px; height:17px; }
  .pl-bar { height:5px; border-radius:99px; background:#1e1e22; overflow:hidden; margin-bottom:40px; }
  .pl-bar i { display:block; height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#a78bfa,#7c3aed); transition:width .3s ease; }

  /* Section reader */
  .reader { font-size:16.5px; line-height:1.75; color:#d6d6d4; }
  .reader h1, .reader h2 { font-size:26px; font-weight:800; letter-spacing:-.015em; color:#fff; margin:0 0 18px; }
  .reader h3 { font-size:19px; font-weight:700; color:#fff; margin:26px 0 10px; }
  .reader p { margin:0 0 16px; }
  .reader ul, .reader ol { margin:0 0 16px; padding-left:26px; }
  .reader li { margin-bottom:8px; }
  .reader strong { color:#fff; }
  .reader blockquote { border-left:3px solid #7c3aed; background:rgba(139,92,246,0.08); border-radius:0 10px 10px 0; padding:12px 16px; margin:0 0 16px; color:#cfc6ea; }
  .reader code { background:#1c1c20; border:1px solid #2a2a2e; border-radius:6px; padding:2px 6px; font-size:14px; }
  .reader table { width:100%; border-collapse:collapse; margin:0 0 18px; font-size:14.5px; }
  .reader th, .reader td { border:1px solid #2a2a2e; padding:9px 12px; text-align:left; }
  .reader th { background:#161619; color:#fff; }
  .pl-nav { display:flex; justify-content:space-between; align-items:center; margin-top:44px; }
  .pl-back { padding:12px 26px; border:1px solid #2e2e34; border-radius:12px; background:transparent; color:#c7c7cc; font-size:14.5px; font-weight:600; cursor:pointer; }
  .pl-back:hover { background:#1c1c20; color:#fff; }
  .pl-back[disabled] { opacity:.35; pointer-events:none; }
  .pl-next { padding:12px 34px; border:none; border-radius:12px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(123,92,250,0.28); }
  .pl-next:hover { filter:brightness(1.07); }

  /* Checkpoint quiz */
  .qz-q { font-size:clamp(22px,3vw,30px); font-weight:800; letter-spacing:-.015em; line-height:1.3; color:#fff; margin-bottom:30px; }
  .qz-opts { display:flex; flex-direction:column; gap:14px; }
  .qz-opt { display:flex; align-items:center; gap:16px; text-align:left; padding:20px 22px; background:#161618; border:1.5px solid #2a2a2e; border-radius:16px; color:#e4e4e5; font-size:16.5px; line-height:1.45; cursor:pointer; transition:border-color .12s, background .12s; }
  .qz-opt:hover { border-color:#3a3a40; }
  .qz-opt .num { width:30px; height:30px; flex-shrink:0; border-radius:8px; border:1.5px solid #3a3a40; display:flex; align-items:center; justify-content:center; font-size:13.5px; font-weight:700; color:#9a9aa2; }
  .qz-opt.sel { border-color:#8b5cf6; background:#1d1730; }
  .qz-opt.sel .num { border-color:#8b5cf6; color:#c9b6ef; }
  .qz-opt.correct { border-color:#3fb950; background:rgba(63,185,80,0.10); }
  .qz-opt.correct .num { border-color:#3fb950; color:#3fb950; }
  .qz-opt.wrong { border-color:#f85149; background:rgba(248,81,73,0.10); }
  .qz-opt.wrong .num { border-color:#f85149; color:#f85149; }
  .qz-opt.disabled { pointer-events:none; }
  /* Question-type badge + non-MC answer controls (same visual language) */
  .qz-type { display:inline-flex; align-items:center; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#c9b6ef; background:rgba(139,92,246,0.14); border:1px solid rgba(139,92,246,0.30); padding:5px 11px; border-radius:999px; margin-bottom:16px; }
  .qz-opts.tf { flex-direction:row; gap:12px; }
  .qz-opts.tf .qz-opt { flex:1; justify-content:center; }
  .qz-input { width:100%; min-height:104px; resize:vertical; background:#0f0f10; border:1.5px solid #2a2a2e; border-radius:14px; padding:14px 16px; color:#e8e8e6; font-size:16px; line-height:1.6; font-family:'Inter',sans-serif; outline:none; }
  .qz-input:focus { border-color:#7c3aed; }
  .qz-input::placeholder { color:#6a6a72; }
  .qz-input[readonly] { opacity:.75; }
  .qz-order { display:flex; flex-direction:column; gap:10px; }
  .qz-order-row { display:flex; align-items:center; gap:14px; padding:14px 16px; background:#161618; border:1.5px solid #2a2a2e; border-radius:14px; font-size:16px; line-height:1.45; color:#e4e4e5; }
  .qz-order-row .pos { width:28px; height:28px; flex-shrink:0; border-radius:8px; border:1.5px solid #3a3a40; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#9a9aa2; }
  .qz-order-row .txt { flex:1; min-width:0; }
  .qz-order-row .moves { display:flex; flex-direction:column; gap:3px; flex-shrink:0; }
  .qz-order-row .mv { width:26px; height:19px; border:1px solid #2e2e34; border-radius:6px; background:transparent; color:#9a9aa2; font-size:9px; line-height:1; cursor:pointer; }
  .qz-order-row .mv:hover { background:#26262c; color:#fff; }
  .qz-order-row .mv[disabled] { opacity:.3; pointer-events:none; }
  .qz-order-row.locked .mv { display:none; }
  .qz-order-row.correct { border-color:#3fb950; background:rgba(63,185,80,0.10); }
  .qz-order-row.correct .pos { border-color:#3fb950; color:#3fb950; }
  .qz-order-row.wrong { border-color:#f85149; background:rgba(248,81,73,0.10); }
  .qz-order-row.wrong .pos { border-color:#f85149; color:#f85149; }
  .qz-ideal { margin-top:11px; padding-top:11px; border-top:1px solid rgba(255,255,255,0.10); color:#cfc6ea; }
  .qz-explain { margin-top:20px; font-size:15px; line-height:1.6; color:#cfc6ea; background:rgba(139,92,246,0.08); border:1px solid rgba(139,92,246,0.28); border-radius:13px; padding:14px 17px; display:none; }
  .qz-explain.bad { color:#f0b3ae; background:rgba(248,81,73,0.07); border-color:rgba(248,81,73,0.3); }
  .qz-actions { display:flex; justify-content:flex-end; margin-top:30px; }
  .qz-check { padding:13px 40px; border:none; border-radius:13px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:15.5px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(123,92,250,0.28); }
  .qz-check[disabled] { opacity:.4; pointer-events:none; }
  .qz-check:hover { filter:brightness(1.07); }

  /* Checkpoint result */
  .qz-done { text-align:center; padding:60px 0 20px; }
  .qz-done .big { display:flex; justify-content:center; }
  .qz-done .result-logo { width:76px; height:76px; }
  .qz-done h2 { font-size:30px; font-weight:800; color:#fff; margin:16px 0 8px; }
  .qz-done p { font-size:16px; color:#9a9aa2; }

  .toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(8px); background:#1c1c20; border:1px solid #2e2e34; color:#e4e4e5; font-size:13.5px; padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:100; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>

<div class="topbar">
  <a class="brand" href="chatbot.html">
    <span class="grad-logo" role="img" aria-label="Noura"></span>
    <span class="word grad-text">Noura</span>

<div class="main">
  <!-- Generating -->

  <!-- Overview / contents -->
  <div class="overview" id="overview">

      <div class="ov-logo"><span class="grad-logo"></span></div>

  <!-- Study Brief -->
  <div class="brief" id="briefView">
    <div class="br-head">
      <div>
        <div class="br-kicker">Study Brief</div>
        <h1 class="br-title" id="brTitle"></h1>
      </div>
      <button class="br-regen" id="brRegen" type="button" title="Regenerate">Regenerate</button>
    </div>
    <div id="brBody"></div>
  </div>

  <!-- StudyCast -->
  <div class="studycast" id="castView">
    <div class="br-head">
      <div>
        <div class="br-kicker">StudyCast</div>
        <h1 class="br-title" id="scTitle"></h1>
      </div>
      <button class="br-regen" id="scRegen" type="button" title="Regenerate">Regenerate</button>
    </div>
    <div id="scBody"></div>
  </div>

  <!-- Checkpoint -->
  <div class="checkpoint" id="checkView">
    <div class="br-head">
      <div>
        <div class="br-kicker">Checkpoint</div>
        <h1 class="br-title" id="cpTitle"></h1>
      </div>
      <button class="br-regen" id="cpRegen" type="button" title="Regenerate">Regenerate</button>
    </div>
    <div id="cpBody"></div>
  </div>

  <!-- Recall -->
  <div class="recall" id="recallView">
    <div class="br-head">
      <div>
        <div class="br-kicker">Recall</div>
        <h1 class="br-title" id="rcTitle"></h1>
      </div>
      <button class="br-regen" id="rcRegen" type="button" title="Regenerate">Regenerate</button>
    </div>
    <div id="rcBody"></div>
  </div>

  <!-- Player -->
  <div class="player" id="player">
    <div class="pl-top">
      <button class="pl-close" id="plClose" type="button" aria-label="Back to contents">✕</button>
      <div class="pl-label" id="plLabel"></div>
      <div class="pl-score" id="plScore" hidden><span class="grad-logo score-logo"></span><span id="plScoreN">0</span></div>
    </div>
    <div class="pl-bar"><i id="plBarFill"></i></div>
    <div id="plBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const title = (params.get('title') || 'Your lesson').trim();
  const subject = (params.get('subject') || '').trim();
  const slug = title.toLowerCase();
  const DATA_KEY = 'NOURA_LESSON_V2_' + slug;
  const STATE_KEY = 'NOURA_LESSON_STATE_' + slug;

  document.title = 'Noura — ' + title;
  document.getElementById('crumbTitle').textContent = title;
  document.getElementById('loadTitle').textContent = title;
  document.getElementById('ovTitle').textContent = title;

  // Opening a lesson counts as studying → keep the streak alive.
  try {
    const d = new Date();
    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const arr = JSON.parse(localStorage.getItem('TEACHLOOP_ACTIVE_DAYS') || '[]');
    if (Array.isArray(arr) && arr.indexOf(ds) === -1) { arr.push(ds); localStorage.setItem('TEACHLOOP_ACTIVE_DAYS', JSON.stringify(arr)); }
  } catch (e) {}

  // Toast + coming-soon rail
  const toast = document.getElementById('toast');
  let toastT = null;
  function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('show'), 2200); }
  document.querySelectorAll('.rail-item.soon').forEach(b => b.addEventListener('click', () => showToast(b.dataset.soon + ' — coming soon')));

  const loadView = document.getElementById('loadView');
  const overview = document.getElementById('overview');
  const player = document.getElementById('player');
  const loadStatus = document.getElementById('loadStatus');
  const loadError = document.getElementById('loadError');
  const retryBtn = document.getElementById('retryBtn');

  let lesson = null;   // { title, overview, items:[{type:'checkpoint'|'section', title, questions|pages}] }
  let state = { done: [], scores: {} };
  try { const st = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); if (st && Array.isArray(st.done)) state = st; } catch (e) {}
  function saveState() { try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {} }
  const isDone = i => state.done.indexOf(i) !== -1;
  function markDone(i) { if (!isDone(i)) { state.done.push(i); saveState(); } }
  function firstIncomplete() { for (let i = 0; i < lesson.items.length; i++) if (!isDone(i)) return i; return -1; }
  function isLocked(i) { for (let j = 0; j < i; j++) if (!isDone(j)) return true; return false; }
  function totalScore() { let n = 0; for (const k in state.scores) n += state.scores[k]; return n; }

  function md(text) {
    const html = marked.parse(String(text || ''), { gfm: true, breaks: false });
    return html;
  }
  function mathify(el) {
    if (window.renderMathInElement) renderMathInElement(el, { delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false });
  }

  // Guided-flow completion state (declared early: the rail lock logic reads it).
  const FLOW_KEY = 'NOURA_FLOW_' + slug;
  let flow = {};
  try { const f = JSON.parse(localStorage.getItem(FLOW_KEY) || '{}'); if (f && typeof f === 'object') flow = f; } catch (e) {}

  // ── Views ──
  const briefView = document.getElementById('briefView');
  const recallView = document.getElementById('recallView');
  const checkView = document.getElementById('checkView');
  const castView = document.getElementById('castView');
  const railLearn = document.getElementById('railLearn');
  const railBrief = document.getElementById('railBrief');
  const railRecall = document.getElementById('railRecall');
  const railCheck = document.getElementById('railCheck');
  const railCast = document.getElementById('railCast');
  function show(view) {
    loadView.style.display = view === 'load' ? 'flex' : 'none';
    overview.style.display = view === 'overview' ? 'block' : 'none';
    player.style.display = view === 'player' ? 'block' : 'none';
    briefView.style.display = view === 'brief' ? 'block' : 'none';
    recallView.style.display = view === 'recall' ? 'block' : 'none';
    checkView.style.display = view === 'check' ? 'block' : 'none';
    castView.style.display = view === 'cast' ? 'block' : 'none';
    railBrief.classList.toggle('active', view === 'brief');
    railRecall.classList.toggle('active', view === 'recall');
    railCheck.classList.toggle('active', view === 'check');
    railCast.classList.toggle('active', view === 'cast');
    railLearn.classList.toggle('active', ['brief','recall','check','cast'].indexOf(view) === -1);
    window.scrollTo(0, 0);
  }
  // Tabs unlock in order: each one needs the previous step finished.
  const RAIL = [
    { key: 'learn',  btn: railLearn,  label: 'Learn',       needs: null,     open: () => { if (lesson) renderOverview(); else show('load'); } },
    { key: 'brief',  btn: railBrief,  label: 'Study Brief', needs: 'learn',  open: () => openBrief() },
    { key: 'check',  btn: railCheck,  label: 'Checkpoint',  needs: 'brief',  open: () => openCheck() },
    { key: 'recall', btn: railRecall, label: 'Recall',      needs: 'check',  open: () => openRecall() },
    { key: 'cast',   btn: railCast,   label: 'StudyCast',   needs: 'recall', open: () => openCast() }
  ];
  const LOCK_SVG = '<svg class="rail-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const RAIL_LABEL = {};
  RAIL.forEach(r => { RAIL_LABEL[r.key] = r.label; r.btn.insertAdjacentHTML('beforeend', LOCK_SVG); });

  // A tab unlocks only when every step before it is complete, so a stale flag
  // on one step can't skip the ones ahead of it.
  function railLocked(r) {
    const i = RAIL.findIndex(x => x.key === r.key);
    for (let j = 0; j < i; j++) if (!flow[RAIL[j].key]) return true;
    return false;
  }
  // The first incomplete step before this tab — used for the "finish X first" hint.
  function railBlocker(r) {
    const i = RAIL.findIndex(x => x.key === r.key);
    for (let j = 0; j < i; j++) if (!flow[RAIL[j].key]) return RAIL[j];
    return null;
  }
  function refreshRailLocks() {
    RAIL.forEach(r => r.btn.classList.toggle('locked', railLocked(r)));
  }
  RAIL.forEach(r => r.btn.addEventListener('click', () => {
    if (railLocked(r)) {
      const blocker = railBlocker(r);
      showToast('Finish ' + (blocker ? blocker.label : 'the previous step') + ' first to unlock ' + r.label);
      return;
    }
    r.open();
  }));
  refreshRailLocks();

  const STAR = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 16.9 6.2 19.8l1.6-6.6L2.6 8.8l6.8-.5z"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  const LOCK = '<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

  function renderOverview() {
    show('overview');
    const cur = firstIncomplete();
    document.getElementById('upNext').textContent = cur === -1 ? 'All complete' : lesson.items[cur].title;
    document.getElementById('startLessonBtn').textContent = cur === -1 ? 'Review lesson' : (state.done.length ? 'Continue lesson' : 'Start lesson');
    document.getElementById('ovProg').textContent = state.done.length + ' of ' + lesson.items.length + ' complete';

    const tl = document.getElementById('timeline');
    tl.innerHTML = '';
    lesson.items.forEach((item, i) => {
      const row = document.createElement('div');
      const done = isDone(i), locked = isLocked(i), current = (i === cur);
      row.className = 'tl-row' + (done ? ' done' : '') + (locked ? ' locked' : '') + (current ? ' current' : '');

      const dot = document.createElement('div');
      dot.className = 'tl-dot';
      dot.innerHTML = done ? CHECK : (item.type === 'checkpoint' ? STAR : String(seqNum(i)));
      row.appendChild(dot);

      if (current) {
        // Highlighted card for the item that's up next
        const card = document.createElement('div');
        card.className = 'tl-card';
        const info = document.createElement('div');
        info.innerHTML = '<div class="tl-title"></div><div class="tl-sub"></div>';
        info.querySelector('.tl-title').textContent = item.title;
        info.querySelector('.tl-sub').textContent = item.type === 'checkpoint'
          ? 'Checkpoint · answers lock after one attempt'
          : item.pages.length + (item.pages.length === 1 ? ' page' : ' pages');
        card.appendChild(info);
        const btn = document.createElement('button');
        btn.className = 'tl-start'; btn.type = 'button'; btn.textContent = 'Start';
        btn.style.marginLeft = 'auto';
        btn.addEventListener('click', () => openItem(i));
        card.appendChild(btn);
        row.appendChild(card);
      } else {
        const t = document.createElement('div');
        t.className = 'tl-title'; t.textContent = item.title;
        row.appendChild(t);
        const meta = document.createElement('div');
        meta.className = 'tl-meta';
        let metaHtml = '';
        if (done && item.type === 'checkpoint') {
          // Completed checkpoint → show the score they earned.
          const sc = state.scores[i] || 0, tot = item.questions.length;
          const pct = sc / tot;
          const cls = pct === 1 ? 'perfect' : (pct >= 0.6 ? 'good' : 'low');
          metaHtml += '<span class="tl-scorepill ' + cls + '">' + sc + ' / ' + tot + '</span>';
        } else if (item.type === 'checkpoint') {
          metaHtml += '<span>Checkpoint</span>';
        } else if (done) {
          metaHtml += '<span class="tl-scorepill done-pill">Completed</span>';
        } else {
          metaHtml += '<span>' + item.pages.length + (item.pages.length === 1 ? ' page' : ' pages') + '</span>';
        }
        if (locked) metaHtml += LOCK;
        meta.innerHTML = metaHtml;
        if (done) {
          const rb = document.createElement('button');
          rb.className = 'tl-review'; rb.type = 'button'; rb.textContent = 'Review';
          rb.addEventListener('click', () => openItem(i));
          meta.appendChild(rb);
        }
        row.appendChild(meta);
      }
      tl.appendChild(row);
    });

    // Grow the neon line through every completed step. Runs synchronously so it
    // still fills when the page is opened in a background tab (rAF is throttled there).
    function paintTimelineFill() {
      const rows = [...tl.querySelectorAll('.tl-row')];
      const doneRows = rows.filter(r => r.classList.contains('done'));
      let fill = 0;
      if (doneRows.length) {
        if (doneRows.length === rows.length) {
          fill = Math.max(0, tl.offsetHeight - 28);          // all done → full track
        } else {
          const dot = doneRows[doneRows.length - 1].querySelector('.tl-dot');
          fill = Math.max(0, dot.offsetTop + dot.offsetHeight / 2 - 14);
        }
      }
      tl.style.setProperty('--tl-fill', fill + 'px');
    }
    paintTimelineFill();
    setTimeout(paintTimelineFill, 60);   // re-measure once fonts/layout settle

    // Lesson finished → single button to the next step in the flow.
    const oldFoot = overview.querySelector('.flow-foot');
    if (oldFoot) oldFoot.remove();
    if (cur === -1) {
      markFlow('learn');
      tl.insertAdjacentHTML('afterend', flowFooter('learn'));
      wireFlow(overview);
    }
  }
  // Sections get sequential numbers; checkpoints show a star instead.
  function seqNum(i) { let n = 0; for (let j = 0; j <= i; j++) n++; return n; }

  document.getElementById('startLessonBtn').addEventListener('click', () => {
    const cur = firstIncomplete();
    openItem(cur === -1 ? 0 : cur);
  });
  document.getElementById('plClose').addEventListener('click', renderOverview);

  const plLabel = document.getElementById('plLabel');
  const plScore = document.getElementById('plScore');
  const plScoreN = document.getElementById('plScoreN');
  const plBarFill = document.getElementById('plBarFill');
  const plBody = document.getElementById('plBody');

  function openItem(i) {
    const item = lesson.items[i];
    if (!item) return;
    show('player');
    if (item.type === 'section') playSection(i, item);
    else playCheckpoint(i, item);
  }

  // ── Section reader ──
  function playSection(idx, item) {
    plScore.hidden = true;
    let page = 0;
    function render() {
      plLabel.innerHTML = '<span></span><span class="dim">· page ' + (page + 1) + ' of ' + item.pages.length + '</span>';
      plLabel.querySelector('span').textContent = item.title;
      plBarFill.style.width = Math.round(((page + 1) / item.pages.length) * 100) + '%';
      plBody.innerHTML = '';
      const art = document.createElement('div');
      art.className = 'reader';
      art.innerHTML = md(item.pages[page]);
      mathify(art);
      plBody.appendChild(art);
      const nav = document.createElement('div');
      nav.className = 'pl-nav';
      const back = document.createElement('button'); back.className = 'pl-back'; back.type = 'button'; back.textContent = 'Back';
      if (page === 0) back.disabled = true;
      back.addEventListener('click', () => { page--; render(); });
      const next = document.createElement('button'); next.className = 'pl-next'; next.type = 'button';
      next.textContent = page === item.pages.length - 1 ? 'Finish section' : 'Next';
      next.addEventListener('click', () => {
        if (page === item.pages.length - 1) { markDone(idx); renderOverview(); }
        else { page++; render(); }
      });
      nav.appendChild(back); nav.appendChild(next);
      plBody.appendChild(nav);
      window.scrollTo(0, 0);
    }
    render();
  }

  // ── Checkpoint quiz ──
  // Six question types share one layout: prompt → answer control → Check →
  // feedback → Continue. Free-text answers are graded by the tutor.
  function playCheckpoint(idx, item) {
    plScore.hidden = false;
    let q = 0, score = 0;
    const baseScore = totalScore() - (state.scores[idx] || 0);   // score from other checkpoints
    plScoreN.textContent = String(baseScore);

    function render() {
      const question = item.questions[q];
      const qType = question.type || 'mc';
      let picked = -1, checked = false, orderState = null;

      plLabel.innerHTML = '<span class="star">★</span><span>Checkpoint</span><span class="dim">· ' + escapeHtml(item.title) + ' · ' + (q + 1) + ' of ' + item.questions.length + '</span>';
      plBarFill.style.width = Math.round((q / item.questions.length) * 100) + '%';
      plBody.innerHTML = '';

      const badge = document.createElement('div');
      badge.className = 'qz-type';
      badge.textContent = QTYPE[qType] || 'Question';
      plBody.appendChild(badge);

      const h = document.createElement('div'); h.className = 'qz-q'; h.textContent = question.q;
      plBody.appendChild(h);

      const explain = document.createElement('div'); explain.className = 'qz-explain';
      const actions = document.createElement('div'); actions.className = 'qz-actions';
      const checkBtn = document.createElement('button');
      checkBtn.type = 'button'; checkBtn.className = 'qz-check'; checkBtn.textContent = 'Check'; checkBtn.disabled = true;

      let opts = null, textEl = null, orderList = null;

      if (qType === 'mc' || qType === 'tf') {
        opts = document.createElement('div');
        opts.className = 'qz-opts' + (qType === 'tf' ? ' tf' : '');
        question.options.forEach((opt, oi) => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'qz-opt';
          b.innerHTML = '<span class="num">' + (oi + 1) + '</span><span class="txt"></span>';
          b.querySelector('.txt').textContent = opt;
          b.addEventListener('click', () => {
            if (checked) return;
            picked = oi;
            opts.querySelectorAll('.qz-opt').forEach(o => o.classList.remove('sel'));
            b.classList.add('sel');
            checkBtn.disabled = false;
          });
          opts.appendChild(b);
        });
        plBody.appendChild(opts);
      } else if (qType === 'order') {
        // Shuffled steps the student reorders with the arrows.
        orderState = question.steps.map((t, i) => ({ t: t, i: i }));
        for (let k = orderState.length - 1; k > 0; k--) {
          const j = Math.floor(Math.random() * (k + 1));
          const tmp = orderState[k]; orderState[k] = orderState[j]; orderState[j] = tmp;
        }
        if (orderState.every((o, i) => o.i === i)) orderState.push(orderState.shift());
        orderList = document.createElement('div');
        orderList.className = 'qz-order';
        plBody.appendChild(orderList);
        paintOrder();
        checkBtn.disabled = false;
      } else {
        textEl = document.createElement('textarea');
        textEl.className = 'qz-input';
        textEl.placeholder = qType === 'mistake' ? 'What is wrong here, and what should it be?' : 'Answer in a sentence or two…';
        textEl.spellcheck = false;
        textEl.addEventListener('input', () => { checkBtn.disabled = !textEl.value.trim(); });
        plBody.appendChild(textEl);
      }

      plBody.appendChild(explain);
      actions.appendChild(checkBtn);
      plBody.appendChild(actions);

      function paintOrder() {
        orderList.innerHTML = '';
        orderState.forEach((step, si) => {
          const row = document.createElement('div');
          row.className = 'qz-order-row';
          row.innerHTML = '<span class="pos">' + (si + 1) + '</span><span class="txt"></span>' +
            '<span class="moves">' +
              '<button type="button" class="mv" data-dir="-1" aria-label="Move up"' + (si === 0 ? ' disabled' : '') + '>&#9650;</button>' +
              '<button type="button" class="mv" data-dir="1" aria-label="Move down"' + (si === orderState.length - 1 ? ' disabled' : '') + '>&#9660;</button>' +
            '</span>';
          row.querySelector('.txt').textContent = step.t;
          row.querySelectorAll('.mv').forEach(b => b.addEventListener('click', () => {
            if (checked) return;
            const dir = parseInt(b.dataset.dir, 10);
            const to = si + dir;
            if (to < 0 || to >= orderState.length) return;
            const tmp = orderState[si]; orderState[si] = orderState[to]; orderState[to] = tmp;
            paintOrder();
          }));
          orderList.appendChild(row);
        });
      }

      checkBtn.addEventListener('click', async () => {
        if (!checked) {
          checked = true;
          let right = false;

          if (qType === 'mc' || qType === 'tf') {
            opts.querySelectorAll('.qz-opt').forEach((o, oi) => {
              o.classList.add('disabled');
              if (oi === question.answer) o.classList.add('correct');
              else if (oi === picked) o.classList.add('wrong');
            });
            right = picked === question.answer;
            explain.textContent = (right ? 'Correct! ' : 'Not quite. ') + (question.explain || '');
          } else if (qType === 'order') {
            right = orderState.every((step, si) => step.i === si);
            orderList.querySelectorAll('.qz-order-row').forEach((row, si) => {
              row.classList.add('locked');
              row.classList.add(orderState[si].i === si ? 'correct' : 'wrong');
            });
            if (!right) {
              const correct = question.steps.map((t, i) => (i + 1) + '. ' + t).join('  ');
              explain.textContent = 'Not quite. Correct order: ' + correct + (question.explain ? ' — ' + question.explain : '');
            } else {
              explain.textContent = 'Correct! ' + (question.explain || '');
            }
          } else {
            textEl.readOnly = true;
            checkBtn.textContent = 'Checking…';
            const graded = await gradeOpen({ q: question.q, ideal: question.ideal }, textEl.value.trim());
            right = graded.correct === true;
            explain.textContent = (graded.feedback || '') + (question.explain ? ' ' + question.explain : '');
            if (!right && question.ideal) {
              const ideal = document.createElement('div');
              ideal.className = 'qz-ideal';
              ideal.textContent = 'Ideal answer: ' + question.ideal;
              explain.appendChild(ideal);
            }
          }

          if (right) { score++; plScoreN.textContent = String(baseScore + score); }
          explain.style.display = 'block';
          explain.classList.toggle('bad', !right);
          checkBtn.textContent = q === item.questions.length - 1 ? 'Finish' : 'Continue';
        } else {
          if (q === item.questions.length - 1) {
            state.scores[idx] = score; saveState();
            markDone(idx);
            renderDone();
          } else { q++; render(); }
        }
      });
      window.scrollTo(0, 0);
    }

    function renderDone() {
      plBarFill.style.width = '100%';
      plBody.innerHTML = '';
      const wrap = document.createElement('div'); wrap.className = 'qz-done';
      const pct = score / item.questions.length;
      wrap.innerHTML = '<div class="big"><span class="grad-logo result-logo"></span></div>' +
        '<h2>' + score + ' / ' + item.questions.length + '</h2>' +
        '<p>' + (pct === 1 ? 'Perfect score!' : pct >= 0.6 ? 'Nice work — keep going.' : 'Good effort — review the sections and try the next one.') + '</p>';
      const nav = document.createElement('div'); nav.className = 'qz-actions'; nav.style.justifyContent = 'center';
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'qz-check'; btn.textContent = 'Back to lesson';
      btn.addEventListener('click', renderOverview);
      nav.appendChild(btn);
      wrap.appendChild(nav);
      plBody.appendChild(wrap);
    }
    render();
  }

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ── Guided tab flow ──────────────────────────────────────────
  // Learn → Study Brief → Checkpoint → Recall → StudyCast, then Teach Studio.
  // Each finished tab shows one button: the next step in that order.
  const FLOW = [
    { key: 'learn',  label: 'Learn' },
    { key: 'brief',  label: 'Study Brief' },
    { key: 'check',  label: 'Checkpoint' },
    { key: 'recall', label: 'Recall' },
    { key: 'cast',   label: 'StudyCast' }
  ];
  const CORE = ['learn', 'brief', 'check', 'recall', 'cast'];
  function markFlow(k) {
    if (!flow[k]) {
      flow[k] = true;
      try { localStorage.setItem(FLOW_KEY, JSON.stringify(flow)); } catch (e) {}
      if (typeof refreshRailLocks === 'function') refreshRailLocks();
    }
  }
  function allCoreDone() { return CORE.every(k => flow[k]); }
  // One button only: the next tab in the flow, or Teach Studio once everything is done.
  function flowFooter(currentKey) {
    if (allCoreDone()) return '<div class="flow-foot"><button class="flow-btn" data-flow="teach" type="button">Open Teach Studio</button></div>';
    const i = FLOW.findIndex(f => f.key === currentKey);
    const next = FLOW[(i + 1) % FLOW.length];
    return '<div class="flow-foot"><button class="flow-btn" data-flow="' + next.key + '" type="button">Next: ' + next.label + ' →</button></div>';
  }
  function wireFlow(host) {
    host.querySelectorAll('[data-flow]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.flow;
      if (k === 'teach') { window.location.href = 'chatbot.html'; return; }
      if (k === 'learn') { renderOverview(); return; }
      if (k === 'brief') { openBrief(); return; }
      if (k === 'check') { openCheck(); return; }
      if (k === 'recall') { openRecall(); return; }
      openCast();
    }));
  }

  // Time-based progress bar shared by the side tabs. Eases toward 92%
  // while the request is in flight, then snaps to 100% on completion.
  function tabLoading(host, label, estMs) {
    host.innerHTML = '<div class="tab-load"><span class="grad-logo"></span>' +
      '<div class="tab-load-txt"><span class="lbl"></span><span class="load-pct">0%</span></div>' +
      '<div class="load-progress"><i></i></div></div>';
    host.querySelector('.lbl').textContent = label;
    const fill = host.querySelector('.load-progress i');
    const pctEl = host.querySelector('.load-pct');
    const started = Date.now();
    function tick() {
      const el = Date.now() - started;
      const pct = Math.min(92, Math.round(92 * (1 - Math.exp(-el / (estMs * 0.55)))));
      fill.style.width = pct + '%';
      pctEl.textContent = pct + '%';
    }
    tick();
    const t = setInterval(tick, 400);
    return {
      done: function () { clearInterval(t); fill.style.width = '100%'; pctEl.textContent = '100%'; },
      stop: function () { clearInterval(t); }
    };
  }

  // ── Study Brief ─────────────────────────────────────────────
  // A focused pre-study brief for the current lesson topic. Six fixed
  // sections, generated once and cached alongside the lesson.
  const BRIEF_KEY = 'NOURA_BRIEF_' + slug;
  let brief = null, briefBusy = false;
  const brBody = document.getElementById('brBody');
  document.getElementById('brTitle').textContent = title;

  const ICON = {
    idea: '<svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>',
    key:  '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
    term: '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    ex:   '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>',
    warn: '<svg viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
    goal: '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
  };
  function validBrief(b) {
    return b && typeof b.bigIdea === 'string' && b.bigIdea.trim() &&
      Array.isArray(b.keyConcepts) && b.keyConcepts.length &&
      Array.isArray(b.terms) && b.terms.length &&
      typeof b.example === 'string' && b.example.trim() &&
      Array.isArray(b.mistakes) && b.mistakes.length &&
      Array.isArray(b.explainGoals) && b.explainGoals.length;
  }
  function card(cls, iconKey, label, inner) {
    return '<div class="br-card ' + cls + '"><div class="br-ct">' + ICON[iconKey] + label + '</div>' + inner + '</div>';
  }
  function esc(t) { const d = document.createElement('div'); d.textContent = String(t == null ? '' : t); return d.innerHTML; }
  function listHtml(arr, cls) { return '<ul class="br-list ' + (cls || '') + '">' + arr.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'; }

  function renderBrief() {
    brBody.innerHTML =
      '<div class="br-grid">' +
        card('full big', 'idea', 'Big Idea', '<div class="br-big-text">' + esc(brief.bigIdea) + '</div>') +
        card('', 'key', 'Key Concepts', listHtml(brief.keyConcepts.slice(0, 6))) +
        card('', 'term', 'Must-Know Terms',
          '<div class="br-terms">' + brief.terms.slice(0, 6).map(t =>
            '<div class="br-term"><b>' + esc(t.term) + '</b> — ' + esc(t.definition) + '</div>').join('') + '</div>') +
        card('full', 'ex', 'Simple Example', '<div class="br-example">' + esc(brief.example) + '</div>') +
        card('', 'warn', 'Common Mistakes', listHtml(brief.mistakes.slice(0, 4), 'warn')) +
        card('', 'goal', 'What You Must Be Able To Explain', listHtml(brief.explainGoals.slice(0, 4), 'goal')) +
      '</div>';
    markFlow('brief');
    brBody.insertAdjacentHTML('beforeend', flowFooter('brief'));
    wireFlow(brBody);
    document.getElementById('brRegen').hidden = false;
  }
  function renderBriefEmpty() {
    brBody.innerHTML = '<div class="br-empty"><span class="grad-logo"></span><p>Add a topic or material to generate your StudyBrief.</p></div>';
    document.getElementById('brRegen').hidden = true;

  function renderBriefLoading() {
    document.getElementById('brRegen').hidden = true;

  function renderBriefError(msg) {
    brBody.innerHTML = '<div class="br-empty"><span class="grad-logo"></span><p>' + esc(msg) + '</p></div>';
    document.getElementById('brRegen').hidden = false;

  async function openBrief(force) {
    show('brief');
    // No topic/material yet → empty state, never invent content.
    if (!title || title === 'Your lesson') { renderBriefEmpty(); return; }
    if (brief && !force) { renderBrief(); return; }
    if (!force) {
      try { const c = JSON.parse(localStorage.getItem(BRIEF_KEY) || 'null'); if (validBrief(c)) { brief = c; renderBrief(); return; } } catch (e) {}
    }
    if (briefBusy) return;
    briefBusy = true;
    const prog = renderBriefLoading();
    const system = 'You are Noura, a study tutor writing a short pre-study brief. Reply with ONLY a valid JSON object, no markdown fences, no commentary. Schema: {"bigIdea": string (1-2 sentences), "keyConcepts": [string x3-6] (each under 20 words), "terms": [{"term": string, "definition": string (under 18 words)} x3-6], "example": string (one concrete example, mini scenario or analogy, 2-3 sentences), "mistakes": [string x2-4] (each a specific misunderstanding students have, under 22 words), "explainGoals": [string x2-4] (each starting with a verb, something the student must be able to say in their own words)}. Be concise and concrete - no filler, no repetition of the title.';
    const user = 'Write the StudyBrief for the topic: "' + title + '".' + (subject ? (' It is part of the subject "' + subject + '".') : '') + ' Depth: motivated high-school / intro-college student unless the title implies otherwise.';
    try {
      const r = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-sonnet-5', max_tokens: 2000, system: system, messages: [{ role: 'user', content: user }] })
      });
      const data = await r.json();
      if (!r.ok || data.error) throw new Error((data && data.error && (data.error.message || JSON.stringify(data.error))) || ('HTTP ' + r.status));
      const raw = Array.isArray(data.content) ? data.content.filter(b => b.type === 'text').map(b => b.text).join('').trim() : '';
      const a = raw.indexOf('{'), b = raw.lastIndexOf('}');
      if (a === -1 || b === -1) throw new Error('No JSON in response.');
      const parsed = JSON.parse(raw.slice(a, b + 1));
      if (!validBrief(parsed)) throw new Error('Brief incomplete.');
      prog.done();
      brief = parsed;
      try { localStorage.setItem(BRIEF_KEY, JSON.stringify(parsed)); } catch (e) {}
      renderBrief();
    } catch (err) {
      prog.stop();
