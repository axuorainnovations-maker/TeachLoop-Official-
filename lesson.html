<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noura — Lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<style>
  :root { --grad: linear-gradient(140deg,#c4b5fd 0%,#a855f7 38%,#7c3aed 72%,#6d28d9 100%); --purple:#8b5cf6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:#0A0A0B; color:#E8E8E6; font-family:'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; }
  button { font-family:'Plus Jakarta Sans','Inter',sans-serif; }

  .grad-logo { display:inline-block; background:var(--grad); -webkit-mask:url('logo.png?v=3') center/contain no-repeat; mask:url('logo.png?v=3') center/contain no-repeat; }
  .grad-text { background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

  /* Top bar */
  .topbar { position:fixed; top:0; left:0; right:0; height:58px; z-index:40; display:flex; align-items:center; gap:16px; padding:0 20px; background:rgba(10,10,11,0.85); backdrop-filter:blur(10px); border-bottom:1px solid #1a1a1d; }
  .brand { display:flex; align-items:center; gap:8px; text-decoration:none; flex-shrink:0; }
  .brand .grad-logo { width:20px; height:20px; }
  .brand span.word { font-size:16px; font-weight:800; letter-spacing:-.3px; }
  .crumb { display:flex; align-items:center; gap:8px; min-width:0; font-size:13.5px; color:#8a8a93; }
  .crumb a { color:#8a8a93; text-decoration:none; display:flex; align-items:center; gap:6px; }
  .crumb a:hover { color:#e4e4e5; }
  .crumb svg { width:14px; height:14px; flex-shrink:0; }
  .crumb .title { color:#d4d4d8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Left rail */
  .rail { position:fixed; top:58px; left:0; bottom:0; width:86px; z-index:30; display:flex; flex-direction:column; align-items:center; gap:6px; padding-top:26px; background:#0c0c0e; border-right:1px solid #1a1a1d; }
  .rail-item { width:70px; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:6px; border:none; background:transparent; border-radius:12px; color:#8a8a93; font-size:11.5px; font-weight:600; cursor:pointer; transition:background .15s,color .15s; }
  .rail-item svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .rail-item:hover { background:#161619; color:#d4d4d8; }
  .rail-item.active { background:#1c1c20; color:#fff; }
  .rail-item.soon { opacity:.55; }
  .rail-item.locked { opacity:.38; cursor:not-allowed; position:relative; }
  .rail-item.locked:hover { background:transparent; color:#8a8a93; }
  .rail-item .rail-lock { position:absolute; top:17px; left:calc(50% + 1px); width:11px; height:11px; stroke:#a855f7; fill:#0c0c0e; stroke-width:2.4; display:none; }
  .rail-item.locked .rail-lock { display:block; }
  .rail-item .rail-lock rect { fill:#0c0c0e; }

  .main { padding:58px 0 90px 86px; min-height:100%; }
  @media (max-width:720px) { .rail { display:none; } .main { padding-left:0; } }

  /* ── Loading view ── */
  .loadwrap { min-height:calc(100vh - 58px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 24px; }
  .load-logo { width:120px; height:120px; position:relative; margin-bottom:34px; }
  .load-logo .grad-logo { width:100%; height:100%; animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.06);opacity:.85;} }
  .load-kicker { font-size:13px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:#b79df5; margin-bottom:18px; }
  .load-title { font-size:clamp(30px,4.6vw,46px); font-weight:800; letter-spacing:-.02em; line-height:1.15; color:#fff; max-width:760px; }
  .load-progress {
    width:min(420px,74vw); height:10px; margin-top:0; border-radius:999px; background:#1c1c20; overflow:hidden;
    box-shadow:inset 0 2px 3px rgba(0,0,0,0.45), inset 0 -1px 2px rgba(255,255,255,0.05);
  }
  .load-progress i {
    display:block; position:relative; overflow:hidden; height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,#7c3aed 0%,#9d7bf5 35%,#c4b5fd 55%,#9d7bf5 78%,#7c3aed 100%);
    box-shadow:0 0 18px rgba(139,92,246,0.55), 0 0 32px rgba(196,181,253,0.35),
               inset 0 1.5px 0 rgba(255,255,255,0.45), inset 0 -2px 3px rgba(60,20,120,0.35);
  }
  /* Bright sheen gliding along the filled part */
  .load-progress i::after {
    content:''; position:absolute; top:0; bottom:0; left:0; width:50%; border-radius:999px;
    background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
    mix-blend-mode:screen; animation:fluxSheen 1.6s linear infinite;
  }
  /* Animated thinking orb rendered on a canvas, centred above the bar */
  @keyframes fluxSheen { from { transform:translateX(-110%); } to { transform:translateX(210%); } }
  @media (prefers-reduced-motion: reduce) { .load-progress i::after { animation:none; opacity:0; } }
  .load-status { margin-top:0; font-size:22px; letter-spacing:-.01em; color:#8a8a93; }
  .load-pct { margin-left:8px; color:#c9b6ef; font-weight:600; }
  .load-status .dots::after { content:''; animation:dots 1.4s steps(4,end) infinite; }
  @keyframes dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} }
  .load-error { margin-top:22px; font-size:14.5px; color:#f0a5a5; max-width:520px; line-height:1.5; }
  .retry-btn { margin-top:16px; padding:11px 26px; border:none; border-radius:999px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:14.5px; font-weight:600; cursor:pointer; }
  .retry-btn:hover { filter:brightness(1.08); }

  /* ── Overview (contents) view ── */
  .overview { display:none; max-width:880px; margin:0 auto; padding:56px 28px 40px; }
  .ov-hero { display:flex; align-items:center; gap:34px; margin-bottom:40px; }
  /* Study Brief now leads with the logo hero, so its head aligns to the top and
     the hero owns the bottom spacing. */
  .br-head.hero-head { align-items:center; justify-content:center; margin-bottom:0; }
  /* flex:0 1 auto so a short title hugs the logo and the pair sits centred,
     rather than the hero stretching to fill the row. */
  .br-head.hero-head .ov-hero { margin-bottom:26px; justify-content:center; flex:0 1 auto;
    max-width:760px; width:100%; }
  .br-head.hero-head .br-regen { margin-top:6px; }
  /* Learn now leads with the small purple kicker instead of the hero. */
  .ov-head { margin-bottom:34px; }
  .ov-logo { width:150px; height:150px; flex-shrink:0; position:relative; }
  .ov-logo .grad-logo { width:100%; height:100%; }
  .ov-title { font-size:clamp(30px,4vw,44px); font-weight:800; letter-spacing:-.02em; line-height:1.15; color:#fff; }
  .ov-start-row { display:flex; align-items:center; gap:26px; margin-bottom:52px; flex-wrap:wrap; }
  .start-btn { padding:16px 44px; border:none; border-radius:16px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 10px 26px rgba(123,92,250,0.3), inset 0 1px 0 rgba(255,255,255,0.18); transition:filter .15s, transform .1s; }
  .start-btn:hover { filter:brightness(1.07); }
  .start-btn:active { transform:scale(.99); }
  .upnext .k { font-size:11.5px; font-weight:700; letter-spacing:.14em; color:#8a8a93; text-transform:uppercase; }
  .upnext .v { margin-top:3px; font-size:16.5px; font-weight:600; color:#fff; }
  .contents-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; }
  .contents-head h2 { font-size:26px; font-weight:800; letter-spacing:-.02em; color:#fff; }
  .contents-head .prog { font-size:14px; color:#9a9aa2; }
  .timeline { position:relative; }
  .timeline::before { content:''; position:absolute; left:25px; top:var(--tl-top, 14px); height:var(--tl-track, 0px); width:2px; background:#232327; }
  /* Neon progress line that grows through the completed steps */
  .timeline::after {
    content:''; position:absolute; left:25px; top:var(--tl-top, 14px); width:2px; border-radius:2px;
    height:var(--tl-fill, 0px);
    background:linear-gradient(180deg,#c4b5fd 0%,#a78bfa 45%,#7c3aed 100%);
    box-shadow:0 0 8px rgba(139,92,246,0.75), 0 0 18px rgba(139,92,246,0.35);
    transition:height .45s ease;
  }
  .tl-dot, .tl-card { position:relative; z-index:1; }
  .tl-row.done .tl-dot { box-shadow:none; }
  .tl-row { position:relative; display:flex; align-items:center; gap:26px; padding:15px 0; }
  .tl-dot { position:relative; z-index:1; width:52px; height:52px; flex-shrink:0; border-radius:50%; background:#141416; border:2px solid #2a2a2e; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:#9a9aa2; }
  .tl-row.current .tl-dot { border-color:#8b5cf6; background:#221a38; color:#fff; }
  .tl-row.done .tl-dot { background:#8b5cf6; border-color:#8b5cf6; color:#fff; }
  .tl-dot svg { width:20px; height:20px; }
  .tl-title { font-size:17px; font-weight:600; color:#e8e8e6; }
  .tl-row.locked .tl-title { color:#6f6f76; }
  .tl-meta { margin-left:auto; display:flex; align-items:center; gap:12px; font-size:14px; color:#8a8a93; }
  .tl-meta svg { width:15px; height:15px; stroke:#6f6f76; fill:none; stroke-width:1.8; }
  .tl-start { padding:11px 30px; border:none; border-radius:12px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(123,92,250,0.28); }
  .tl-start:hover { filter:brightness(1.07); }
  .tl-scorepill { padding:5px 12px; border-radius:999px; font-size:13px; font-weight:700; border:1px solid; }
  .tl-scorepill.perfect { color:#3fb950; border-color:rgba(63,185,80,0.45); background:rgba(63,185,80,0.10); }
  .tl-scorepill.good { color:#c9b6ef; border-color:rgba(139,92,246,0.45); background:rgba(139,92,246,0.12); }
  .tl-scorepill.low { color:#f0a500; border-color:rgba(233,118,4,0.45); background:rgba(233,118,4,0.10); }
  .tl-scorepill.done-pill { color:#9a9aa2; border-color:#2e2e34; background:transparent; font-weight:600; }
  .tl-review { padding:9px 20px; border:1px solid #2e2e34; border-radius:11px; background:transparent; color:#c7c7cc; font-size:13.5px; font-weight:600; cursor:pointer; }
  .tl-review:hover { background:#1c1c20; color:#fff; }
  .tl-card { position:relative; z-index:1; margin-left:0; padding:16px 22px; flex:1; display:flex; align-items:center; gap:20px; background:#161618; border:1px solid #2a2a2e; border-radius:18px; }
  .tl-card .tl-sub { font-size:13.5px; color:#8a8a93; margin-top:3px; }

  /* ── Study Brief ── */
  .brief { display:none; max-width:880px; margin:0 auto; padding:48px 28px 40px; }
  /* ── Study Brief document layout (mirrors the note page) ──── */
  .br-doc { max-width:760px; margin:0 auto; font-size:16px; line-height:1.75; color:#D4D4D4; letter-spacing:-.003em; }
  .br-doc .br-sub { color:#6B6B6B; font-size:14px; letter-spacing:-.01em; margin:-14px 0 30px; }
  .br-doc h2 { font-size:24px; font-weight:700; color:#fff; letter-spacing:-.015em; margin:34px 0 10px; line-height:1.3; }
  .br-doc p { margin:0 0 10px; }
  .br-doc ul { list-style:none; margin:0 0 12px; padding:0; }
  .br-doc li { position:relative; padding-left:26px; margin:0 0 7px; }
  .br-doc li::before { content:''; position:absolute; left:9px; top:11px; width:5px; height:5px; border-radius:50%; background:#8b5cf6; }
  .br-doc b, .br-doc strong { color:#fff; font-weight:600; }
  .br-doc .br-callout {
    display:flex; gap:12px; padding:16px 18px; margin:0 0 8px; border-radius:10px;
    background:rgba(139,92,246,0.10); border:1px solid rgba(139,92,246,0.24); color:#e7e2f7;
  }
  .br-doc .br-callout .ico { flex-shrink:0; font-size:17px; line-height:1.5; }
  .br-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:26px; }
  .br-kicker { font-size:11.5px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:#b79df5; margin-bottom:8px; }
  .br-title { font-size:clamp(24px,3.2vw,34px); font-weight:800; letter-spacing:-.02em; line-height:1.2; color:#fff; }
  .br-regen { flex-shrink:0; padding:9px 18px; border:1px solid #2e2e34; border-radius:11px; background:transparent; color:#c7c7cc; font-size:13.5px; font-weight:600; cursor:pointer; }
  .br-regen:hover { background:#1c1c20; color:#fff; }
  .br-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .br-card { background:#161618; border:1px solid #2a2a2e; border-radius:16px; padding:18px 20px; }
  .br-card.full { grid-column:1 / -1; }
  .br-card.big { background:linear-gradient(150deg, rgba(139,92,246,0.13) 0%, #161618 58%); border-color:rgba(139,92,246,0.32); }
  .br-ct { display:flex; align-items:center; gap:9px; font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#8a8a93; margin-bottom:12px; }
  .br-ct svg { width:15px; height:15px; stroke:#a78bfa; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .br-big-text { font-size:17px; line-height:1.6; color:#e8e8e6; font-weight:500; }
  .br-list { list-style:none; display:flex; flex-direction:column; gap:10px; }
  .br-list li { display:flex; gap:11px; font-size:14.8px; line-height:1.55; color:#cfcfcd; }
  .br-list li::before { content:''; flex-shrink:0; width:6px; height:6px; margin-top:8px; border-radius:50%; background:#8b5cf6; }
  .br-list.warn li::before { background:#f0a500; }
  .br-list.goal { counter-reset:g; }
  .br-list.goal li::before { content:counter(g); counter-increment:g; width:20px; height:20px; margin-top:1px; border-radius:6px; background:rgba(139,92,246,0.18); color:#c9b6ef; font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .br-terms { display:flex; flex-direction:column; gap:11px; }
  .br-term { font-size:14.8px; line-height:1.55; color:#a9a9b0; }
  .br-term b { color:#fff; font-weight:700; }
  .br-example { font-size:15px; line-height:1.65; color:#cfc6ea; }
  .br-cta { margin-top:22px; display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; background:#161618; border:1px solid rgba(139,92,246,0.32); border-radius:16px; padding:18px 22px; }
  .br-cta-txt { font-size:16px; font-weight:700; color:#fff; }
  .br-cta-btn { padding:12px 26px; border:none; border-radius:12px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:14.5px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(123,92,250,0.28); text-decoration:none; display:inline-block; }
  .br-cta-btn:hover { filter:brightness(1.07); }
  .br-empty { text-align:center; padding:70px 20px; }
  .br-empty .grad-logo { width:64px; height:64px; opacity:.85; }
  .br-empty p { margin-top:20px; font-size:16px; color:#8a8a93; }
  .br-loading { display:flex; align-items:center; justify-content:center; gap:11px; padding:70px 20px; font-size:15px; color:#8a8a93; }
  .br-loading .grad-logo { width:26px; height:26px; animation:pulse 2.6s ease-in-out infinite; }
  @media (max-width:760px) { .br-grid { grid-template-columns:1fr; } }

  /* Single "next step" button that guides the tab flow */
  .flow-foot { margin-top:22px; }
  .flow-btn { width:100%; padding:15px; border:none; border-radius:14px; background:linear-gradient(140deg,#a78bfa 0%,#8b5cf6 45%,#7c3aed 100%); color:#fff; font-size:15.5px; font-weight:700; cursor:pointer; box-shadow:0 8px 22px rgba(123,92,250,0.28); transition:filter .15s; }
  .flow-btn:hover { filter:brightness(1.07); }

  /* Animated shimmer for loading labels — a highlight sweeps across the text. */
  .shimmer-text {
    display:inline-block; white-space:pre;
    /* Tiled so the gradient always covers every letter — the text stays put and
       only the bright band travels across it. */
    background-image:linear-gradient(90deg,#6e6e78 0%,#6e6e78 42%,#ffffff 50%,#6e6e78 58%,#6e6e78 100%);
    background-size:200% 100%;
    background-repeat:repeat-x;
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    animation:textShimmer 2.4s linear infinite;
  }
  @keyframes textShimmer {
    from { background-position:200% center; }
    to   { background-position:0% center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .shimmer-text { animation:none; color:#a1a1aa; -webkit-text-fill-color:#a1a1aa; }
  }

  /* Loading screens show only the status text and the progress bar. */
  .loadwrap .load-logo, .loadwrap .load-kicker, .loadwrap .load-title,
  .tab-load .grad-logo { display:none !important; }
  .loadwrap .load-status { order:1; margin:0 0 20px; }
  .loadwrap .load-progress { order:2; }
  /* While loading, pin the block to the content area so text + bar sit dead
     centre of the page regardless of each tab's own padding. */
  .is-loading .tab-load, .loadwrap {
    position:fixed; top:58px; left:86px; right:0; bottom:0;
    /* bottom padding offsets the 58px top bar, so the block reads as centred
       on the page rather than 29px low within the content area */
    min-height:0; padding:0 20px 58px; margin:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  @media (max-width:720px) { .is-loading .tab-load, .loadwrap { left:0; } }
  .tab-load .load-progress { margin-top:0; }
  .is-loading .br-head { display:none !important; }
  .tab-load .tab-load-txt { order:1; margin:0 0 20px; }
  .tab-load .load-progress { order:2; }

  /* Shared loading block for the side tabs (same bar as the Learn tab) */
  .tab-load { display:flex; flex-direction:column; align-items:center; padding:64px 20px; }
  .tab-load .grad-logo { width:46px; height:46px; animation:pulse 2.6s ease-in-out infinite; }
  .tab-load-txt { margin-top:0; font-size:22px; letter-spacing:-.01em; color:#8a8a93; }
  .tab-load .load-progress { margin-top:18px; }

  /* ── Recall (active recall practice) ── */
  .recall { display:none; max-width:760px; margin:0 auto; padding:48px 28px 40px; }
  .rc-meta { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:14px; }
  .rc-count { font-size:13.5px; font-weight:600; color:#8a8a93; }
  .rc-tally { display:flex; gap:8px; }
  .rc-tally span { font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; border:1px solid; }
  .rc-tally .g { color:#3fb950; border-color:rgba(63,185,80,0.40); background:rgba(63,185,80,0.10); }
  .rc-tally .a { color:#f0a500; border-color:rgba(233,118,4,0.40); background:rgba(233,118,4,0.10); }
  .rc-tally .f { color:#f0857f; border-color:rgba(248,81,73,0.35); background:rgba(248,81,73,0.09); }
  .rc-bar { height:5px; border-radius:99px; background:#1e1e22; overflow:hidden; margin-bottom:22px; }
  .rc-bar i { display:block; height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#a78bfa,#7c3aed); transition:width .3s ease; }
  .rc-card { background:#161618; border:1px solid #2a2a2e; border-radius:18px; padding:24px; }
  .rc-type { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#c9b6ef; background:rgba(139,92,246,0.14); border:1px solid rgba(139,92,246,0.30); padding:5px 11px; border-radius:999px; margin-bottom:16px; }
  .rc-prompt { font-size:20px; font-weight:700; line-height:1.4; color:#fff; letter-spacing:-.01em; margin-bottom:18px; }
  .rc-label { font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#8a8a93; margin-bottom:8px; }

  /* ── Audio Recap (audio-style recap) ── */
  .studycast { display:none; max-width:780px; margin:0 auto; padding:48px 28px 40px; }
  /* ── Audio Recap player (podcast-style) ────────────────────── */
  /* The recap title already appears inside the player card, so the page-level
     kicker and heading are redundant here — keep only the Regenerate action. */
  #castView .br-kicker, #castView .br-title { display:none; }
  #castView .br-head { margin-bottom:0; justify-content:flex-end; }
  #castView { padding-top:24px; }

  .pc-wrap { max-width:760px; margin:0 auto; padding-bottom:120px; }

  .pc-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .pc-title { font-size:17px; font-weight:600; line-height:22px; letter-spacing:-.2px; color:#fff; }
  .pc-time { margin-top:4px; font-size:14px; line-height:20px; color:#8A8A8A; font-variant-numeric:tabular-nums; }
  .pc-seek { position:relative; margin-top:18px; height:16px; cursor:pointer; touch-action:manipulation; }
  .pc-seek-bg { position:absolute; top:50%; height:4px; width:100%; transform:translateY(-50%); border-radius:99px; background:#2A2A2A; }
  .pc-seek-fill { position:absolute; top:50%; height:4px; transform:translateY(-50%); border-radius:99px; background:#fff; width:0%; }
  .pc-knob { position:absolute; top:50%; height:12px; width:12px; transform:translateY(-50%); border-radius:50%; background:#fff; box-shadow:0 0 0 3px #171717; left:-6px; }
  .pc-ctrls { margin-top:20px; height:48px; display:flex; align-items:center; justify-content:space-between; }
  .pc-left { display:flex; align-items:center; gap:16px; }

    box-shadow:0 6px 18px rgba(124,58,237,0.34); transition:transform .15s, filter .15s; }

  .pc-right { display:flex; align-items:center; gap:18px; }
  .pc-speed { display:inline-flex; height:40px; align-items:center; gap:5px; padding:0 14px; border-radius:99px;
    background:#1E1E1E; border:1px solid #252525; color:#8A8A8A; cursor:pointer;
    font-family:'Plus Jakarta Sans','Inter',sans-serif; font-size:14px; font-weight:600; letter-spacing:-.1px;
    transition:color .15s, border-color .15s; }
  .pc-speed:hover { color:#E0E0E0; border-color:#2F2F2F; }

  .pc-pill { margin-top:14px; display:inline-flex; height:28px; align-items:center; gap:6px; border-radius:99px; border:1px solid #252525; background:#1E1E1E; padding:0 12px; }

  .pc-ask-wrap { position:fixed; bottom:0; left:86px; right:0; z-index:20; background:#0d0d0f; }

  .pc-ask input { height:100%; flex:1; min-width:0; background:transparent; border:none; outline:none; font-family:'Plus Jakarta Sans','Inter',sans-serif; font-size:16px; letter-spacing:-.1px; color:#fff; }

  .sc-player { background:linear-gradient(150deg, rgba(139,92,246,0.16) 0%, #161618 62%); border:1px solid rgba(139,92,246,0.34); border-radius:18px; padding:20px 22px; }
  .sc-player-top { display:flex; align-items:center; gap:16px; }

  .sc-play svg { width:22px; height:22px; fill:currentColor; }

  /* Checkpoint quiz */
  /* ── Quiz / Checkpoint layout (raised-key option cards) ────── */

  /* The browser's default focus ring rendered white/blue outside the card.
     Keep keyboard focus visible, but in the same purple outline. */

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const title = (params.get('title') || 'Your lesson').trim();
  const subject = (params.get('subject') || '').trim();
  const slug = title.toLowerCase();
  const DATA_KEY = 'NOURA_LESSON_V2_' + slug;
  const STATE_KEY = 'NOURA_LESSON_STATE_' + slug;

  document.title = 'Noura — ' + title;
  document.getElementById('crumbTitle').textContent = title;
  document.getElementById('loadTitle').textContent = title;
  document.getElementById('ovTitle').textContent = title;

  // Opening a lesson counts as studying → keep the streak alive.
  try {
    const d = new Date();
    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const arr = JSON.parse(localStorage.getItem('TEACHLOOP_ACTIVE_DAYS') || '[]');
    if (Array.isArray(arr) && arr.indexOf(ds) === -1) { arr.push(ds); localStorage.setItem('TEACHLOOP_ACTIVE_DAYS', JSON.stringify(arr)); }
  } catch (e) {}

  // Toast + coming-soon rail
  const toast = document.getElementById('toast');
  let toastT = null;
  function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('show'), 2200); }
  document.querySelectorAll('.rail-item.soon').forEach(b => b.addEventListener('click', () => showToast(b.dataset.soon + ' — coming soon')));

  const loadView = document.getElementById('loadView');
  const overview = document.getElementById('overview');
  const player = document.getElementById('player');
  const loadStatus = document.getElementById('loadStatus');
  const loadError = document.getElementById('loadError');
  const retryBtn = document.getElementById('retryBtn');

  let lesson = null;   // { title, overview, items:[{type:'checkpoint'|'section', title, questions|pages}] }
  let state = { done: [], scores: {} };
  try { const st = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); if (st && Array.isArray(st.done)) state = st; } catch (e) {}
  function saveState() { try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {} }
  const isDone = i => state.done.indexOf(i) !== -1;
  function markDone(i) { if (!isDone(i)) { state.done.push(i); saveState(); } }
  function firstIncomplete() { for (let i = 0; i < lesson.items.length; i++) if (!isDone(i)) return i; return -1; }
  function isLocked(i) { for (let j = 0; j < i; j++) if (!isDone(j)) return true; return false; }
  function totalScore() { let n = 0; for (const k in state.scores) n += state.scores[k]; return n; }

  function md(text) {
    const html = marked.parse(String(text || ''), { gfm: true, breaks: false });
    return html;
  }
  // ── Plain-language maths ────────────────────────────────────
  // The models sometimes reply with LaTeX ($F(x)=\int_{-\infty}^{x} f(t)dt$),
  // which is unreadable to a learner if it is not typeset. We ask for plain
  // wording in every prompt, and run this over all generated text so anything
  // already cached — or any slip — still reads as ordinary words and numbers.
  const GREEK = {
    alpha:'alpha', beta:'beta', gamma:'gamma', delta:'delta', epsilon:'epsilon',
    theta:'theta', lambda:'lambda', mu:'mu', pi:'pi', rho:'rho', sigma:'sigma',
    tau:'tau', phi:'phi', omega:'omega', Delta:'Delta', Sigma:'Sigma', Omega:'Omega'
  };
  function plainMath(str) {
    if (typeof str !== 'string' || str.indexOf('\\') === -1 && str.indexOf('$') === -1) return str;
    let t = str;

    // Drop the math delimiters themselves.
    t = t.replace(/\$\$([\s\S]*?)\$\$/g, ' $1 ').replace(/\$([^$\n]*?)\$/g, '$1');

    // Integrals, sums, limits → spoken form.
    t = t.replace(/\\int\s*_\{?([^{}\s]*)\}?\s*\^\s*\{?([^{}\s]*)\}?/g,
      (m, a, b) => 'the integral from ' + a + ' to ' + b + ' of');
    t = t.replace(/\\int/g, 'the integral of');
    t = t.replace(/\\sum\s*_\{?([^{}]*)\}?\s*\^\s*\{?([^{}]*)\}?/g,
      (m, a, b) => 'the sum from ' + a + ' to ' + b + ' of');
    t = t.replace(/\\sum/g, 'the sum of');
    t = t.replace(/\\lim\s*_\{?([^{}]*?)\\to([^{}]*?)\}?(?=\s|$)/g,
      (m, v, a) => 'the limit as ' + v.trim() + ' approaches ' + a.trim() + ' of');
    t = t.replace(/\\lim/g, 'the limit of');
    t = t.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '($1)/($2)');
    t = t.replace(/\\sqrt\s*\{([^{}]*)\}/g, 'the square root of ($1)');

    // Symbols → words the learner already knows.
    t = t.replace(/\\infty/g, 'infinity')
         .replace(/\\times/g, ' times ').replace(/\\cdot/g, ' times ')
         .replace(/\\div/g, ' divided by ')
         .replace(/\\pm/g, ' plus or minus ')
         .replace(/\\leq|\\le\b/g, ' <= ').replace(/\\geq|\\ge\b/g, ' >= ')
         .replace(/\\neq|\\ne\b/g, ' is not equal to ')
         .replace(/\\approx/g, ' is about ')
         .replace(/\\to|\\rightarrow/g, ' to ')
         .replace(/\\in\b/g, ' in ')
         .replace(/\\prime/g, "'");
    t = t.replace(/\\(alpha|beta|gamma|delta|epsilon|theta|lambda|mu|pi|rho|sigma|tau|phi|omega|Delta|Sigma|Omega)\b/g,
      (m, g) => GREEK[g] || g);

    // Structural noise.
    t = t.replace(/\\left|\\right/g, '')
         .replace(/\\!|\\,|\;|\\:/g, ' ')
         .replace(/\\text\s*\{([^{}]*)\}/g, '$1')
         .replace(/\\mathrm\s*\{([^{}]*)\}/g, '$1')
         .replace(/\\begin\{[^}]*\}|\\end\{[^}]*\}/g, ' ');

    // Superscripts / subscripts in a form people read normally.
    t = t.replace(/\^\s*\{([^{}]*)\}/g, '^$1').replace(/_\s*\{([^{}]*)\}/g, '_$1');
    t = t.replace(/\^2\b/g, ' squared').replace(/\^3\b/g, ' cubed');

    // Anything left over, plus tidy spacing.
    t = t.replace(/\\[a-zA-Z]+/g, '').replace(/[{}]/g, '');

  // Time-based progress bar shared by the side tabs. Eases toward 92%
  // while the request is in flight, then snaps to 100% on completion.
  // ── Streaming chat ──────────────────────────────────────────
  // Streams the model's reply over SSE so the loader can follow real
  // generation progress instead of guessing from a timer. `onText` is called
  // with the running output length after every delta.
  async function streamChat(payload, onText) {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({}, payload, { stream: true }))
    });
    if (!r.ok) {
      let msg = 'HTTP ' + r.status;
      try { const j = await r.json(); if (j && j.error) msg = j.error.message || msg; } catch (e) {}
      throw new Error(msg);
    }
    // No streaming body available (very old browser) — fall back to one shot.
    if (!r.body || !r.body.getReader) {
      const data = await r.json();
      if (data.error) throw new Error(data.error.message || 'API error');
      return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '', apiErr = null;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (line.slice(0, 5) !== 'data:') continue;
        const raw = line.slice(5).trim();
        if (!raw) continue;
        let ev; try { ev = JSON.parse(raw); } catch (e) { continue; }
        if (ev.type === 'content_block_delta' && ev.delta && typeof ev.delta.text === 'string') {
          text += ev.delta.text;
          if (onText) onText(text.length);
        } else if (ev.type === 'error' && ev.error) {
          apiErr = ev.error.message || 'stream error';
        }
      }
    }
    if (apiErr) throw new Error(apiErr);
    if (!text) throw new Error('Empty response.');
    return text;
  }


  // Sets the shimmer text and scales the highlight to the label length,
  // mirroring the reference component's dynamic spread.
  function applyShimmer(el, text) {
    if (!el) return;
    el.textContent = text;
    el.classList.add('shimmer-text');
  }

  // Loader whose bar is driven by real generation progress. `expectChars` is
  // the rough output size we asked the model for; `report(n)` feeds it the
  // characters received so far. A slow time-based creep runs underneath so the
  // bar still moves during the initial wait before the first token lands.
  function tabLoading(host, label, expectChars, calKey) {
    const view = host.parentElement;
    if (view) view.classList.add('is-loading');
    host.innerHTML = '<div class="tab-load"><span class="grad-logo"></span>' +
      '<div class="tab-load-txt"><span class="lbl shimmer-text"></span></div>' +
      '<div class="load-progress"><i></i></div></div>';
    applyShimmer(host.querySelector('.lbl'), label);
    const fill = host.querySelector('.load-progress i');
    return driveBar(fill, view, expectChars, calKey);
  }

  // Shared bar driver: eases the painted width toward the real target every
  // frame, so the bar glides instead of stepping.
  // Remembers how many characters each generator actually produced last time,
  // so the bar's denominator converges on reality instead of staying a guess.
  function calChars(key, fallback) {
    try {
      const v = parseFloat(localStorage.getItem('NOURA_CAL_' + key) || '');
      if (isFinite(v) && v > 200) return v;
    } catch (e) {}
    return fallback;
  }
  function learnChars(key, actual) {
    if (!key || !(actual > 200)) return;
    try {
      const prev = parseFloat(localStorage.getItem('NOURA_CAL_' + key) || '') || actual;
      localStorage.setItem('NOURA_CAL_' + key, String(Math.round(prev * 0.6 + actual * 0.4)));
    } catch (e) {}
  }

  function driveBar(fill, view, expectChars, calKey) {
    const started = Date.now();
    let shown = 0, chars = 0, finishing = false, ended = false;
    let raf = 0, timer = 0, last = Date.now();
    if (calKey) expectChars = calChars(calKey, expectChars);

    function computeTarget() {
      if (finishing) return 100;
      // Real progress once tokens arrive; capped so it never claims to be done.
      const real = expectChars > 0 ? Math.min(0.97, chars / expectChars) : 0;
      // Pre-token creep: eases to ~18% during the wait before the first token.
      const creep = 0.18 * (1 - Math.exp(-(Date.now() - started) / 2600));
      return Math.max(real, creep) * 100;
    }

    // Time-based easing, so the motion is identical whether it is driven at
    // 120fps or by the fallback timer in a throttled background tab.
    function step() {
      if (ended) return;
      const now = Date.now();
      const dt = Math.min(250, now - last);
      last = now;
      const target = computeTarget();
      shown += (target - shown) * (1 - Math.exp(-dt / 170));
      if (target - shown < 0.15) shown = target;
      fill.style.width = shown.toFixed(2) + '%';
      if (finishing && shown >= 99.9) { fill.style.width = '100%'; halt(); }
    }

    function frame() { step(); if (!ended) raf = requestAnimationFrame(frame); }
    function halt() { ended = true; cancelAnimationFrame(raf); clearInterval(timer); }

    raf = requestAnimationFrame(frame);
    timer = setInterval(step, 60);   // keeps moving when rAF is throttled

    const clearFlag = function () { if (view) view.classList.remove('is-loading'); };
    return {
      // Called from the stream as text arrives.
      report: function (n) { chars = n; },
      done: function () { finishing = true; learnChars(calKey, chars); clearFlag(); },
      stop: function () { halt(); clearFlag(); }
    };
  }

  // ── Study Brief ─────────────────────────────────────────────
  // A focused pre-study brief for the current lesson topic. Six fixed

  const BRIEF_KEY = 'NOURA_BRIEF_' + slug;
  let brief = null, briefBusy = false;
  const brBody = document.getElementById('brBody');
  document.getElementById('brTitle').textContent = title;

  const ICON = {

  function validBrief(b) {

      Array.isArray(b.terms) && b.terms.length &&

  function card(cls, iconKey, label, inner) {

  // Document layout, matching the note page: one flowing column of headings

        '<h2>Simple example</h2><p>' + esc(brief.example) + '</p>' +

  async function openBrief(force) {
    show('brief');

    if (!title || title === 'Your lesson') { renderBriefEmpty(); return; }
    if (brief && !force) { renderBrief(); return; }

    }
    if (briefBusy) return;

    const prog = renderBriefLoading();
    const system = 'You are Noura, a study tutor writing a short pre-study brief. Reply with ONLY a valid JSON object, no markdown fences, no commentary. Schema: {"bigIdea": string (1-2 sentences), "keyConcepts": [string x3-6] (each under 20 words), "terms": [{"term": string, "definition": string (under 18 words)} x3-6], "example": string (one concrete example, mini scenario or analogy, 2-3 sentences), "mistakes": [string x2-4] (each a specific misunderstanding students have, under 22 words), "explainGoals": [string x2-4] (each starting with a verb, something the student must be able to say in their own words)}. Be concise and concrete - no filler, no repetition of the title. MATHS MUST BE PLAIN READABLE TEXT: never use LaTeX, never use dollar signs, backslash commands, \\frac, \\int, \\infty, ^{} or _{}. Write maths with ordinary letters, numbers and symbols the way a person types it in a message - for example "F(x) = the integral from negative infinity to x of f(t) dt", "x squared", "3/4", "the square root of 2", "pi", "<=". Spell out symbol names in words.';

      const a = raw.indexOf('{'), b = raw.lastIndexOf('}');
      if (a === -1 || b === -1) throw new Error('No JSON in response.');

  document.getElementById('brRegen').addEventListener('click', () => openBrief(true));

  // ── Recall ──────────────────────────────────────────────────
  // Active recall practice: answer from memory → reveal → explain why →
  // rate confidence. One card at a time; progress driven by confidence.
  const RECALL_KEY = 'NOURA_RECALL_' + slug;
  const RECALL_STATE_KEY = 'NOURA_RECALL_STATE_' + slug;
  const RC_TYPES = { define: 'Define', explain: 'Explain', compare: 'Compare', example: 'Example', mistake: 'Mistake check' };
  let recall = null, recallBusy = false, rcIndex = 0;
  let rcState = { conf: {}, answers: {}, why: {} };
  try { const st = JSON.parse(localStorage.getItem(RECALL_STATE_KEY) || 'null'); if (st && st.conf) rcState = st; } catch (e) {}
  function saveRcState() { try { localStorage.setItem(RECALL_STATE_KEY, JSON.stringify(rcState)); } catch (e) {} }
  const rcBody = document.getElementById('rcBody');
  document.getElementById('rcTitle').textContent = title;

  function validRecall(r) {
    return Array.isArray(r) && r.length && r.every(c => c && c.prompt && c.answer && RC_TYPES[c.type]);
  }
  function rcTally() {
    let got = 0, almost = 0, forgot = 0;
    for (const k in rcState.conf) {
      const v = rcState.conf[k];
      if (v === 'got') got++; else if (v === 'almost') almost++; else if (v === 'forgot') forgot++;
    }
    return { got: got, almost: almost, forgot: forgot, rated: got + almost + forgot };
  }

  function renderRecallEmpty() {
    rcBody.innerHTML = '<div class="br-empty"><span class="grad-logo"></span><p>Add a topic or material to generate Recall cards.</p></div>';
    document.getElementById('rcRegen').hidden = true;
  }
  function renderRecallLoading() {
    document.getElementById('rcRegen').hidden = true;
    return tabLoading(rcBody, 'Building your Recall cards… ', 3200, 'recall');
  }
  function renderRecallError(msg) {
    rcBody.innerHTML = '<div class="br-empty"><span class="grad-logo"></span><p>' + esc(msg) + '</p></div>';
    document.getElementById('rcRegen').hidden = false;
  }

  function renderRecallCard() {
    document.getElementById('rcRegen').hidden = false;
    const total = recall.length;
    if (rcIndex >= total) { renderRecallDone(); return; }
    const card = recall[rcIndex];
    const t = rcTally();
    const conf = rcState.conf[rcIndex] || '';
    let revealed = !!conf || !!rcState.why[rcIndex];

    rcBody.innerHTML =
      '<div class="rc-meta">' +
        '<div class="rc-count">Card ' + (rcIndex + 1) + ' of ' + total + '</div>' +
        '<div class="rc-tally"><span class="g">Got it ' + t.got + '</span><span class="a">Almost ' + t.almost + '</span><span class="f">Forgot ' + t.forgot + '</span></div>' +
      '</div>' +
      '<div class="rc-bar"><i style="width:' + Math.round((t.rated / total) * 100) + '%"></i></div>' +
      '<div class="rc-card">' +
        '<div class="rc-type">' + esc(RC_TYPES[card.type]) + '</div>' +
        '<div class="rc-prompt"></div>' +
        '<div class="rc-label">Your answer — from memory</div>' +
        '<textarea class="rc-input" id="rcAnswer" placeholder="Write what you remember, then reveal…" spellcheck="false"></textarea>' +
        '<button class="rc-reveal" id="rcRevealBtn" type="button">Reveal answer</button>' +
        '<div class="rc-answer" id="rcAnswerBlock" hidden>' +
          '<div class="rc-label">Ideal answer</div>' +
          '<div class="rc-ideal"></div>' +
          '<div class="rc-why">' +
            '<div class="rc-label">Explain why — in your own words</div>' +
            '<textarea class="rc-input" id="rcWhy" placeholder="Why is this the answer? What is the reasoning?" spellcheck="false"></textarea>' +
          '</div>' +
          '<div class="rc-conf">' +
            '<div class="rc-label">How well did you know it?</div>' +
            '<div class="rc-conf-btns">' +
              '<button class="rc-conf-btn got" type="button" data-c="got">Got it</button>' +
              '<button class="rc-conf-btn almost" type="button" data-c="almost">Almost</button>' +
              '<button class="rc-conf-btn forgot" type="button" data-c="forgot">Forgot</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="rc-nav">' +
        '<button class="rc-prev" id="rcPrev" type="button">Previous</button>' +
        '<button class="rc-next" id="rcNext" type="button">' + (rcIndex === total - 1 ? 'Finish' : 'Next card') + '</button>' +
      '</div>';

    rcBody.querySelector('.rc-prompt').textContent = card.prompt;
    rcBody.querySelector('.rc-ideal').textContent = card.answer;

    const answerEl = document.getElementById('rcAnswer');
    const whyEl = document.getElementById('rcWhy');
    const block = document.getElementById('rcAnswerBlock');
    const revealBtn = document.getElementById('rcRevealBtn');
    const nextBtn = document.getElementById('rcNext');
    const prevBtn = document.getElementById('rcPrev');

    answerEl.value = rcState.answers[rcIndex] || '';
    whyEl.value = rcState.why[rcIndex] || '';
    answerEl.addEventListener('input', () => { rcState.answers[rcIndex] = answerEl.value; saveRcState(); });
    whyEl.addEventListener('input', () => { rcState.why[rcIndex] = whyEl.value; saveRcState(); });

    function applyConf(c) {
      rcBody.querySelectorAll('.rc-conf-btn').forEach(b => b.classList.toggle('on', b.dataset.c === c));
      nextBtn.disabled = !c;
    }
    rcBody.querySelectorAll('.rc-conf-btn').forEach(b => b.addEventListener('click', () => {
      rcState.conf[rcIndex] = b.dataset.c; saveRcState();
      applyConf(b.dataset.c);
      const t2 = rcTally();
      rcBody.querySelector('.rc-tally').innerHTML = '<span class="g">Got it ' + t2.got + '</span><span class="a">Almost ' + t2.almost + '</span><span class="f">Forgot ' + t2.forgot + '</span>';
      rcBody.querySelector('.rc-bar i').style.width = Math.round((t2.rated / total) * 100) + '%';
    }));

    function doReveal() {
      revealed = true;
      block.hidden = false;
      revealBtn.hidden = true;
      answerEl.readOnly = true;
    }
    revealBtn.addEventListener('click', doReveal);
    if (revealed) doReveal();

    // The answer stays hidden until revealed, and Next unlocks once rated.
    applyConf(conf);
    prevBtn.disabled = rcIndex === 0;
    prevBtn.addEventListener('click', () => { rcIndex--; renderRecallCard(); });
    nextBtn.addEventListener('click', () => { rcIndex++; renderRecallCard(); });
    window.scrollTo(0, 0);
  }

  function renderRecallDone() {
    const t = rcTally();
    rcBody.innerHTML =
      '<div class="rc-done">' +
        '<span class="grad-logo"></span>' +
        '<h2>' + t.got + ' / ' + recall.length + ' locked in</h2>' +

        '<button class="rc-restart" id="rcRestart" type="button">Practise again</button>' +
      '</div>';
    markFlow('recall');
    rcBody.insertAdjacentHTML('beforeend', flowFooter('recall'));

  async function openRecall(force) {
    show('recall');
    if (!title || title === 'Your lesson') { renderRecallEmpty(); return; }
    if (recall && !force) { renderRecallCard(); return; }
    if (!force) {
      try { const c = JSON.parse(localStorage.getItem(RECALL_KEY) || 'null'); if (validRecall(c)) { recall = plainMathDeep(c); renderRecallCard(); return; } } catch (e) {}
    } else {
      rcState = { conf: {}, answers: {}, why: {} }; saveRcState(); rcIndex = 0;
    }
    if (recallBusy) return;
    recallBusy = true;
    const prog = renderRecallLoading();
    const system = 'You are Noura, a study tutor building ACTIVE RECALL prompts (not flashcards). Reply with ONLY a valid JSON array, no markdown fences, no commentary. Schema: [{"type": one of "define"|"explain"|"compare"|"example"|"mistake", "prompt": string (the question asked to the student, answerable from memory), "answer": string (the ideal answer, 1-3 sentences, concrete and complete)} x8]. Include a mix: at least one of each type. "define" asks for a key term, "explain" asks the student to explain an idea, "compare" asks them to contrast two concepts, "example" asks for a real-world example, "mistake" presents a common misconception to identify or correct. Prompts must be specific to the topic, never generic. No numbering in the prompt text. MATHS MUST BE PLAIN READABLE TEXT: never use LaTeX, never use dollar signs, backslash commands, \\frac, \\int, \\infty, ^{} or _{}. Write maths with ordinary letters, numbers and symbols the way a person types it in a message - for example "F(x) = the integral from negative infinity to x of f(t) dt", "x squared", "3/4", "the square root of 2", "pi", "<=". Spell out symbol names in words.';
    const user = 'Write the Recall cards for the topic: "' + title + '".' + (subject ? (' It is part of the subject "' + subject + '".') : '') + ' Depth: motivated high-school / intro-college student unless the title implies otherwise.';
    try {
      const raw = (await streamChat(
        { model: 'claude-sonnet-5', max_tokens: 4000, system: system, messages: [{ role: 'user', content: user }] },
        n => prog.report(n)
      )).trim();
      const a = raw.indexOf('['), b = raw.lastIndexOf(']');
      if (a === -1 || b === -1) throw new Error('No JSON in response.');
      const parsed = JSON.parse(raw.slice(a, b + 1)).filter(c => c && c.prompt && c.answer && RC_TYPES[c.type]);
      if (!validRecall(parsed)) throw new Error('Cards incomplete.');
      prog.done();
      recall = plainMathDeep(parsed); rcIndex = 0;
      try { localStorage.setItem(RECALL_KEY, JSON.stringify(parsed)); } catch (e) {}
      renderRecallCard();
    } catch (err) {
      prog.stop();
      renderRecallError('Could not build your Recall cards (' + err.message + '). Tap Regenerate to try again.');
    } finally { recallBusy = false; }
  }
  document.getElementById('rcRegen').addEventListener('click', () => openRecall(true));

  // ── Checkpoint ──────────────────────────────────────────────
  // A short understanding check: one question at a time, immediate
  // feedback, a follow-up after mistakes, then a summary with next steps.
  const CHECK_KEY = 'NOURA_CHECK_' + slug;
  const CP_TYPES = { mc: 'Multiple choice', short: 'Short answer', reasoning: 'Why / how', misconception: 'Misconception check', scenario: 'Apply it' };
  let check = null, checkBusy = false;
  let cpIndex = 0, cpResults = [];
  const cpBody = document.getElementById('cpBody');
  document.getElementById('cpTitle').textContent = title;

  function validCheck(q) {
    return Array.isArray(q) && q.length >= 3 && q.every(c =>
      c && c.q && c.concept && CP_TYPES[c.type] && c.why &&
      (c.type !== 'mc' || (Array.isArray(c.options) && c.options.length >= 2 && typeof c.answer === 'number')) &&
      (c.type === 'mc' || c.ideal));
  }
  function renderCheckEmpty() {
    cpBody.innerHTML = '<div class="br-empty"><span class="grad-logo"></span><p>Add a topic or material to generate a Checkpoint.</p></div>';
    document.getElementById('cpRegen').hidden = true;
  }
  function renderCheckLoading(msg) {
    document.getElementById('cpRegen').hidden = true;
    return tabLoading(cpBody, (msg || 'Building your Checkpoint… '), 2600, 'check');
  }
  function renderCheckError(msg) {
    cpBody.innerHTML = '<div class="br-empty"><span class="grad-logo"></span><p>' + esc(msg) + '</p></div>';
    document.getElementById('cpRegen').hidden = false;
  }

  function renderCheckQuestion() {
    document.getElementById('cpRegen').hidden = false;
    const total = check.length;
    if (cpIndex >= total) { renderCheckSummary(); return; }
    const item = check[cpIndex];
    const correctSoFar = cpResults.filter(r => r.correct).length;

    cpBody.innerHTML =
      '<div class="cp-meta">' +
        '<div class="cp-count">Question ' + (cpIndex + 1) + ' of ' + total + '</div>' +
        '<div class="cp-score">' + correctSoFar + ' correct</div>' +
      '</div>' +
      '<div class="cp-bar"><i style="width:' + Math.round((cpIndex / total) * 100) + '%"></i></div>' +
      '<div class="cp-card">' +
        '<div class="cp-type">' + esc(CP_TYPES[item.type]) + '</div>' +
        '<div class="cp-q"></div>' +
        '<div id="cpAnswerArea"></div>' +
        '<button class="cp-submit" id="cpSubmit" type="button" disabled>Submit answer</button>' +
        '<div id="cpFeedback"></div>' +
      '</div>';
    cpBody.querySelector('.cp-q').textContent = item.q;

    const area = document.getElementById('cpAnswerArea');
    const submit = document.getElementById('cpSubmit');
    let picked = -1;

    if (item.type === 'mc') {
      const wrap = document.createElement('div');
      wrap.className = 'cp-opts';
      item.options.forEach((opt, oi) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'cp-opt';
        b.innerHTML = '<span class="num">' + 'ABCDEFGH'[oi] + '.</span><span class="txt"></span>';
        b.querySelector('.txt').textContent = opt;
        b.addEventListener('click', () => {
          picked = oi;
          wrap.querySelectorAll('.cp-opt').forEach(o => o.classList.remove('sel'));
          b.classList.add('sel');
          submit.disabled = false;
        });
        wrap.appendChild(b);
      });
      area.appendChild(wrap);
    } else {
      const ta = document.createElement('textarea');
      ta.className = 'cp-input'; ta.id = 'cpText';
      ta.placeholder = 'Answer in a sentence or two…';
      ta.spellcheck = false;
      ta.addEventListener('input', () => { submit.disabled = !ta.value.trim(); });
      area.appendChild(ta);
    }

    submit.addEventListener('click', async () => {
      submit.disabled = true;
      let correct, feedback;
      if (item.type === 'mc') {
        correct = picked === item.answer;
        feedback = correct ? item.why : (item.whyWrong || item.why);
        area.querySelectorAll('.cp-opt').forEach((o, oi) => {
          o.classList.add('locked');
          if (oi === item.answer) o.classList.add('correct');
          else if (oi === picked) o.classList.add('wrong');
        });
      } else {
        const ta = document.getElementById('cpText');
        ta.readOnly = true;
        submit.textContent = 'Checking…';
        const graded = await gradeOpen(item, ta.value.trim());
        correct = graded.correct;
        feedback = graded.feedback;
      }
      cpResults[cpIndex] = { correct: correct, concept: item.concept, type: item.type };
      submit.remove();
      showFeedback(item, correct, feedback, total);
    });
    window.scrollTo(0, 0);
  }

  // Grade an open-ended answer. Falls back to self-marking if the call fails.
  async function gradeOpen(item, answer) {
    if (!answer) return { correct: false, feedback: 'No answer given.' };
    try {
      const system = 'You grade one short student answer. Reply with ONLY valid JSON: {"correct": boolean, "feedback": string}. Mark correct:true if the answer captures the key idea, even if worded loosely or incomplete in wording - you are testing understanding, not memorised phrasing. feedback: 1-2 short sentences. If correct, say briefly why it is right. If not, name the specific mistake and state the correct idea. Address the student as "you". No preamble.';
      const user = 'Question: ' + item.q + '\nIdeal answer: ' + item.ideal + '\nStudent answer: ' + answer;
      const r = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-sonnet-5', max_tokens: 400, system: system, messages: [{ role: 'user', content: user }] })
      });
      const data = await r.json();
      const raw = Array.isArray(data.content) ? data.content.filter(b => b.type === 'text').map(b => b.text).join('').trim() : '';
      const a = raw.indexOf('{'), b = raw.lastIndexOf('}');
      const parsed = JSON.parse(raw.slice(a, b + 1));
      if (typeof parsed.correct !== 'boolean') throw new Error('bad grade');
      return { correct: parsed.correct, feedback: String(parsed.feedback || '') };
    } catch (e) {
      return { correct: null, feedback: 'Could not auto-check that one — compare your answer with the ideal answer below.' };
    }
  }

  function showFeedback(item, correct, feedback, total) {
    const host = document.getElementById('cpFeedback');
    const good = correct === true;
    const cls = correct === null ? 'bad' : (good ? 'good' : 'bad');
    const head = correct === null ? 'Check it yourself' : (good ? 'Correct' : 'Not quite');
    let html = '<div class="cp-fb ' + cls + '"><b>' + head + '</b>' + esc(feedback || item.why);
    if (!good && item.type !== 'mc' && item.ideal) html += '<div class="cp-ideal"><b>Ideal answer</b>' + esc(item.ideal) + '</div>';
    if (!good && item.type === 'mc') html += '<div class="cp-ideal"><b>Correct idea</b>' + esc(item.why) + '</div>';
    html += '</div>';
    // One short follow-up when they got it wrong.
    if (!good) {
      const fu = item.followUp || ('In your own words, why is that the right answer for ' + item.concept + '?');
      html += '<div class="cp-follow"><div class="cp-label">Quick follow-up</div>' +
        '<div style="font-size:15px;line-height:1.5;color:#e8e8e6;margin-bottom:9px;">' + esc(fu) + '</div>' +
        '<textarea class="cp-input" id="cpFollow" placeholder="Answer in your own words…" spellcheck="false"></textarea></div>';
    }
    html += '<button class="cp-next" id="cpNext" type="button">' + (cpIndex === total - 1 ? 'See summary' : 'Next question') + '</button>';
    host.innerHTML = html;
    document.getElementById('cpNext').addEventListener('click', () => { cpIndex++; renderCheckQuestion(); });
    host.scrollIntoView({ block: 'nearest' });
  }

  function renderCheckSummary() {
    const total = check.length;
    const score = cpResults.filter(r => r.correct).length;
    const pct = score / total;
    const strong = [], weak = [];
    cpResults.forEach(r => {
      if (!r) return;
      const list = r.correct ? strong : weak;
      if (list.indexOf(r.concept) === -1) list.push(r.concept);
    });
    const weakSet = weak.filter(c => strong.indexOf(c) === -1);

    cpBody.innerHTML =
      '<div class="cp-sum-top">' +
        '<span class="grad-logo"></span>' +

  async function openCheck(force) {
    show('check');

    if (check && !force) { renderCheckQuestion(); return; }
    if (!force) {
      try { const c = JSON.parse(localStorage.getItem(CHECK_KEY) || 'null'); if (validCheck(c)) { check = plainMathDeep(c); cpIndex = 0; cpResults = []; renderCheckQuestion(); return; } } catch (e) {}
    }

    const system = 'You are Noura, a study tutor writing a short UNDERSTANDING CHECK (not a memorisation quiz). Reply with ONLY a valid JSON array, no markdown fences, no commentary. Schema: [{"type": one of "mc"|"short"|"reasoning"|"misconception"|"scenario", "concept": string (2-4 word label for the idea being tested, used to report strong/weak areas), "q": string (the question), "options": [string x4] (ONLY for type mc), "answer": number 0-based (ONLY for type mc), "ideal": string (the ideal answer, 1-2 sentences - required for every non-mc type), "why": string (1-2 sentences explaining why the correct answer is right), "whyWrong": string (ONLY for mc: 1 sentence naming the likely mistake), "followUp": string (REQUIRED for every question - one short follow-up question to ask if the student gets it wrong, pushing them to reason rather than recall)} x5]. EVERY object must include concept, why and followUp. Use FIVE questions covering five different types: one mc, one short, one reasoning (why/how), one misconception check, one scenario (apply it). Questions must test understanding of the topic, be concise, and be answerable in a sentence or two. No numbering in the question text. MATHS MUST BE PLAIN READABLE TEXT: never use LaTeX, never use dollar signs, backslash commands, \\frac, \\int, \\infty, ^{} or _{}. Write maths with ordinary letters, numbers and symbols the way a person types it in a message - for example "F(x) = the integral from negative infinity to x of f(t) dt", "x squared", "3/4", "the square root of 2", "pi", "<=". Spell out symbol names in words.';

        c && c.q && c.concept && CP_TYPES[c.type] && c.why &&

  const scBody = document.getElementById('scBody');

  // Everything the narrator says, in order — this is what goes to the server.
  // One ordered list of spoken segments. The audio script and the on-screen
  // transcript are both built from this, so highlight timings can never drift.
  function castSegments(c) {
    const segs = [{ label: 'Introduction', text: c.intro }];
    let pause = 0;
    c.recap.forEach((p, i) => {
      segs.push({ label: 'Part ' + (i + 1), text: p });
      if (c.pausePoints[i]) segs.push({ label: 'Pause and think', text: c.pausePoints[i] });

  }

  function wireCastPlayer(segs) {
    const playBtn = document.getElementById('pcPlay');
    const state = document.getElementById('pcState');
    const note = document.getElementById('pcNote');
    const seek = document.getElementById('pcSeek');
    const fill = document.getElementById('pcFill');
    const knob = document.getElementById('pcKnob');
    const curEl = document.getElementById('pcCur');
    const durEl = document.getElementById('pcDur');
    const speedBtn = document.getElementById('pcSpeed');
    const tr = document.getElementById('pcTr');
    const SPEEDS = [1, 1.25, 1.5, 2];

    // No word-level timings come back from TTS, so segment starts are derived
    // from character share of the whole script — accurate enough to follow along.
    const lens = segs.map(sg => sg.text.length);
    const total = lens.reduce((a, b) => a + b, 0) || 1;
    let starts = [];
    function computeStarts(dur) {
      starts = []; let acc = 0;
      for (let k = 0; k < lens.length; k++) { starts.push((acc / total) * dur); acc += lens[k]; }
    }

    let live = -1;
    function syncTranscript(t) {
      let idx = 0;
      for (let k = 0; k < starts.length; k++) if (t >= starts[k]) idx = k;
      if (idx === live) return;
      live = idx;
      tr.querySelectorAll('.pc-seg').forEach((el, k) => {
        el.classList.toggle('live', k === idx);
        el.classList.toggle('past', k < idx);
      });
      const el = tr.querySelector('.pc-seg.live');
      if (el && document.getElementById('pcAuto').classList.contains('on')) {
        el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }

    function paint() {
      const d = castAudio && castAudio.duration ? castAudio.duration : 0;
      const t = castAudio ? castAudio.currentTime : 0;
      const pct = d ? Math.min(100, (t / d) * 100) : 0;
      fill.style.width = pct + '%';
      knob.style.left = 'calc(' + pct + '% - 6px)';
      curEl.textContent = fmtTime(t);
      durEl.textContent = fmtTime(d);
      if (d) syncTranscript(t);
    }
    function syncPlayIcon() {
      const playing = castAudio && !castAudio.paused && !castAudio.ended;
      playBtn.innerHTML = playing
        ? '<svg viewBox="0 0 14 14"><path d="M2 1.2C2 .54 2.54 0 3.2 0H5.2C5.86 0 6.4 .54 6.4 1.2V12.8C6.4 13.46 5.86 14 5.2 14H3.2C2.54 14 2 13.46 2 12.8V1.2Z"/><path d="M8 1.2C8 .54 8.54 0 9.2 0H11.2C11.86 0 12.4 .54 12.4 1.2V12.8C12.4 13.46 11.86 14 11.2 14H9.2C8.54 14 8 13.46 8 12.8V1.2Z"/></svg>'
        : '<svg viewBox="0 0 14 14"><path d="M3 1.3C3 .6 3.75.2 4.35.56L12.1 6.26C12.66 6.6 12.66 7.4 12.1 7.74L4.35 13.44C3.75 13.8 3 13.4 3 12.7V1.3Z"/></svg>';
      playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    }
    function bindAudio() {
      castAudio.playbackRate = castRate;
      castAudio.ontimeupdate = paint;
      castAudio.onloadedmetadata = () => { computeStarts(castAudio.duration || 0); paint(); };
      castAudio.onended = () => { syncPlayIcon(); state.textContent = 'Finished — replay any time'; };
      castAudio.onplay = () => { syncPlayIcon(); state.textContent = 'Playing'; };
      castAudio.onpause = () => { syncPlayIcon(); if (!castAudio.ended) state.textContent = 'Paused'; };
    }
    if (castAudio) {
      bindAudio(); syncPlayIcon();
      computeStarts(castAudio.duration || 0); paint();
      state.textContent = castAudio.paused ? (castAudio.currentTime ? 'Paused' : 'Ready to play') : 'Playing';
    }

    // The voice takes a while to synthesise, so kick it off as soon as the
    // recap exists rather than waiting for the learner to press play.
    function generateAudio() {
      if (castGen) return castGen;
      state.textContent = 'Preparing audio…';
      note.innerHTML = '';
      castGen = (async () => {
        const r = await fetch('/api/tts', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: castScript(cast) })
        });
        if (!r.ok) {
          let msg = 'HTTP ' + r.status;
          try { const j = await r.json(); msg = j.error || msg; } catch (e) {}
          throw new Error(msg);
        }
        const blob = await r.blob();
        castUrl = URL.createObjectURL(blob);
        castAudio = new Audio(castUrl);
        bindAudio();
        return castAudio;
      })();
      castGen.then(() => {
        if (state.textContent === 'Preparing audio…') state.textContent = 'Ready to play';
      }).catch(err => {
        castGen = null;   // let the learner retry by pressing play
        state.textContent = 'Audio unavailable';
        note.innerHTML = '<div class="pc-note">' + esc(err.message) + '</div>';
      });
      return castGen;
    }

    playBtn.addEventListener('click', async () => {
      if (castAudio) { if (castAudio.paused) castAudio.play(); else castAudio.pause(); return; }
      playBtn.disabled = true;
      try {
        const a = await generateAudio();
        playBtn.disabled = false;
        if (a) { a.play(); syncPlayIcon(); }
      } catch (err) { playBtn.disabled = false; }
    });

    // Start synthesising immediately unless it is already done or running.
    if (!castAudio && !castGen) generateAudio();

    speedBtn.addEventListener('click', () => {
      castRate = SPEEDS[(SPEEDS.indexOf(castRate) + 1) % SPEEDS.length];
      speedBtn.querySelector('span').textContent = castRate + 'x';
      if (castAudio) castAudio.playbackRate = castRate;
    });
    seek.addEventListener('click', (e) => {
      if (!castAudio || !castAudio.duration) return;
      const rect = seek.getBoundingClientRect();
      castAudio.currentTime = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * castAudio.duration;
      paint();
    });

    const hideBtn = document.getElementById('pcHide');
    hideBtn.addEventListener('click', () => {
      const hidden = tr.style.display === 'none';

    });
    document.getElementById('pcAuto').addEventListener('click', (e) => e.currentTarget.classList.toggle('on'));

    // Ask a question about this recap; answered from the recap text itself.
    const askIn = document.getElementById('pcAsk');
    const askBtn = document.getElementById('pcAskBtn');
    const answer = document.getElementById('pcAnswer');
    async function ask() {
      const q = askIn.value.trim();
      if (!q) return;
      askBtn.disabled = true;
      answer.innerHTML = '<div class="pc-answer"><span class="shimmer-text">Thinking…</span></div>';
      try {
        const text = await streamChat({
          model: 'claude-sonnet-5', max_tokens: 700,
          system: 'You are Noura, answering a learner\'s question about an audio recap they just heard. Answer in 2-4 plain sentences using the recap below; if it does not cover the answer, say so briefly and then answer from your own knowledge. MATHS MUST BE PLAIN READABLE TEXT: no LaTeX, no dollar signs, no backslash commands.\n\nRECAP:\n' + castScript(cast),
          messages: [{ role: 'user', content: q }]
        });

        askIn.value = '';
      } catch (err) {
        answer.innerHTML = '<div class="pc-note">' + esc(err.message) + '</div>';
      } finally { askBtn.disabled = false; }
    }
    askBtn.addEventListener('click', ask);
    askIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
  }

  async function openCast(force) {
    show('cast');
    if (!title || title === 'Your lesson') { renderCastEmpty(); return; }
    if (cast && !force) { renderCast(); return; }
    if (!force) {
      try { const c = JSON.parse(localStorage.getItem(CAST_KEY) || 'null'); if (validCast(c)) { cast = c; renderCast(); return; } } catch (e) {}
    } else {

    }
    if (castBusy) return;
    castBusy = true;
    const prog = renderCastLoading();
    const system = 'You are Noura, writing a short spoken-word study recap that will be read aloud by a text-to-speech voice. Reply with ONLY a valid JSON object, no markdown fences, no commentary. Schema: {"intro": string (one warm opening line, must start with "Here\'s your quick recap of" and name the topic), "recap": [string x4-6] (the main recap, each item one spoken paragraph of 50-80 words, conversational, explaining the topic clearly and building in order), "pausePoints": [string x3] (each a spoken instruction telling the listener to pause and think, e.g. "Pause for a second. Can you explain why this matters in your own words?"), "questions": [string x3] (short reflection questions to ask the listener), "mistakes": [string x2] (each names a common misunderstanding and corrects it, spoken aloud), "summary": string (a 40-60 word spoken recap of the most important ideas)}. Write for the EAR: plain spoken sentences, no headings, no bullet characters, no markdown, no symbols, no LaTeX, no numbers written as formulas - spell out any maths in words. Total speaking time should be about 2-4 minutes.';
    const user = 'Write the Audio Recap for the topic: "' + title + '".' + (subject ? (' It is part of the subject "' + subject + '".') : '') + ' Depth: motivated high-school / intro-college student unless the title implies otherwise.';
    try {
      const raw = (await streamChat(
        { model: 'claude-sonnet-5', max_tokens: 3000, system: system, messages: [{ role: 'user', content: user }] },
        n => prog.report(n)
      )).trim();
      const a = raw.indexOf('{'), b = raw.lastIndexOf('}');
      if (a === -1 || b === -1) throw new Error('No JSON in response.');
      const parsed = JSON.parse(raw.slice(a, b + 1));
      if (!validCast(parsed)) throw new Error('Script incomplete.');
      prog.done();
      cast = parsed;
      try { localStorage.setItem(CAST_KEY, JSON.stringify(parsed)); } catch (e) {}
      renderCast();
    } catch (err) {
      prog.stop();
      renderCastError('Could not build your Audio Recap (' + err.message + '). Tap Regenerate to try again.');
    } finally { castBusy = false; }
  }
  document.getElementById('scRegen').addEventListener('click', () => openCast(true));

  // ── Generation ──
  const statusLines = ['Getting started', 'Planning the sections', 'Writing explanations and examples', 'Building your checkpoints', 'Polishing your lesson'];
  let statusIdx = 0;

  function okItem(it) {
    return (it && it.type === 'section' && it.title && Array.isArray(it.pages) && it.pages.length) ||
      (it && it.type === 'checkpoint' && it.title && Array.isArray(it.questions) && it.questions.length &&
        it.questions.every(qq => qq && qq.q && Array.isArray(qq.options) && qq.options.length >= 2 && typeof qq.answer === 'number'));
  }
  function validLesson(o) { return !!(o && Array.isArray(o.items) && o.items.length && o.items.every(okItem)); }

  // Keep only well-formed items so a truncated or partly malformed response
  // still yields a usable lesson instead of failing outright.
  function cleanLesson(o) {
    if (!o || !Array.isArray(o.items)) return null;
    const items = o.items.filter(okItem);
    if (!items.length) return null;
    return { title: o.title || title, items: items };
  }

  // Tolerant JSON reader: parses normally, and if the model's reply was cut
  // off mid-array, rewinds to the last complete item and closes the JSON.
  function readLessonJSON(raw) {
    const a = raw.indexOf('{');
    if (a === -1) throw new Error('No JSON in response.');
    const b = raw.lastIndexOf('}');
    if (b > a) { try { return JSON.parse(raw.slice(a, b + 1)); } catch (e) {} }
    const body = raw.slice(a);
    let depth = 0, inStr = false, esc = false;
    const cuts = [];
    for (let i = 0; i < body.length; i++) {
      const ch = body[i];
      if (esc) { esc = false; continue; }
      if (ch === '\\') { esc = true; continue; }
      if (ch === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (ch === '{' || ch === '[') depth++;
      else if (ch === '}' || ch === ']') { depth--; if (depth === 2) cuts.push(i); }
    }
    for (let k = cuts.length - 1; k >= 0; k--) {
      try {
        const o = JSON.parse(body.slice(0, cuts[k] + 1) + ']}');
        if (o && Array.isArray(o.items) && o.items.length) return o;
      } catch (e) {}
    }
    throw new Error('The reply was cut off.');
  }

  async function generate(force) {
    if (!force) {
      try { const c = JSON.parse(localStorage.getItem(DATA_KEY) || 'null'); if (validLesson(c)) { lesson = plainMathDeep(c); renderOverview(); return; } } catch (e) {}
    } else {
      state = { done: [], scores: {} }; saveState();
    }
    show('load');
    loadError.hidden = true; retryBtn.hidden = true; loadStatus.hidden = false;
    statusIdx = 0;
    const fill = document.getElementById('loadProgressFill');
    document.getElementById('loadProgress').style.display = 'block';
    // A full lesson runs ~9000 characters of JSON; the bar tracks that.
    const LESSON_CHARS = 9000;
    const prog = driveBar(fill, null, LESSON_CHARS, 'lesson');
    // Status line advances with real output, not a stopwatch.
    let lastIdx = -1;
    function setStatus(chars) {
      const i = Math.min(statusLines.length - 1, Math.floor((chars / LESSON_CHARS) * statusLines.length));
      if (i === lastIdx) return;
      lastIdx = i; statusIdx = i;
      loadStatus.innerHTML = '<span class="lbl"></span>';
      applyShimmer(loadStatus.querySelector('.lbl'), statusLines[i] + '…');
    }
    setStatus(0);

    const system = 'You are Noura, an expert study tutor who builds structured interactive lessons. Reply with ONLY a valid JSON object - no markdown fences, no commentary. Schema: {"title": string, "items": [ {"type":"checkpoint","title":"Warm-up","questions":[{"q":string,"options":[string,string,string,string],"answer":number (0-based index),"explain":string} x4]} , {"type":"section","title":string,"pages":[string x2]} x3 , one mid "checkpoint" (title "Checkpoint") after the first 2 sections with 4 questions, and a final "checkpoint" (title "Final checkpoint") at the end with 4 questions ]. The FIRST item must be the Warm-up checkpoint testing intuition before teaching. Each page is GitHub-flavored Markdown, 90-130 words, starting with a ## heading, using **bold** key terms, short paragraphs or bullets, one concrete example; write all maths in plain readable text (see the maths rule below). Questions must be answerable from the lesson (warm-up = common-sense intuition), each with exactly 4 options and a one-sentence explain. Keep the whole lesson tight and readable in 10-15 minutes. Be concise - no filler. MATHS MUST BE PLAIN READABLE TEXT: never use LaTeX, never use dollar signs, backslash commands, \\frac, \\int, \\infty, ^{} or _{}. Write maths with ordinary letters, numbers and symbols the way a person types it in a message - for example "F(x) = the integral from negative infinity to x of f(t) dt", "x squared", "3/4", "the square root of 2", "pi", "<=". Spell out symbol names in words.';
    const user = 'Build the interactive lesson titled: "' + title + '".' + (subject ? (' It is part of the subject "' + subject + '".') : '') + ' Depth: motivated high-school / intro-college student unless the title implies otherwise.';

    try {
      const raw = (await streamChat(
        { model: 'claude-sonnet-5', max_tokens: 20000, system: system, messages: [{ role: 'user', content: user }] },
        n => { prog.report(n); setStatus(n); }
      )).trim();
      const parsed = cleanLesson(readLessonJSON(raw));
      if (!parsed) throw new Error('Lesson structure incomplete.');
      prog.done();
      lesson = plainMathDeep(parsed);
      try { localStorage.setItem(DATA_KEY, JSON.stringify(parsed)); } catch (e) {}
      renderOverview();
    } catch (err) {
      prog.stop();
      document.getElementById('loadProgress').style.display = 'none';
      loadStatus.hidden = true;
      loadError.hidden = false;
      loadError.textContent = 'Something went wrong while building your lesson (' + err.message + ').';
      retryBtn.hidden = false;
    }
  }
  retryBtn.addEventListener('click', () => generate(true));

  openBrief();   // Study Brief comes first — the lesson builds when Learn is opened
})();
</script>
