<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noura Admin — User & Credit Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --grad:linear-gradient(140deg,#c4b5fd 0%,#a855f7 38%,#7c3aed 72%,#6d28d9 100%);
    --violet:#8b5cf6; --violet-2:#a855f7;
    --bg:#0A0A0B; --panel:#141416; --panel2:#0f0f10; --line:#26262b;
    --text:#E8E8E6; --dim:#9a9aa2; --faint:#6f6f76;
    --ok:#3fb950; --warn:#e3a008; --bad:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',-apple-system,sans-serif;
       -webkit-font-smoothing:antialiased;padding:28px 22px 60px}
  .wrap{max-width:1320px;margin:0 auto}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:11px}
  h1 .logo{width:26px;height:26px;background:var(--grad);
    -webkit-mask:url('logo.png') center/contain no-repeat;mask:url('logo.png') center/contain no-repeat}
  h2{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:30px 0 12px;display:flex;align-items:center;justify-content:space-between}
  .sub{color:var(--faint);font-size:13px;margin-top:5px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
  .card .k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .card .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:5px}
  .card .n{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.45}
  .v.good{color:#7ee2a8} .v.warn{color:#ffd37a} .v.bad{color:#ff9f9a} .v.hl{color:#b79df5}
  .bar{height:9px;border-radius:99px;background:#1c1c20;overflow:hidden;margin-top:9px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--grad)}
  .bar i.warn{background:linear-gradient(90deg,#e3a008,#f0b429)}
  .bar i.bad{background:linear-gradient(90deg,#ef4444,#f87171)}
  table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px;margin-top:4px}
  th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
     color:var(--faint);padding:0 12px 6px;cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--text)}
  td{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 12px;vertical-align:middle}
  td:first-child{border-left:1px solid var(--line);border-radius:11px 0 0 11px}
  td:last-child{border-right:1px solid var(--line);border-radius:0 11px 11px 0}
  tr.flag td{background:#1f1512;border-color:rgba(239,68,68,.35)}
  .pill{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:99px;display:inline-block}
  .pill.free{color:#c9c9ce;background:#26262b}
  .pill.pro{color:#93c5fd;background:rgba(59,130,246,.16);border:1px solid rgba(59,130,246,.3)}
  .pill.unlimited{color:#7ee2a8;background:rgba(63,185,80,.14);border:1px solid rgba(63,185,80,.3)}
  .pill.scholar{color:#b79df5;background:rgba(139,92,246,.16)}
  .pill.beta{color:#ffd37a;background:rgba(227,160,8,.13)}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  input,select,button{font-family:inherit}
  input[type=search],input[type=text],input[type=number],select{background:var(--panel2);border:1px solid #2a2a2e;border-radius:9px;
    padding:8px 11px;color:var(--text);font-size:13px;outline:none}
  input:focus,select:focus{border-color:var(--violet)}
  .plan-select{background:#1a1a1f;border:1px solid #33333d;color:#e4e4e7;border-radius:8px;padding:5px 8px;font-size:11.5px;font-weight:700;outline:none;cursor:pointer;transition:all .15s ease}
  .plan-select:focus, .plan-select:hover{border-color:var(--violet);background:#22222a}
  button{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 14px;
    color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s ease}
  button:hover{border-color:var(--violet)}
  .btn-primary{background:var(--grad);border:none;color:#fff}
  .btn-primary:hover{opacity:.9}
  .action-group{display:flex;gap:6px;align-items:center}
  .btn-award{background:rgba(63,185,80,.14);color:#7ee2a8;border:1px solid rgba(63,185,80,.3);border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer}
  .btn-award:hover{background:rgba(63,185,80,.26);border-color:#3fb950;color:#fff}
  .btn-deduct{background:rgba(239,68,68,.12);color:#ff9f9a;border:1px solid rgba(239,68,68,.28);border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer}
  .btn-deduct:hover{background:rgba(239,68,68,.24);border-color:#ef4444;color:#fff}
  .note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--violet);
    border-radius:0 10px 10px 0;padding:11px 14px;font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:10px}
  .note.warn{border-left-color:var(--warn)}
  .note.good{border-left-color:var(--ok);background:rgba(63,185,80,.06);color:#bbf7d0}
  .spark{display:flex;align-items:flex-end;gap:2px;height:52px;margin-top:10px}
  .spark i{flex:1;background:var(--violet);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
  .rows{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .row b{color:var(--dim);font-weight:600}
  .err{color:#ff9f9a;font-size:13px;margin-top:14px;background:#1f1512;padding:14px;border-radius:10px;border:1px solid rgba(239,68,68,.3)}
  .muted{color:var(--faint)}
</style>
    <script src="speed-insights-init.js"></script>
</head>
<body>
<div class="wrap">
  <h1><span class="logo"></span>Noura Admin — User & Credit Manager</h1>
  <div class="sub" id="periodLine">Loading…</div>
  <div id="stage"></div>
</div>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const KEY = new URLSearchParams(location.search).get('key') || '';
  const usd = n => (n == null ? '—' : '$' + Number(n).toFixed(Number(n) < 1 ? 4 : 2));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ago = ts => {
    if (!ts) return '—';
    const m = Math.floor((Date.now() - new Date(ts)) / 60000);
    if (m < 1) return 'now';
    if (m < 60) return m + 'm';
    if (m < 1440) return Math.floor(m / 60) + 'h';
    return Math.floor(m / 1440) + 'd';
  };

  let DATA = null, sortKey = 'balance', sortDir = -1;

  async function load() {
    try {
      const r = await fetch('/api/admin/summary?key=' + encodeURIComponent(KEY));
      if (!r.ok) {
        $('stage').innerHTML = '<div class="err"><b>Admin access denied.</b><br>Please open with your secret admin key: '
          + '<code>/admin.html?key=YOUR_NOURA_ADMIN_TOKEN</code><br>And ensure <code>NOURA_ADMIN_TOKEN</code> is configured.</div>';
        $('periodLine').textContent = '';
        return;
      }
      DATA = await r.json();
      render();
      reconcile();
    } catch (e) {
      $('stage').innerHTML = '<div class="err">Failed to connect to admin API: ' + esc(e.message) + '</div>';
    }
  }

  function render() {
    const { org, budget, config, daily, users, supabase_sync } = DATA;
    const pct = budget.ceiling_usd ? Math.min(100, budget.spend_usd / budget.ceiling_usd * 100) : 0;
    const cls = pct >= 100 ? 'bad' : pct >= budget.warn_pct ? 'warn' : '';
    const now = new Date(), end = new Date(config.period_end || Date.now() + 86400000 * 30);
    const daysLeft = Math.max(0, Math.ceil((end - now) / 86400000));
    const elapsed = Math.max(1, (now - new Date(config.period_start || Date.now() - 86400000)) / 86400000);
    const projected = budget.spend_usd / elapsed * (elapsed + daysLeft);

    $('periodLine').textContent =
      'Billing period ' + (config.period_start || '').slice(0, 10) + ' to ' + (config.period_end || '').slice(0, 10)
      + '  ·  ' + daysLeft + ' days left  ·  enforcement: ' + config.enforcement;

    let syncBanner = '';
    if (supabase_sync && supabase_sync.active) {
      syncBanner = '<div class="note good">✓ <b>Supabase Auth Synced</b>: ' + supabase_sync.count + ' registered database accounts loaded and linked with credit wallets.</div>';
    } else {
      syncBanner = '<div class="note">⚡ <b>Supabase Integration</b>: To automatically import all registered authentication users from Supabase, set <code>SUPABASE_SERVICE_ROLE_KEY</code> in your environment / <code>.env.local</code>. You can also award, deduct, and change subscription plans for any email below.</div>';
    }

    $('stage').innerHTML =
      syncBanner +
      '<h2>Organisation spend & model breakdown</h2>' +
      '<div class="cards">' +
        card('Total Org Spend', usd(org.usd), 'Across ' + (org.calls || 0) + ' metered calls', 'hl') +
        card('Anthropic Spend', usd(org.anthropic_usd || 0), (org.anthropic_calls || 0) + ' calls · ' + ((org.anthropic_tokens || 0)).toLocaleString() + ' tokens', 'hl') +
        card('NVIDIA Spend', usd(org.nvidia_usd || 0), (org.nvidia_calls || 0) + ' calls · NIM / FLUX / Riva', 'hl') +
        card('Total Sessions / Calls', String(org.calls || 0), 'Anthropic: ' + (org.anthropic_calls || 0) + ' · NVIDIA: ' + (org.nvidia_calls || 0)) +
        card('Budget Remaining', budget.remaining_usd == null ? '—' : usd(budget.remaining_usd),
             budget.ceiling_usd ? ('Ceiling: ' + usd(budget.ceiling_usd)) : 'Set ceiling in env', cls === 'bad' ? 'bad' : cls === 'warn' ? 'warn' : 'good') +
        card('Registered Users', String(users.length), 'Accounts in ledger & Supabase') +
        card('Credits Outstanding', String(users.reduce((a, u) => a + (u.balance || 0), 0).toLocaleString()),
             'Total active credit balance across users', 'hl') +
      '</div>' +
      (budget.ceiling_usd
        ? '<div class="bar"><i class="' + cls + '" style="width:' + pct.toFixed(1) + '%"></i></div>' : '') +
      '<div id="recon"></div>' +

      '<h2>Last 30 days</h2>' + spark(daily) +

      '<h2>Where the money goes</h2>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px">' +
        '<div><div class="card"><div class="k">By Provider</div>' + rows(org.by_provider || { 'Anthropic': org.anthropic_usd, 'NVIDIA': org.nvidia_usd }) + '</div></div>' +
        '<div><div class="card"><div class="k">By Surface</div>' + rows(org.by_surface) + '</div></div>' +
        '<div><div class="card"><div class="k">By Model</div>' + rows(org.by_model) + '</div></div>' +
      '</div>' +

      '<h2><span>Authentication Users, Plans & Provider Usage (' + users.length + ')</span></h2>' +
      '<div class="toolbar">' +
        '<input type="search" id="q" placeholder="Search by email, name or ID…">' +
        '<select id="tierF">' +
          '<option value="">All tiers</option>' +
          '<option value="free">Free Plan (500/day)</option>' +
          '<option value="pro">Pro Plan (5,000 credits)</option>' +
          '<option value="unlimited">Unlimited Plan (∞)</option>' +
          '<option value="low">Out of credits (0)</option>' +
          '<option value="has">Has credits (>0)</option>' +
        '</select>' +
        '<button id="customActionBtn" class="btn-primary">+ Quick Adjust (Award / Deduct / Plan)</button>' +
        '<button id="topBtn">Sort by balance</button>' +
        '<button id="csvBtn">Export CSV</button>' +
        '<span class="muted" style="font-size:12px;margin-left:auto" id="count"></span>' +
      '</div>' +
      '<div id="tableWrap"></div>';

    $('q').addEventListener('input', table);
    $('tierF').addEventListener('change', table);
    $('customActionBtn').addEventListener('click', () => promptQuickAction());
    $('topBtn').addEventListener('click', () => { sortKey = 'balance'; sortDir = -1; table(); });
    $('csvBtn').addEventListener('click', csv);
    table();
  }

  function card(k, v, n, cls) {
    return '<div class="card"><div class="k">' + k + '</div>'
      + '<div class="v ' + (cls || '') + '">' + v + '</div>'
      + '<div class="n">' + n + '</div></div>';
  }
  function rows(obj) {
    const e = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
    if (!e.length) return '<div class="n" style="margin-top:8px">No activity yet.</div>';
    return '<div class="rows">' + e.map(([k, v]) =>
      '<div class="row"><b>' + esc(k) + '</b><span>' + usd(v) + '</span></div>').join('') + '</div>';
  }
  function spark(daily) {
    if (!daily || !daily.length) return '<div class="card"><div class="n">No usage recorded yet.</div></div>';
    const max = Math.max.apply(null, daily.map(d => d.usd)) || 1;
    return '<div class="card"><div class="spark">' + daily.map(d =>
      '<i style="height:' + Math.max(2, d.usd / max * 100) + '%" title="' + d.date + ': ' + usd(d.usd) + '"></i>'
    ).join('') + '</div><div class="n">' + daily[0].date + ' to ' + daily[daily.length - 1].date + '</div></div>';
  }

  function filtered() {
    const q = ($('q').value || '').toLowerCase().trim();
    const tf = $('tierF').value;
    return (DATA.users || []).filter(u => {
      const tier = (u.tier || 'free').toLowerCase();
      if (tf === 'low') {
        if (!u.low) return false;
      } else if (tf === 'has') {
        if (u.low) return false;
      } else if (tf && tf !== tier) {
        return false;
      }
      return (!q || (u.email || '').toLowerCase().includes(q) || (u.id || '').toLowerCase().includes(q));
    });
  }

  function table(limit) {
    let rows = filtered().slice();
    rows.sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      if (x == null) return 1;
      if (y == null) return -1;
      return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
    });
    if (limit) rows = rows.slice(0, limit);
    $('count').textContent = rows.length + ' users shown';

    const cols = [
      ['email','User / Email'],
      ['tier','Subscription Plan'],
      ['balance','Credits'],
      ['actions','Actions Left'],
      ['tokens_left','Tokens Left'],
      ['anthropic_usd','Anthropic Cost'],
      ['nvidia_usd','NVIDIA Cost'],
      ['usd','Total Cost'],
      ['calls','Calls / Sessions'],
      ['last_seen','Last Active']
    ];
    const perAction = DATA.config.cost_per_action || 100;
    $('tableWrap').innerHTML = '<table><thead><tr>' +
      cols.map(c => '<th data-k="' + c[0] + '">' + c[1] + '</th>').join('') +
      '<th style="text-align:right">Credit Actions</th></tr></thead><tbody>' +
      (rows.length ? rows.map(u => {
        const left = Math.floor((u.balance || 0) / perAction);
        const userIdentifier = u.id || u.email;
        const userEmail = u.email || '';
        const currentTier = (u.tier || 'free').toLowerCase();
        const tokLeftStr = u.unlimited ? '\u221E' : (u.tokens_left ? u.tokens_left.toLocaleString() : '0');
        return '<tr class="' + (u.low ? 'flag' : '') + '">' +
          '<td><b>' + esc(u.email || u.id) + '</b>' + (u.email ? '' : ' <span class="muted">(anon ID)</span>') +
            (u.unlimited ? ' <span class="pill unlimited" style="margin-left:6px">unlimited</span>' : (currentTier === 'pro' ? ' <span class="pill pro" style="margin-left:6px">PRO</span>' : '')) + '</td>' +
          '<td>' +
            '<select class="plan-select" data-id="' + esc(u.id) + '" data-email="' + esc(userEmail) + '" data-target="' + esc(userIdentifier) + '">' +
              '<option value="free"' + (currentTier === 'free' ? ' selected' : '') + '>Free Plan (500/day)</option>' +
              '<option value="pro"' + (currentTier === 'pro' ? ' selected' : '') + '>Pro Plan (5,000 credits · $8/mo)</option>' +
              '<option value="unlimited"' + (currentTier === 'unlimited' ? ' selected' : '') + '>Unlimited Plan (∞)</option>' +
            '</select>' +
          '</td>' +
          '<td><b style="color:' + (u.balance > 0 ? '#7ee2a8' : '#ff9f9a') + '">' + (u.unlimited ? '\u221E' : u.balance.toLocaleString()) + '</b></td>' +
          '<td>' + (u.unlimited ? '\u221E' : (left > 0 ? left : '<span class="muted">0</span>')) + '</td>' +
          '<td class="muted">' + tokLeftStr + '</td>' +
          '<td>' + usd(u.anthropic_usd || 0) + ' <span class="muted" style="font-size:11px">(' + (u.anthropic_calls || 0) + ')</span></td>' +
          '<td>' + usd(u.nvidia_usd || 0) + ' <span class="muted" style="font-size:11px">(' + (u.nvidia_calls || 0) + ')</span></td>' +
          '<td><b>' + usd(u.usd) + '</b></td>' +
          '<td class="muted">' + (u.calls || 0) + '</td>' +
          '<td class="muted">' + ago(u.last_seen) + '</td>' +
          '<td style="text-align:right">' +
            '<div class="action-group" style="justify-content:flex-end">' +
              '<button class="btn-award" data-id="' + esc(u.id) + '" data-email="' + esc(userEmail) + '" data-target="' + esc(userIdentifier) + '">+ Award</button>' +
              '<button class="btn-deduct" data-id="' + esc(u.id) + '" data-email="' + esc(userEmail) + '" data-target="' + esc(userIdentifier) + '">- Deduct</button>' +
            '</div>' +
          '</td>' +
        '</tr>';
      }).join('')
       : '<tr><td colspan="11" class="muted" style="text-align:center;padding:24px">No users found. Use the "+ Quick Adjust" button to initialize credits or plan for any account.</td></tr>') +
      '</tbody></table>' +
      '<div class="note"><b>Plans & Credits</b>: Free Plan refreshes to 500 credits daily (UTC). Selecting <b>Pro Plan</b> immediately grants 5,000 credits ($8/mo). Switching to <b>Unlimited</b> grants unlimited AI study sessions.</div>';

    // Hook up Subscription Plan selectors
    $('tableWrap').querySelectorAll('.plan-select').forEach(sel => sel.addEventListener('change', async () => {
      const target = sel.dataset.id || sel.dataset.target;
      const email = sel.dataset.email;
      const newTier = sel.value;
      sel.disabled = true;
      try {
        const r = await fetch('/api/admin/set-tier', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Noura-Admin': KEY },
          body: JSON.stringify({ user_id: target, email: email, tier: newTier })
        });
        const d = await r.json();
        if (!r.ok) {
          alert(d.error || 'Failed to update subscription plan');
          sel.disabled = false;
          return;
        }
        if (newTier === 'pro') {
          alert('✓ Plan updated to Pro! 5,000 monthly credits activated.');
        } else if (newTier === 'unlimited') {
          alert('✓ Plan updated to Unlimited (∞)!');
        } else {
          alert('✓ Plan updated to Free Plan (500 daily credits).');
        }
        load();
      } catch (e) {
        alert('Network error updating plan: ' + e.message);
        sel.disabled = false;
      }
    }));

    // Hook up Award buttons
    $('tableWrap').querySelectorAll('.btn-award').forEach(b => b.addEventListener('click', async () => {
      const target = b.dataset.id || b.dataset.target;
      const email = b.dataset.email;
      const displayName = email || target;
      const amountStr = prompt('Award how many credits to ' + displayName + '?\n(e.g., 500 = 5 actions, 1000 = 10 actions, 5000 = 50 actions)', '1000');
      if (!amountStr) return;
      const amount = parseInt(amountStr, 10);
      if (isNaN(amount) || amount <= 0) { alert('Please enter a valid positive number'); return; }
      const reason = prompt('Reason for grant (purchase, promo, referral, admin, refund):', 'admin') || 'admin';
      
      try {
        const r = await fetch('/api/admin/grant', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Noura-Admin': KEY },
          body: JSON.stringify({ user_id: target, email: email, credits: amount, reason: reason.trim() })
        });
        const d = await r.json();
        if (!r.ok) { alert(d.error || 'Grant failed'); return; }
        alert('✓ Successfully awarded ' + amount + ' credits to ' + displayName + '!\nNew balance: ' + (d.balance != null ? d.balance : 'Updated'));
        load();
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }));

    // Hook up Deduct buttons
    $('tableWrap').querySelectorAll('.btn-deduct').forEach(b => b.addEventListener('click', async () => {
      const target = b.dataset.id || b.dataset.target;
      const email = b.dataset.email;
      const displayName = email || target;
      const amountStr = prompt('Remove/deduct how many credits from ' + displayName + '?', '500');
      if (!amountStr) return;
      const amount = parseInt(amountStr, 10);
      if (isNaN(amount) || amount <= 0) { alert('Please enter a valid positive number'); return; }
      const reason = prompt('Reason for deduction (admin_deduct, refund, adjustment):', 'admin_deduct') || 'admin_deduct';
      
      try {
        const r = await fetch('/api/admin/deduct', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Noura-Admin': KEY },
          body: JSON.stringify({ user_id: target, email: email, credits: amount, reason: reason.trim() })
        });
        const d = await r.json();
        if (!r.ok) { alert(d.error || 'Deduction failed'); return; }
        alert('✓ Successfully deducted ' + amount + ' credits from ' + displayName + '.\nNew balance: ' + (d.balance != null ? d.balance : 'Updated'));
        load();
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }));

    $('tableWrap').querySelectorAll('th[data-k]').forEach(th => th.addEventListener('click', () => {
      const k = th.dataset.k;
      sortDir = (sortKey === k) ? -sortDir : -1;
      sortKey = k;
      table(limit);
    }));
  }

  async function promptQuickAction() {
    const userEmail = prompt('Enter user Email or User ID:');
    if (!userEmail || !userEmail.trim()) return;
    const action = prompt('Choose action:\n1. Type "award" to add credits\n2. Type "deduct" to remove credits\n3. Type "plan" to change subscription plan', 'award');
    if (!action) return;
    const act = action.toLowerCase().trim();
    
    if (act === 'plan') {
      const plan = prompt('Enter new subscription plan:\n(free, pro, unlimited)', 'pro');
      if (!plan) return;
      const planClean = plan.trim().toLowerCase();
      const r = await fetch('/api/admin/set-tier', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Noura-Admin': KEY },
        body: JSON.stringify({ user_id: userEmail.trim(), tier: planClean })
      });
      const d = await r.json();
      if (!r.ok) { alert(d.error || 'Plan update failed'); return; }
      alert('✓ Successfully changed plan to "' + planClean + '" for ' + userEmail.trim() + (planClean === 'pro' ? ' (5,000 credits added)' : ''));
      load();
      return;
    }
    
    const isAward = act === 'award';
    const amountStr = prompt(isAward ? 'How many credits to award?' : 'How many credits to deduct?', '1000');
    if (!amountStr) return;
    const amount = parseInt(amountStr, 10);
    if (isNaN(amount) || amount <= 0) { alert('Invalid credit amount'); return; }
    
    const endpoint = isAward ? '/api/admin/grant' : '/api/admin/deduct';
    const reason = isAward ? 'admin' : 'admin_deduct';
    
    const r = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Noura-Admin': KEY },
      body: JSON.stringify({ user_id: userEmail.trim(), credits: amount, reason: reason })
    });
    const d = await r.json();
    if (!r.ok) { alert(d.error || 'Operation failed'); return; }
    alert('✓ Success! ' + (isAward ? 'Awarded ' : 'Deducted ') + amount + ' credits for ' + userEmail.trim() + '.\nNew balance: ' + d.balance);
    load();
  }

  function csv() {
    const head = ['id','email','tier','balance','actions','tokens_left','anthropic_usd','nvidia_usd','usd','anthropic_calls','nvidia_calls','calls','granted','spent','created','last_seen'];
    const body = filtered().map(u => head.map(h => JSON.stringify(u[h] == null ? '' : u[h])).join(','));
    const blob = new Blob([head.join(',') + '\n' + body.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'noura-users-credits.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  async function reconcile() {
    try {
      const r = await fetch('/api/admin/reconcile?key=' + encodeURIComponent(KEY));
      const d = await r.json();
      const el = document.getElementById('recon');
      if (!el) return;
      if (!d.configured) {
        el.innerHTML = '<div class="note">Anthropic reconciliation not configured. '
          + esc(d.note || '') + '</div>';
      } else if (d.error) {
        el.innerHTML = '<div class="note warn">Reconciliation failed: ' + esc(d.error) + '</div>';
      } else {
        const drift = Math.abs(d.delta_usd) > Math.max(0.05, d.anthropic_usd * 0.05);
        el.innerHTML = '<div class="note' + (drift ? ' warn' : '') + '">Anthropic reports '
          + usd(d.anthropic_usd) + ' this period; our ledger has ' + usd(d.ledger_usd)
          + '. Delta ' + usd(d.delta_usd) + '.'
          + (drift ? ' <b>That gap suggests a provider call is not being metered.</b>' : '') + '</div>';
      }
    } catch (e) { }
  }

  load();
})();
</script>
